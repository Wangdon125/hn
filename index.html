，并且有安装顺序要求，应该后安装______。","segments":["IGS驱动"],"full":"组态软件IFIX安装需要安装IFIX主程序与IGS驱动，并且有安装顺序要求，应该后安装 IGS驱动 。"},{"type":"fill","q":"工作面无线基站是集控网络的一个网络节点，其可完成______","segments":["无线覆盖、数据采集的功能"],"full":"工作面无线基站是集控网络的一个网络节点，其可完成  无线覆盖、数据采集的功能"},{"type":"fill","q":"矿用隔爆兼本质安全型网络交换机KJJ127-C和KJJ127-D光纤接口的区别，-C：2个千兆光纤接口2个百兆光纤接口______4个千兆光纤接口。","segments":["，-D："],"full":"矿用隔爆兼本质安全型网络交换机KJJ127-C和KJJ127-D光纤接口的区别，-C：2个千兆光纤接口2个百兆光纤接口  ，-D：  4个千兆光纤接口  。"},{"type":"fill","q":"MB3480协议转换模块具有______","segments":["4 个串口。"],"full":"MB3480协议转换模块具有  4 个串口。"},{"type":"fill","q":"电脑主机上可用于远程访问管理的软件有______","segments":["向日葵、ToDesk、TeamViewer、VNC等。"],"full":"电脑主机上可用于远程访问管理的软件有  向日葵、ToDesk、TeamViewer、VNC等。"},{"type":"fill","q":"工作面基站在工作正常情况下光口指示灯为______状态，数据中断时为 不亮______","segments":["黄色闪烁","状态。"],"full":"工作面基站在工作正常情况下光口指示灯为  黄色闪烁  状态，数据中断时为 不亮  状态。"},{"type":"fill","q":"MOXA3480/3180协议转换模块的功能是将______协议转换为MODBUSTCP______","segments":["MODBUSRTU","协议。"],"full":"MOXA3480/3180协议转换模块的功能是将  MODBUSRTU  协议转换为MODBUSTCP  协议。"},{"type":"fill","q":"塔基交换机及基站连接的光信号的波长为______，光信号的速率为1.25Gb/s。","segments":["1310nm"],"full":"塔基交换机及基站连接的光信号的波长为  1310nm  ，光信号的速率为1.25Gb/s  。"}],"short":[{"type":"short","q":"无线基站都有哪些指示灯？","answer":"AP模块、交换机电源灯—绿灯（正常工作时，指示灯为绿色；未工作时，指示灯不亮）； 故障灯—红灯（光口G1、G2未接入时，指示灯为红色；正常通讯时，光口G1、G2指示灯为黄色闪烁的状态，故障灯熄灭）； WIFI灯—绿灯（正常工作时，指示灯为绿色闪烁的状态；未工作时，指示灯不亮） 电口1、电口2、电口3（摄像仪）—绿灯（正常工作时，指示灯为绿色；数据传输时绿灯烁，未连接时，指示灯不亮）； 电口4（基站内部AP模块与交换机相连）—绿灯（内部连接正确且工作稳定时，指示灯为色，未连接或接触不良时，指示灯不亮）； 光口G1、G2—黄灯（正常工作时，指示灯为黄色闪烁状态；数据传输时黄灯闪烁，未连接时，指示灯不亮）。"},{"type":"short","q":"工作面数据无法上传，塔机交换机工作面方向千兆光口指示灯不亮，接入工作面第一台基站两个光口指示灯正常，简述处理方法。","answer":"①检查快插口接口尾纤是否干净，酒精棉擦拭晾干后查看是否通讯正常。②打光测试光纤及内部交换机尾纤是否有断芯情况。③将塔机交换机上工作面光纤快插头更换到其他空余千兆光口上查看通讯是否正常（交换机该插口的内部交换机接收接口（GR）故障）。"},{"type":"short","q":"显示器显示HNDZ，但没有画面，简述排查方法。","answer":"①查看网线连接是否正常。②查看显示屏供电电压是否正常。若不正常则查看工控机内12V电源模块是否正常。③检查HDMI转换模块是否损坏或没有插好。④查看工控机内HDMI延长线是否故障，更换HDMI延长线。⑤将该显示屏网线与其他正常显示屏网线调换，排查显示屏是否故障。"},{"type":"short","q":"连接塔机装置主机的显示器出现黑屏现象，简述排查方法。","answer":"①将该显示屏网线与其他正常显示屏网线调换，排除显示器本身的硬件问题。②查看连接的快插网线连接器是否损坏。③更换视频输出接口排查是否工控主机上的插座组件出现问题。④查看连接的工控主机前的电源指示灯，并测量工控机内部给显示器的DC12V电源输出是否正常。"},{"type":"short","q":"防爆键盘不能使用或在使用中出现鼠标失灵鼠标指针乱飘、键盘按键是什么原因？","answer":"①查看防爆键盘到主机的四芯线是否正常。②键盘内驱动板与工控机内键盘驱动板程序是否需要更新。③更换防爆键盘。"},{"type":"short","q":"井上集控操作台蜂鸣器不规律发出声音，授权后，井下设备自动一键启动是什么原因造成的？","answer":"主要因为操作台键盘板组件受干扰导致，更换键盘操作板即可恢复。"},{"type":"short","q":"集控操作台出现主控闪屏是什么原因造成的？","answer":"查看集控操作台内部线缆与音频耦合电路板连接状况，将操作台屏幕与音频耦合电路板连接线缆甩掉，操作台屏幕未出现闪屏状态，判定为音频耦合电路板故障。"},{"type":"short","q":"简述集控操作台修改按键名称的方法？","answer":"①使用远程软件连接操作台，账号root，密码root。②找到操作台按键名称所在文件夹，下载后修改。"},{"type":"short","q":"请简述工作面集控操作台的用途（至少列举4个）？","answer":"①可远程控制三机、泵站等工作面设备的启停。 ②可实现与工作面沿线的语音通话及闭锁停车。 ③可切换至应急模式控制MAX主机 ④可监控工作面主控、皮带主控的沿线及中位机状态。"},{"type":"short","q":"voip系统功能：","answer":"①和KTC101系统沿线语音连接，组成一个语音网络，能实现沿线自动接听功能； ②具有快速拨号一键上拨功能； ③具有音频信号与网络信号相互转换功能； ④一对一的单呼功能； ⑤通过通信调度控制软件和井下某一区域通话； ⑥从调度室对井下VOIP网络所有电话群播； ⑦监听井下音频； ⑧在特殊情况下对井下电话播放事先录制好的语音。"},{"type":"short","q":"电液控监控主机显示的支架数据信息未更新，简要分析原因。","answer":"①通讯问题：查看服务器通讯是否正常。 ②软件问题：软件重启查看服务器通讯能否恢复；参数配置错误或被修改。 ③供电问题：确定设备是否正常供电。 ④线路问题：线缆连接问题。 ⑤设备问题：排查设备是否故障。"},{"type":"short","q":"跟机视频软件中跟机视频画面不跟机，简要分析原因。","answer":"①查看跟机画面下方右侧自动化服务器是否正常为绿色。 ②跟机设备IP是否正确，为电液控监控主机IP。 ③跟机设备端口号是否正确默认为502。 ④查看电液控软件是否正常运行，服务器通讯是否正常。 ⑤查看煤机红外发射器供电是否正常，支架控制器是否有煤机位置。"},{"type":"short","q":"无线基站-Q版现场有CAN接口需求时，如何进行改线？","answer":"现场更改需要将4芯快插3号插针的线接标号为203(CANL)位置,4号插针的线接标号为204（CANH）位置。"},{"type":"short","q":"产品使用现场进行原光纤连接器与新光纤插座的产品匹配时，可通过更换原光纤连接器的瓷管组件解决，简述解决方法。","answer":"①使用小一字，逆时针旋转中间瓷管螺柱 ②瓷管螺柱完全旋出后，将瓷管组件从连接器插头上取下 ③将新的瓷管组件（红色部分）按照大、小键位对应的方式安装到连接器插在头上，然后用小一字顺时针拧紧中间的瓷管螺柱至完全锁紧。"},{"type":"short","q":"当使用modscan32测试设备通讯时，无法连接到从站设备，应如何排查问题？","answer":"①检查硬件连接线缆是否有松动，损坏，接触不良。 ②检查串口线、网线等连接是否正确，接口是否匹配。 ③确定从站是否上电正常工作，以及从站其他状态灯是否显示正常工作状态。 ④modscan32软件中核对波特率、数据位、停止位、奇偶校验位、设备地址、通讯协议是否与从站设备的设置一致。 ⑤网络配置，如果通过网络通讯检查网络设置，IP、子网掩码、网关是否正确，确保网络正常。 ⑥防火墙或者安全软件可能会阻止通讯，暂时关闭防火墙或安全软件，查看是否可以正常通讯。 ⑦可以更换测试方式，用其他测试软件或方法对从站设备进行单独测试，确定设备是否正常工作。 ⑧查看周边是否有干扰源，可能会影响通讯质量。"},{"type":"short","q":"地面无法远程井下集控主机，简要分析原因。","answer":"①查看地面电脑主机IP与井下集控主机是否为同一网段。 ②用地面主机PING井下集控主机是否可以PING 通。 ③查看远程软件参数是否设置准确。 ④井下与地面环网通讯是否正常。 ⑤井下集控主机是否运行正常，防火墙以及安全软件是否关闭。"},{"type":"short","q":"简述Modbus通讯主站和从站的区别。","answer":"Modbus主站和从站的主要区别在于它们在通信网络中的作用、数量、地址唯一性以及对接方式。 ①作用不同： 主站：可以在Modbus总线上发布查询命令，控制通信的进行，向从站发送请求，并处理从站返回的响应数据。 从站：不能在该Modbus总线上发布查询命令，只能响应主站的请求。 ②数量不同： 主站：在Modbus总线上是唯一的。 从站：在Modbus总线上可以有多个 1。 ③地址唯一性不同： 主站：具有唯一性。 从站：不具有唯一性，可以有多个。 ④对接方式不同： 主站：可以对接多个Modbus从站。 从站：只能对接一个Modbus主站。 ⑤功能码与存储区： 主站：负责发起通信请求和控制从站的操作。 从站：响应主站的请求并执行相应的操作。 ⑥通信发起： 主站：可以主动发出指令。 从站：不会主动发出指令。 ⑦通信控制权： 主站：具有控制权，可以主动发起通信请求并控制从站的操作。 从站：只能在接收到主站的请求后才能执行相应的操作。 ⑧数据交换： 主站：可以向从站发送读取或写入数据的请求，并从从站接收响应。 总结来说，Modbus主站是通信网络中的中心控制器，负责发起和控制通信，具有唯一地址和控制权，可以对接多个从站。从站则是被动响应的设备，没有唯一地址，只能对接一个主站，并根据主站的请求执行操作。"},{"type":"short","q":"华宁迅捷组态软件运行加密锁型号规格含义解释（例如HN500A1N5W20E2V5G1-c），简述HN200、W20、V3代表含义。","answer":"HN200代表支持20000点；W20代表WEB 服务器带 20 个网络客户；V3代表<=20 路视频输入。"}]},"zuhekai":{"choice":[],"judge":[],"fill":[{"type":"fill","q":"在主控制及显示总成上，隔离开关和接触器都有五种显示状态，分别是什么？灰色：______、浅红：______、绿色：______、黄色：______、大红：______。","segments":["不在线或无效","正常分闸态","正常合闸态","故障合闸态","严重故障态"],"full":"在主控制及显示总成上，隔离开关和接触器都有五种显示状态，分别是什么？灰色： 不在线或无效 、浅红： 正常分闸态 、绿色： 正常合闸态 、黄色： 故障合闸态 、大红： 严重故障态 。"},{"type":"fill","q":"上电后液晶不亮，一直黑屏，首先______，其次检查______，如果电源正常则______。","segments":["重新上电","上位机模块的电源线","更换上位机模块"],"full":"上电后液晶不亮，一直黑屏，首先 重新上电 ，其次检查 上位机模块的电源线 ，如果电源正常则 更换上位机模块 。"},{"type":"fill","q":"上电后检测硬盘，启动到“Jumpto 运行到0x26A78”后不再继续启动，是电子硬盘损坏，更换______。","segments":["上位机模块"],"full":"上电后检测硬盘，启动到“Jumpto 运行到0x26A78”后不再继续启动，是电子硬盘损坏，更换 上位机模块 。"},{"type":"fill","q":"我们开关每个接触器都______的机构，不需要停其他模块的电。","segments":["带有独立换向"],"full":"我们开关每个接触器都 带有独立换向 的机构，不需要停其他模块的电。"},{"type":"fill","q":"真空接触器主要由______、______、______及其他部分组成。","segments":["电磁装置","触点装置","灭弧装置"],"full":"真空接触器主要由 电磁装置 、 触点装置 、 灭弧装置 及其他部分组成。"},{"type":"fill","q":"接触器模块经常不明原因复位，先检查插针盒，无问题需要______。","segments":["更换接触器"],"full":"接触器模块经常不明原因复位，先检查插针盒，无问题需要 更换接触器 。"},{"type":"fill","q":"接触器模块出现短路保护、一项或多项粘连，先______，如不行更换接触器模块。","segments":["软件复位（功能+菜单，进入参数设置再退出）"],"full":"接触器模块出现短路保护、一项或多项粘连，先 软件复位（功能+菜单，进入参数设置再退出） ，如不行更换接触器模块。"},{"type":"fill","q":"接触器模块方向不明并且找方向失败、倒相失败，需要______。","segments":["更换接触器模块"],"full":"接触器模块方向不明并且找方向失败、倒相失败，需要 更换接触器模块 。"},{"type":"fill","q":"模块出现重号现象，先要检查______，没有问题则______。","segments":["模块插针盒","需要调换或更换模块"],"full":"模块出现重号现象，先要检查 模块插针盒 ，没有问题则 需要调换或更换模块 。"},{"type":"fill","q":"我们的隔离开关有______、______、______三功能合一的特点。","segments":["断路器","隔离开关","接地开关"],"full":"我们的隔离开关有 断路器 、 隔离开关 、 接地开关 三功能合一的特点。"},{"type":"fill","q":"隔离开关的机械寿命不小于______次，电气寿命不小于______次。","segments":["100万","2万"],"full":"隔离开关的机械寿命不小于 100万 次，电气寿命不小于 2万 次。"},{"type":"fill","q":"隔离开关经常不明原因复位，先查线路，若线路正常需要______。","segments":["更换隔离开关"],"full":"隔离开关经常不明原因复位，先查线路，若线路正常需要 更换隔离开关 。"},{"type":"fill","q":"隔离开关分闸失败，发生一相或多相粘连，需______。","segments":["更换隔离开关"],"full":"隔离开关分闸失败，发生一相或多相粘连，需 更换隔离开关 。"},{"type":"fill","q":"高压绝缘检测时上报______，高压绝缘检测试验失败，需要更换隔离开关。","segments":["自检不合格"],"full":"高压绝缘检测时上报 自检不合格 ，高压绝缘检测试验失败，需要更换隔离开关。"},{"type":"fill","q":"照明综保控制旋钮共有5个位置，分别为：______、______、______、______、______。","segments":["漏闭试验","复位","分闸","合闸","漏保试验"],"full":"照明综保控制旋钮共有5个位置，分别为： 漏闭试验 、 复位 、 分闸 、 合闸 、 漏保试验 。"},{"type":"fill","q":"我们开关照明综保有______输出，分别是______和______；每路输出都具备______、______、______等功能。","segments":["两种","127V","220V","过流保护","漏电闭锁","漏电保护"],"full":"我们开关照明综保有两种输出，分别是127V和220V；每路输出都具备过流保护、漏电闭锁、漏电保护等功能。"},{"type":"fill","q":"组合开关通讯接口包括______、______、______。","segments":["2路串口","1路CAN总线","1路以太网接口"],"full":"组合开关通讯接口包括 2路串口 、 1路CAN总线 、 1路以太网接口 。"},{"type":"fill","q":"开关做高压绝缘检测时，隔离开关手柄必须______。","segments":["在试验位"],"full":"开关做高压绝缘检测时，隔离开关手柄必须 在试验位 。"},{"type":"fill","q":"大开关启车方式可以分______、______、______、______、______、______。","segments":["先导方式","简易先导方式","远控方式","简远方式","检修方式","近控方式"],"full":"大开关启车方式可以分 先导方式 、 简易先导方式 、 远控方式 、 简远方式 、 检修方式 、 近控方式 。"},{"type":"fill","q":"接触器模块______或______时不能倒向。","segments":["不在线","为运行态"],"full":"接触器模块 不在线 或 为运行态 时不能倒向。"},{"type":"fill","q":"有连锁关系的模块倒向，可以按组合键______，根据窗体提示信息进行相应的操作。","segments":["菜单 + 数字“*”"],"full":"有连锁关系的模块倒向，可以按组合键 菜单 + 数字“*” ，根据窗体提示 字键实现了倒相，会出现的问题是：虽然倒相可以成功，但系统会给出提示，并______，因为联锁的模块中出现了某个模块______的错误。","segments":["禁止启动","方向"],"full":"有连锁关系的模块，按组合键功能+数字键实现了倒相，会出现的问题是：虽然倒相可以成功，但系统会给出提示，并 禁止启动 ，因为联锁的模块中出现了某个模块 方向 的错误。"},{"type":"fill","q":"液晶上显示RAM握手失败、获得句柄失败、释放句柄失败、信息交换机故障时，在主画面按______，退出主画面进入登录窗体，按______键重新进入主画面，其它窗体按“取消”，然后重新进入窗体，如果仍然显示同样故障，则更换______。","segments":["“功能”+“菜单”","“取消”","上位机模块"],"full":"液晶上显示RAM握手失败、获得句柄失败、释放句柄失败、信息交换机故障时，在主画面按 “功能”+“菜单” ，退出主画面进入登录窗体，按 “取消” 键重新进入主画面，其它窗体按“取消”，然后重新进入窗体，如果仍然显示同样故障，则更换 上位机模块 。"},{"type":"fill","q":"液晶上显示CAN线故障或通信故障，按______退出主画面进入登录窗体，按______键重新进入主画面，如果仍然显示同样故障，检查上位机模块插头和______。","segments":["“功能”+“菜单”","“取消”","CAN线"],"full":"液晶上显示CAN线故障或通信故障，按 “功能”+“菜单” 退出主画面进入登录窗体，按 “取消” 键重新进入主画面，如果仍然显示同样故障，检查上位机模块插头和 CAN线 。"},{"type":"fill","q":"不平衡保护是______发生相间短路或断相，及时停止接触器，防止过流烧坏电机或线路。","segments":["负荷侧"],"full":"不平衡保护是 负荷侧 发生相间短路或断相，及时停止接触器，防止过流烧坏电机或线路。"},{"type":"fill","q":"开关用于漏电闭锁检测的电压为______；用于高压绝缘检测的电压为直流______。","segments":["12V","3000V"],"full":"开关用于漏电闭锁检测的电压为 12V ；用于高压绝缘检测的电压为直流 3000V 。"},{"type":"fill","q":"开关发生暂态过压时，采用______的方式，减小电压峰值。发生稳态过压时，及时______。","segments":["阻容吸收","闭锁停止启动"],"full":"开关发生暂态过压时，采用 阻容吸收 的方式，减小电压峰值。发生稳态过压时，及时 闭锁停止启动 。"},{"type":"fill","q":"隔离开关和接触器模块总烧保险，则需要更换______或______。","segments":["隔离开关","接触器电控"],"full":"隔离开关和接触器模块总烧保险，则需要更换 隔离开关 或 接触器电控 。"},{"type":"fill","q":"开关不能启动应首先检查是否______，主回路的输出端对地漏电流大显示闭锁时，应当断开______开关再断开有故障一路的隔离开关，检查不启动一路漏电流的原因。","segments":["漏电闭锁","连锁"],"full":"开关不能启动应首先检查是否 漏电闭锁 ，主回路的输出端对地漏电流大显示闭锁时，应当断开 连锁 开关再断开有故障一路的隔离开关，检查不启动一路漏电流的原因。"}],"short":[{"type":"short","q":"开关使用范围及特点？","answer":"用于综合机械化煤矿井下工作面采煤机、刮板机、破碎机、转载机、泵站及胶带运输机等设备的起停控制。特点：每路接触器独立换向；快开门机构；带断路器功能的隔离开关（分断20KA）；光电对射技术无机械辅助触点；一体化模块设计；12寸大屏幕彩显；WINDOWS CE操作系统；高压进出线插头插座连接。"},{"type":"short","q":"真空接触器的工作原理？","answer":"真空接触器以真空为灭弧介质，主触点密封在真空灭弧管内。操作线圈通电时，触点弹簧和真空管自闭力使触点闭合；线圈断电时，反力弹簧克服真空管自闭力拉动触点断开。"},{"type":"short","q":"简述更换接触器模块的操作步骤及注意事项。","answer":"1.将两个隔离开关手柄扳到停止位置；2.主手柄扳到停止位置；3.按标识方向旋转接触器门体手柄180度拉开门；4.用专用安装杆插入接触器模块正上方紧固孔，逆时针旋转使模块缓慢移出；5.缓慢拉动模块前部拉杆（有滑动轴承，务必慢），露出提拉杆后轻轻抽出模块；6.安装时推到位后需将前部拉杆完全紧贴模块再紧固；7.关门时严禁用力，最后阶段关不上则略旋转手柄。"},{"type":"short","q":"分析所有接触器显示不在线的原因？","answer":"1.急停闭锁是否拍下，闭锁按钮后微动开关是否损坏；2.万用表测量主手柄转换开关；3.检查弹簧针是否接触良好；4.检查所有接触器模块电压等级是否与开关一致；5.可能某一个接触器模块有问题。"},{"type":"short","q":"控制部分电源180V都给哪几部分供电？","answer":"1.主控制及显示总成；2.接触器总成；3.隔离开关总成；4.隔爆腔外部模块供电；5.漏保工作电源。"},{"type":"short","q":"照明综保输出侧电压是多少？合闸后负荷侧无输出如何排查？","answer":"输出侧ABC相间220V，每相对零线127V。排查：1.先确认有输入电压（移变是否送电）；2.无输入则查输入侧保险和电源线；3.有输入但无输出则更换综保变压器；4.有输出则查输出侧保险、交流接触器、综保模块、综漏底板、转换开关；5.检查输出侧是否接地。"},{"type":"short","q":"程序运行正常但键盘不起作用，分析故障原因及处理办法。","answer":"1.先断电重新送电看是否恢复；2.更换键盘模块看是否正常；3.更换轻触键盘看是否正常；4.检查键盘后面接线是否脱落虚接。"},{"type":"short","q":"简述用笔记本电脑为组合开关更新上位机程序的操作步骤。","answer":"1.连接网线；2.开关上输入超级密码进参数设置，功能+模式转换得到IP地址；3.电脑改IP为169.254.*.*，ping开关IP确认连通；4.开关菜单选系统-刷新上位机程序；5.电脑打开传上位机程序软件，输入开关IP；6.开关按侦听，电脑10秒内点更新程序；7.传完后开关按取消退出；8.按功能+复位重启，HNDZ蓝窗3秒内按确认完成更新。"},{"type":"short","q":"简述用笔记本电脑为组合开关更新下位机程序的操作步骤。","answer":"1.连接网线获取IP；2.开关菜单选系统-接收下位机新程序；3.电脑打开传下位机程序软件输入IP；4.开关按侦听，电脑点更新程序；5.传完后退出接收界面；6.在参数设置中按系统/9进入在线更新窗体；7.按提示按数字键给对应模块传程序；8.等待提示编程成功；9.注意：掉电后需重新更新否则下位机不在线。"},{"type":"short","q":"隔离开关送电但显示不在线如何处理？","answer":"如手柄在断开位置属正常；否则退出窗体重进；仍不在线则检查隔离开关两个插头是否松动；再检查隔离开关手柄旋钮开关是否正常；都不是则需更换隔离开关。"},{"type":"short","q":"开关能做哪些试验？做相应试验时隔离开关手柄在什么位置？","answer":"1.接触器模块自检试验：隔离开关手柄在停止位置；2.隔离开关自检试验：手柄在试验位置；3.高压绝缘检测试验：手柄在试验位置；4.吸合试验：手柄在停止位置。"},{"type":"short","q":"做高压绝缘监测时监测值低于5兆欧如何处理？","answer":"1.先拔插头甩掉负荷侧，再做高压绝缘监测，如正常说明负荷侧电缆或电机有问题；2.如仍低于1兆欧，检查输出插座插针是否接地；3.更换接触器模块再测；4.甩掉阻尼吸收浪涌组件再测；5.甩掉接触器到出线插座三根动力电缆；6.如还不正常测接触器笼体绝缘。"},{"type":"short","q":"开关报重号故障怎样处理？","answer":"先检查模块插针盒（接触器重号）或隔离开关插头（隔离开关重号），如无问题则调换模块位置或更换模块。CAN线通信问题也可能导致重号。"},{"type":"short","q":"地面调试开关时真空接触器不吸合，提示欠压保护不允许启车，如何处理？","answer":"地面调试只供180V不供高压，欠压保护检测到电压不足。进入参数设置（功能+菜单），按模块编号进入对应模块保护设置，将欠压保护和欠压闭锁设为不启用即可。"},{"type":"short","q":"2号隔离开关手柄在停止位时照明综保无输出，扳到运行位仍无输出，但任意真空接触器吸合后照明综保恢复输出，原因及处理？","answer":"原因：综保变压器原边与接触器模块进线并接在一起。处理：按菜单/Alt加L/Tab吸合2号隔离开关即可使照明综保正常输出。"},{"type":"short","q":"开关内部有多少保险？都在什么位置？","answer":"1.主控模块电源插座旁1个；2.每个接触器电控组件上1个；3.每个隔离开关电控组件上1个；4.控制变压器原边1个；5.电压互感器原边和副边各1个；6.综保变压器原边2个；7.综保电源继电器输出侧2个；8.综保控制旋钮上1个；9.隔爆腔内先导回路保险；10.隔爆腔180V端子排保险。"},{"type":"short","q":"3300V开关能否用于1140V？1140V能否用于660V？需要改什么？","answer":"3300V组合开关控制变压器可输入1140V和3300V，可用于1140V；1140V组合开关控制变压器可输入1140V和660V，可用于660V。改为1140V供电需更换主控制器模块、改控制变压器进线端子、改综保变压器进线端子。"},{"type":"short","q":"简述组合开关的功能及特点。","answer":"功能：用于井下采煤机、刮板机、破碎机、转载机、泵站及胶带运输机等设备的起停控制。特点：一体化模块设计；无机械辅助触点（光电对射）；无控制回路接插件（航天弹簧针）；三相独立吸合分断技术；独立电动换向机构；隔离开关三功能合一；可记录30天操作和故障信息。"},{"type":"short","q":"为什么用开关实现多电机联锁启车而不用控制系统？","answer":"如果不带联锁，一个或多个模块被倒到反向后设备仍能启动，非常危险。在开关中设联锁后，启动前开关主机自动判断所有联锁模块方向，只要有一个方向不一致就绝不允许启动。"},{"type":"short","q":"解释术语：隔离开关、真空接触器、换向机构、漏电保护、漏电闭锁、高压绝缘检测、不平衡保护、短路保护、堵转保护、过压保护、欠压保护。","answer":"隔离开关：不带载分断，断开高压便于检修。接触器：频繁接通分断交直流电路。换向机构：调换三相中两相相序。漏电保护：起动后负荷侧绝缘下降到危险值时跳闸。漏电闭锁：起动前检测绝缘，低于设定值闭锁起动。高压绝缘检测：3000V直流测负荷侧绝缘水平。不平衡保护：相间短路或断相时及时停车。短路保护：短路时快速停车。堵转保护：转子卡死或低速过流时停车。过压保护：吸收暂态过电压。欠压保护：稳态欠压时闭锁或停车。"},{"type":"short","q":"开关做高压绝缘检测时，隔离开关手柄必须在什么位置？","answer":"隔离开关手柄必须打到试验位置。"},{"type":"short","q":"更换隔离开关时必须先做什么？","answer":"必须先停移变电站电，将隔离开关手柄打到停止位，然后进行更换。"},{"type":"short","q":"开关进入参数设置的超级密码算法是什么？","answer":"逐位N(N+2)取个位数（即(X+2)乘以X模10取余）。"},{"type":"short","q":"接触器模块与机笼采用什么连接方式？有什么优点？","answer":"采用触针式连接（航天弹簧针），无控制回路接插件，避免因加工离散性造成的接触不良和传统接插件接插困难易损坏的问题。"},{"type":"short","q":"我们的隔离开关极限开断电流和短路保护电流是多少？机械寿命和电气寿命？","answer":"极限开断电流20KA，短路保护电流10Ie。机械寿命不小于100万次，电气寿命不小于2万次。"},{"type":"short","q":"组合开关照明综保控制旋钮有哪几个位置？各起什么作用？","answer":"五个位置：漏闭试验（做漏电闭锁试验）、复位（断电停止工作）、分闸（得电工作但分闸状态）、合闸（吸合控制接触器合闸）、漏保试验（做漏电保护试验）。"},{"type":"short","q":"主手柄的功能和作用是什么？","answer":"主手柄作用：1.断开接触器和隔离开关的控制电；2.与接触器门体锁定机构关联。打到停止位时断开接触器和隔离开关控制电源。"},{"type":"short","q":"如何屏蔽模块及屏蔽时的注意事项？","answer":"在主画面按屏蔽键弹出屏蔽设置窗体，模块有效且在停车态时按数字键对相应模块屏蔽。注意：无效模块不能屏蔽；正在运行的模块不能屏蔽；与运行模块有联锁关系的非运行模块不能屏蔽。屏蔽后被屏蔽模块启动时不闭合，但整个设备启动逻辑不变。"},{"type":"short","q":"开关每次重新上电系统时间总回到1998年1月1号，历史记录也保存不了，分析原因并说明处理方法？","answer":"原因：主控里的纽扣电池没电了。处理方法：更换主控制及显示总成模块。"},{"type":"short","q":"开关经常出现白屏，分析原因并说明处理方法？","answer":"原因：主控内供电电路有问题。处理方法：更换主控制及显示总成模块。"},{"type":"short","q":"开关主控黑屏，分析原因并说明处理方法？","answer":"原因：①开关未供电（高压、低压）；②180V供电故障（电源线是否有电、是否插好、保险管是否完好、控制电源线路、控制变压器等）；③主控模块本身故障。处理方法：①②检查并处理供电；③更换主控制及显示总成。"},{"type":"short","q":"开关显示所有模块不在线，键盘不起作用，分析原因并说明处理方法？","answer":"原因：①19芯航空插头是否插好；②主控CAN通信有问题。处理方法：①插好19芯航空插头；②更换主控制及显示总成模块。"},{"type":"short","q":"开关上电进不去主画面，分析原因并说明处理方法？","answer":"原因：主控程序出现问题。处理方法：更换主控制及显示总成。"},{"type":"short","q":"接触器总烧保险，分析原因并说明处理方法？","answer":"原因：接触器电控组件电路故障。处理方法：更换接触器电控组件。"},{"type":"short","q":"接触器报远控或先导电阻值过大，分析原因并说明处理方法？","answer":"原因：接触器电控组件电路故障。处理方法：更换接触器电控组件。"},{"type":"short","q":"远控或先导对地短路，分析原因并说明处理方法？","answer":"原因：①接触器电控组件电路故障；②远控线或先导线接地。处理方法：①更换接触器电控组件；②更换远控线或先导线。"},{"type":"short","q":"接触器自检不合格，分析原因并说明处理方法？","answer":"原因：接触器电控组件电路故障。处理方法：更换接触器电控组件。"},{"type":"short","q":"接触器报合闸失败，分析原因并说明处理方法？","answer":"原因：①电控部分故障；②机械部分故障。处理方法：①更换接触器电控；②更换接触器机械部分。"},{"type":"short","q":"接触器停车态检测到吸合状态，分析原因并说明处理方法？","answer":"原因：①接触器机械部分异形螺柱故障；②真空管故障；③发生短路保护。处理方法：①②更换接触器机械部分；③进行软件复位。"},{"type":"short","q":"组合开关某接触器报漏电保护，分析原因并说明处理方法？","answer":"原因：①负荷侧设备绝缘低；②开关本身问题（阻尼浪涌吸收模块、接触器笼体到出线插座高压线、接触器笼体本身等阻值低）；③漏电保护阈值偏低；④漏保模块、综漏底板故障。处理方法：①做高压绝缘监测看电缆绝缘是否正常，不正常则拔掉输出侧电缆再测，正常则是电缆或负荷电机问题；②摘掉阻尼浪涌吸收模块、甩掉输出线及插座再做高压绝缘监测；③若还不正常测笼屉绝缘值；④与正常设备对换回路，若还报漏电说明开关本身问题，接触器漏电阈值调高3—5A；⑤换漏保模块，还不正常换综漏底板。"},{"type":"short","q":"开关报接触器重号，分析原因并说明处理方法？","answer":"原因：①接触器触点或地址触针上有污渍，影响接触；②地址触针接触不良、折断、脱落或触针弹簧失效；③触针盒内部触针线路断路；④接触器电控出现故障。处理方法：①对接触器触点进行清理；②检查弹簧针，更换有问题的弹簧针；③更换触针盒；④更换接触器电控。"},{"type":"short","q":"接触器报方向不明，分析原因并说明处理方法？","answer":"原因：①接触器模块换向机构有问题；②接触器电控故障。处理方法：①更换接触器机械组件；②更换接触器电控组件。"},{"type":"short","q":"隔离开关报合闸失败，分析原因并说明处理方法？","answer":"原因：①隔离开关手柄上转换开关后的微动开关故障；②隔离开关电控部分故障；③隔离开关机械部分故障。处理方法：①更换微动开关或短接隔离转换开关1、3端子；②更换隔离开关电控组件；③更换隔离开关机械部分。"},{"type":"short","q":"隔离开关在停车态检测到吸合，分析原因并说明处理方法？","answer":"原因：①隔离开关机械部分异形螺柱故障；②隔离开关真空管故障。处理方法：更换隔离开关。"},{"type":"short","q":"综保合闸后负荷侧没有输出，分析原因并说明处理方法？","answer":"原因：①漏电保护；②保险管、熔断器坏；③综保接触器坏；④综保模块坏；⑤综漏底板坏；⑥综保在接触器腔对应隔离开关未合闸。处理方法：①查看是否是综保保护，甩掉负荷侧做漏电试验、复位；②看综保指示灯红灯是否正常，不正常查综保工作保险是否烧坏或综保工作电源；③查小接触器进线三相电压，无电压则查综保变压器、高压熔断器；④进线有电压查综保隔离变压器；⑤综保红灯正常则查小接触器出线、综保熔断器，正常则更换综保模块，还不行更换综漏底板；⑥最后更换小接触器。"},{"type":"short","q":"控制电~180V无输出（主控制器黑屏），分析原因并说明处理方法？","answer":"原因：①滤波器坏；②控制隔离变压器坏；③控制变压器坏；④控制变压器原边保险（熔断器）坏。处理方法：①用万用表测控制隔离变压器副边是否有~180V，若有说明滤波器坏，更换滤波器；②若控制隔离变压器副边无~180V，测控制变压器副边，若有说明控制隔离变压器坏，更换或甩掉；③若控制变压器副边无~180V，看高压带电指示灯，灯亮说明高压控制变压器原边高压正常，需更换控制变压器，现场无控制变压器可用外部~180V或~127V临时替代；④灯不亮则断高压电检测高压熔断器。控制电~180V无输出时，可用开关内部综保~127V临时替代。"},{"type":"short","q":"组合开关带运输机，一启动运输机移变就跳电，分析原因并说明处理方法？","answer":"原因：①移变整定设置小，过流或漏电保护延时太短；②运输机负荷大过载；③运输机漏电；④开关自身工艺问题或自身漏电。处理方法：①更换回路看启动设备是否出现，若还顶移变说明开关没有问题，是负荷电机或电缆漏电或移变设置问题；②检查负载电缆电机是否漏电，若没漏电是负荷大而移变设定过小，调整移变参数；③若开关问题，检查并处理故障点。"},{"type":"short","q":"八组合开关5号接触器通过近控起车，停车后再次起车显示接触器启动间隔为31S，之后才能起车，分析原因并说明处理方法？","answer":"原因：正常情况下开关都有启动间隔，一般默认是7S；程序默认接触器启动间隔时间是3S，模块参数\"电机停车到漏电闭锁的时间\"出厂默认是4S，此参数被调整过大导致间隔31S。处理方法：调整接触器参数\"电机停车到漏电闭锁的时间\"为默认4S。"},{"type":"short","q":"开关带载采煤机总烧先导回路电阻，分析原因并说明处理方法？","answer":"原因：电缆屏蔽不好导致先导串进干扰电压，当干扰电压过大时会损坏电阻。处理方法：更换大功率电阻或并接旁路电容102、103，耐压500-2000V。"},{"type":"short","q":"开关带载采煤机一吸合就跳闸，保持不住吸合状态，分析原因并说明处理方法？","answer":"原因：电缆屏蔽不好导致先导串进干扰电压，当干扰电压过大时影响接触器控制电路。处理方法：甩掉先导线。"},{"type":"short","q":"请说出主控模块19芯插座定义。","answer":"（1）总CAN+；（2）总CAN-；（3）空；（4）空；（5）空；（6）网口1；（7）网口2；（8）网口3；（9）网口6；（10）COM2-GND；（11）COM2-TX；（12）COM2-RX；（13）COM1-GND；（14）COM1-TX；（15）COM1-RX；（16）KEY-CAN+；（17）KEY-CAN-；（18）KEY-5V；（19）KEY-GND。"},{"type":"short","q":"更换开关键盘模块的流程及注意事项？","answer":"流程：停移动变电站的电，将进入组合开关的所有电源切断。1.将与主控制及显示总成连接的电源插头和十九芯插头依次拔掉；2.将与键盘后座板连接的四芯插头拔掉；3.一手扶住压板，另一手将键盘模块压板周围的内六角螺丝拆下；4.将七芯穿墙端子引出的四芯插头从键盘检测板的I1位置上拔掉后取下压板；5.一手捏住键盘模块的边缘沿水平方向稍用力将其拔掉；6.取一新的键盘模块将背面的插针与键盘上的插孔对应好之后沿水平方向缓慢插入且插到底；7.将七芯穿线端子引出的四芯插头插于模块I1位置；8.将压板扣在前门上螺丝孔对准后同样从中间的螺钉拧起，再紧四周的螺钉；9.将拆下的四芯插头与键盘后座板相连；10.将十九芯插头和电源插头依次插在主控制及显示总成上。\n注意事项：1.拆卸时先拔电源插头，再拔十九芯插头；2.取出键盘模块时不可用力去拔线路板；3.注意拧内六角螺钉时的顺序不可随意拧；4.安装时先插十九芯插头，再插电源插头。"},{"type":"short","q":"我们的接触器的自动换向功能的优点是什么？","answer":"每个接触器模块都可通过键盘操作进行独立换相，换相时不必停隔离开关，并可根据设定对多驱动设备同时进行正反换相。"},{"type":"short","q":"说出真空接触器电控箱插针面板定义。","answer":"（1）联锁输出；（2）空；（3）联锁输出地；（4）地址线D0；（5）CAN-；（6）空；（7）空；（8）地址线D2；（9）CAN+；（10）空；（11）地址线D3；（12）远控地；（13）短路输出；（14）短路输出；（15）远控输出；（16）地址线D1；（17）AC1；（18）AC2；（19）空；（20）AC1；（21）AC2；（22）先导地；（23）空；（24）空；（25）先导输出；（26）电压采集；（27）电压采集；（28）空；（29）空。"},{"type":"short","q":"请说明接触器电控组件的拆装过程。","answer":"拆的过程：①卸下接触器模块前部提拉杆；②卸去电控组件两侧的螺丝；③将电控组件轻轻拉开（拉力过大很容易损坏插座），用小一字螺丝刀将图中1所指的插头两侧螺丝拧开拔开插头；④同理，图b中的2、3、4所指插头也用小一字螺丝刀把插头两侧螺丝拧开拔开插头；⑤最后将图c中5所指插头拔开，电控组件即可取下。安装过程和拆的过程正好相反。"},{"type":"short","q":"我们的隔离开关与机械隔离开关比有哪些优势？","answer":"①我们的隔离开关是集断路器、隔离开关、接地开关于一体的电气隔离开关；②结构简单维护方便（30分钟）；③通流能力强（1250A）；④切断能力强；⑤带有高压绝缘检测。"},{"type":"short","q":"请说出隔离开关12芯插座定义。","answer":"（1）试验；（2）运行；（3）地；（4）地址0；（5）地址1；（6）短路输出1；（7）短路输出2；（8）短路输出3；（9）短路输出4；（10）短路输出公共地；（11）CAN+；（12）CAN-。"},{"type":"short","q":"请说明隔离开关电控组件的拆装过程。","answer":"拆的过程：①拆下电抗器，将带红套管的连接线拆下；②把电控组件两侧的螺丝卸掉，放倒隔离开关，将电控组件拉开，用小一字螺丝刀把吸合线圈插头两端的螺丝拧到头，拔出插头；③将电控组件拉开，把位置反馈接口上的插头拔下即可取下电控组件。\n装的过程：①放置电控组件，将位置反馈插头插入位置反馈接口并将带红套管的线从连接线孔穿过；②把吸合线圈插头插入吸合线圈接口，将电控组件放入壳内（注意不要压线）；③将带红套管的连接线接到电抗器上，安装好电抗器；④把隔离开关立起来拧上两侧螺丝。"},{"type":"short","q":"在生产过程中控制变压器或隔离控制变压器烧坏了，如何处理？","answer":"副边（180V侧）：双控制变压器时，两路控制电通过电源切换板供电，首选第一路，第一路无输出则自动切到第二路；单控制变压器时，把从滤波器出来的180V交流电从端子排上卸下压到空端子上，把从综保出来的交流127V压到原来控制电180V的端子排上；不带综保时可通过隔爆腔引入外部综保~127V，接到180V端子排上，同时将180V控制线压到空端子。\n原边（1140V或3300V侧）：控制变压器烧了要把其进线从进线动力电缆上甩掉，注意控制变压器和第一路隔离开关的电压互感器并联，甩控制变压器时别把电压互感器也甩了；带电源切换的开关，第二路控制变压器和第二路隔离开关的电压互感器并联。甩控制变压器：把压到控制变压器输入端端子1上的粉线卸下压到电压互感器输入端接线端子1上。"},{"type":"short","q":"从电压互感器副边出来的电源信号都去哪里了？说出它们的用途。","answer":"从电压互感器副边出来的电源信号一路去了高压带电指示板，用于高压带电指示；一路去接触器内部控制电路，用于做过压、欠压保护。"},{"type":"short","q":"如果高压带电指示灯不亮，可能是什么原因，请分析。","answer":"可能的原因：（1）高压没上电；（2）指示灯板坏；（3）电压互感器坏；（4）电压互感器副边保险坏；（5）线路问题；（6）互感器原边保险。"},{"type":"short","q":"如果主控制器上无电压显示，是什么原因，该如何处理？","answer":"可能的原因：（1）电压互感器坏；（2）电压互感器副/原边保险坏；（3）线路问题（主手柄）。"},{"type":"short","q":"综保模块的作用是什么？","answer":"1.控制综保接触器的分闸与合闸；2.完成综保漏电闭锁试验与漏电保护试验；3.完成对综保接触器的保护。"},{"type":"short","q":"综保127V一上电就跳闸，如何处理？","answer":"1.检查线路；2.综保接触器；3.综漏底板。"},{"type":"short","q":"当动力电缆芯线过粗和过细时我们应该如何处理？","answer":"过细时紧密缠铜丝或加铜皮，过粗时均匀截掉外层芯线，之后加铜皮固定。"},{"type":"short","q":"进线电缆插头做好后，在灌胶前需要做些什么准备工作？","answer":"1.量绝缘（相间，相与地）；2.和插座对接看位置是否正确。"},{"type":"short","q":"说一下进口胶和国产胶的灌胶过程及注意事项。","answer":"过程：1.将组装好的电缆头平放，打开两个灌胶口，建议在1口处灌胶，2口用于通气；灌之前用塑料布或胶带把电缆外皮和内锥之间的空隙堵好，以防灌胶时从侧面渗漏。2.进口胶是桶装的，开盖后先将胶在桶内搅拌均匀，倒入大桶继续搅拌，边搅拌边放入凝固剂，凝固剂全部放入后再均匀放入沙子，不停搅拌，将胶、凝固剂和沙子搅拌均匀后，一袋沙子大约倒入2/3，观察胶的粘稠度，既不要太稀也不要太稠。国产胶是袋装的，凝固剂和胶在同一袋中分层存放，使用时抽出分隔条将胶和凝固剂混合，不需用沙子，不停揉搓封装袋将胶和凝固剂混合均匀，依次灌入电缆头即可，一个电缆头大约用5袋胶。3.把调好的胶在1口标记的孔处灌入，胶灌到与螺纹的底部平齐即可，如果胶比较稠，在绿色标记的孔灌完后，再在2口标记的孔处灌，灌到与螺纹底部平齐。\n注意事项：1.在两个口的螺纹处贴上胶布，方便灌完胶后对螺纹的残留物进行清理；2.灌胶后应再次测量各相之间、各相对地的绝缘性；3.灌完后电缆插头12小时不能移动，24小时后才能使用。"},{"type":"short","q":"出线电缆插头做好后，需要做些什么准备工作？","answer":"1.量绝缘（相间，相与地）；2.和插座对接看位置是否正确。"},{"type":"short","q":"请简述隔爆箱的作用。","answer":"（1）接先导启车控制；（2）接煤机闭锁前溜；（3）提供综保电源。"},{"type":"short","q":"当远控按钮不能启动时如何处理？","answer":"首先检查开关模块处于远控模式、开关液晶屏提示信息，然后检查远控沿线电缆是否有短路或断路等故障。"},{"type":"short","q":"简述漏电保护、漏电闭锁、高压绝缘检测三者之间的区别与联系。","answer":"漏电闭锁是在开关启动前检测开关输出侧到电机的绝缘水平；漏电保护是在开关启动后对开关输出侧到电机的绝缘程度进行检测；高压绝缘检测是用于测量单组启动器负荷侧主电缆和电动机绕组在3000V直流高压下的绝缘水平。三者构成了开关的漏电检测系统。"},{"type":"short","q":"隔离开关不在线，可能的原因有哪些？如何处理？","answer":"原因：①隔离开关电控组件故障；②180V供电问题（主手柄或隔离开关手柄在停止位、保险管坏、四芯插头是否插好、转换开关上的电源线是否接好）；③隔离开关与主控CAN通信故障（CAN线故障、1140与3300电控混用）。\n处理方法：①更换隔离开关电控组件；②处理供电；③处理CAN线，将所有电控换为同一电压等级。"},{"type":"short","q":"接触器不在线，可能的原因有哪些？如何处理？","answer":"原因：①接触器电控组件故障；②接触器与主控CAN通信故障（CAN通信线故障、1140和3300电控混用）；③供电故障（考虑180V电源尤其注意闭锁按钮及主手柄位置、保险管）。\n处理方法：①更换接触器电控组件；②处理CAN通信线，所有电控及主控需电压等级一致；③处理供电及检查更换保险管。"},{"type":"short","q":"隔离开关自检不合格，是什么原因，如何处理？","answer":"原因：隔离开关电控组件电路故障。\n处理方法：更换隔离开关电控组件。"}]},"peitao":{"choice":[{"type":"choice","q":"配套工程师开始配套的依据是","options":[{"key":"A","text":"业务人员电话通知"},{"key":"B","text":"业务人员提《任务实施单》"},{"key":"C","text":"市场部人员通知"},{"key":"D","text":"业务人员提《配套申请单》"}],"answer":"D"},{"type":"choice","q":"配套工程师给出拟定完成协议的方式是","options":[{"key":"A","text":"通过个人微信转交给业务人员"},{"key":"B","text":"通过《配套申请单》上传转交"},{"key":"C","text":"通过邮件转交给业务人员"},{"key":"D","text":"通过企业微信转交给业务人员"}],"answer":"B"},{"type":"choice","q":"配套工程师开始推送《项目订单申请单》依据是","options":[{"key":"A","text":"业务人员提《配套申请单》后"},{"key":"B","text":"业务人员签署完技术协议后"},{"key":"C","text":"业务人员通过《配套申请单》上传签署完成的技术协议"},{"key":"D","text":"业务人员电话通知后"}],"answer":"C"},{"type":"choice","q":"下列不属于《配套申请单》作用的是","options":[{"key":"A","text":"作为业务人员变更申请的依据。"},{"key":"B","text":"作为配套工程师开始配套的依据。配套工程师接收到此单后即可进行此项目的配套工作。"},{"key":"C","text":"作为业务人员获取技术协议的途径。配套工程师接收到配套申请后会根据单据需求进行协议拟定工作，并在配套申请单中进行上传，业务人员由此获取技术协议。"},{"key":"D","text":"作为配套工程师推送设备订单的依据。业务人员在此单据中上传签订完成的技术协议或无签署协议订单依据，标志着配套工程师可以推送产品订单。业务人员上传以上文件证明我司方案已经获得矿方同意，项目范围、设备配置明细已经确定并且业务已经对项目范围及供货明细进行确认，确保项目在商务可控范围内。配套工程师根据以上确认文件进行项目细化、分解、工作分配及部门协调工作。最终进行订单推送。"}],"answer":"A"},{"type":"choice","q":"下列不属于《项目订单申请单》中物料属性的是","options":[{"key":"A","text":"“ERP物料”"},{"key":"B","text":"“试制物料”"},{"key":"C","text":"“外购物料”"},{"key":"D","text":"“其他物料”"},{"key":"E","text":"“试装物料”"},{"key":"F","text":"“试装外购”"}],"answer":"D"},{"type":"choice","q":"以下不属于试装阶段工作的是","options":[{"key":"A","text":"试装准备"},{"key":"B","text":"样机备货"},{"key":"C","text":"试装跟踪"},{"key":"D","text":"协议拟定"}],"answer":"D"},{"type":"choice","q":"设备批量订单明细不包括","options":[{"key":"A","text":"试装留用产品"},{"key":"B","text":"试制产品"},{"key":"C","text":"ERP产品"},{"key":"D","text":"外购产品"}],"answer":"A"},{"type":"choice","q":"《项目订单申请单》提交时需要提交的依据不包括","options":[{"key":"A","text":"技术协议"},{"key":"B","text":"协议与实际需求偏差"},{"key":"C","text":"技术规格书"},{"key":"D","text":"协议中未体现项的确定依据"},{"key":"E","text":"试装报告"}],"answer":"C"},{"type":"choice","q":"协议审核时需要提交依据不包括","options":[{"key":"A","text":"技术规格书"},{"key":"B","text":"试装报告"},{"key":"C","text":"技术澄清涵"},{"key":"D","text":"前期偏离分析"}],"answer":"B"},{"type":"choice","q":"以下说法中不正确的是","options":[{"key":"A","text":"《项目订单申请单》提交时需要提交的依据为非终版时可以直接提交。"},{"key":"B","text":"如果存在需求变更、协议变更，补充协议或双协议等问题业务人员需要在《配套申请单》会签区进行体现，配套人员在会签区进行回复。"},{"key":"C","text":"配套人员接收到业务人员提出的需求变更后，如已对审核人员提交过相关审核依据，此时配套人员需要提交《项目变更申请单》进行变更审核依据。"},{"key":"D","text":"当审核人员审核完成配套人员提交的《项目订单申请单》后，配套人员若变更《项目订单申请单》中内容则必须提交《项目变更申请单》。"}],"answer":"A"},{"type":"choice","q":"当配套类型为“任务”类时，应以下列哪种方式将涉及的相关订单明细传递给业务","options":[{"key":"A","text":"通过企业邮箱以邮件形式发送给业务人员并对其进行告知。"},{"key":"B","text":"通过《项目订单申请单》提交相应订单，经过审核人员审核后生成正式订单。"},{"key":"C","text":"提《任务实施单》并经过审核人员审核后传递到业务人员处。"},{"key":"D","text":"提《配套文件审核单》并经过审核人员审核后传递到业务人员处。"}],"answer":"D"},{"type":"choice","q":"以下不属于配套过程中文件审核项的是","options":[{"key":"A","text":"《阀组配置单》"},{"key":"B","text":"配套任务类明细"},{"key":"C","text":"外发图纸"},{"key":"D","text":"技术协议"},{"key":"E","text":"配套过程中，配套人员可以在下列（C）文件中获取我司最新产品信息。"},{"key":"F","text":"《配套风险库》"},{"key":"G","text":"《技术协议功能库》"},{"key":"H","text":"《产品应用场景说明》"},{"key":"I","text":"《配套项目档案》"}],"answer":"C"},{"type":"choice","q":"以下不属于技术评审环节作用的是","options":[{"key":"A","text":"确定备货细节"},{"key":"B","text":"确定协议应对方案"},{"key":"C","text":"明确各部门解决方案职责"},{"key":"D","text":"明确公司应对策略"}],"answer":"A"},{"type":"choice","q":"以下不属于布局图作用的是","options":[{"key":"A","text":"确定产品布局位置"},{"key":"B","text":"确定线缆长度"},{"key":"C","text":"明确设备连接关系"},{"key":"D","text":"检查配置是否缺失"}],"answer":"B"},{"type":"choice","q":"配套过程中，配套人员可以在下列","options":[{"key":"A","text":"《配套风险库》"},{"key":"B","text":"《技术协议功能库》"},{"key":"C","text":"《产品应用场景说明》"},{"key":"D","text":"《配套项目档案》"}],"answer":"C"}],"judge":[],"fill":[{"type":"fill","q":"项目配套过程中《任务实施单》由______提交，由______确认后转入审核执行阶段。","segments":["配套人员","业务人员"],"full":"项目配套过程中《任务实施单》由 配套人员 提交，由 业务人员 确认后转入审核执行阶段。"},{"type":"fill","q":"配套人员推送《项目订单申请单》过程中，同一订单中如果存在相同物料则必须进行______后再进行推单工作，否则会导致订单出错。","segments":["合并"],"full":"配套人员推送《项目订单申请单》过程中，同一订单中如果存在相同物料则必须进行 合并 后再进行推单工作，否则会导致订单出错。"},{"type":"fill","q":"技术协议拟定前必须进行______。","segments":["偏离分析"],"full":"技术协议拟定前必须进行 偏离分析 。"},{"type":"fill","q":"______标志着配套阶段结束。","segments":["项目交底"],"full":"项目交底 标志着配套阶段结束。"},{"type":"fill","q":"《配套申请单》根据需求类型分为______与______两类。","segments":["配套项目","配套任务"],"full":"《配套申请单》根据需求类型分为 配套项目 与 配套任务 两类。"},{"type":"fill","q":"配套过程中涉及到传统产品部分由______推送订单。","segments":["业务人员"],"full":"配套过程中涉及到传统产品部分由 业务人员 推送订单。"},{"type":"fill","q":"配套工程师______（有权/无权）对《配套申请单》进行退回。","segments":["有权"],"full":"配套工程师 有权 （有权/无权）对《配套申请单》进行退回。" 上位机采用嵌入式计算机。","segments":["嵌入式"],"full":"KTC256通讯控制系统可实现综采、综掘工作面以及顺槽、固定胶带机等的保护、控制、沿线通话、故障精准定位、汉字显示及语音报警等功能，系统采用的是嵌入式技术，上位机采用嵌入式计算机。"},{"type":"fill","q":"KTC256系统将KTC101系统的脉冲查询与______通信融合，通信更加稳定，接入能力大幅提升。","segments":["CAN"],"full":"KTC256系统将KTC101系统的脉冲查询与CAN通信融合，通信更加稳定，接入能力大幅提升。"},{"type":"fill","q":"KTC256系统全新的UI采用______和______两种交互方式，提升易用性和可维护性。","segments":["可编程彩显按键","触摸大屏"],"full":"KTC256系统全新的UI采用可编程彩显按键和触摸大屏两种交互方式，提升易用性和可维护性。"},{"type":"fill","q":"KTC256系统沿线由1路电源变为______路电源，控制和语音供电分离，沿线带载能力提升。","segments":["2"],"full":"KTC256系统沿线由1路电源变为2路电源，控制和语音供电分离，沿线带载能力提升。"},{"type":"fill","q":"KTC256系统通过______解决长沿线及T型搭接问题，实现长距离、T型分叉控制。","segments":["智能中继"],"full":"KTC256系统通过智能中继解决长沿线及T型搭接问题，实现长距离、T型分叉控制。"},{"type":"fill","q":"KTC256主机安装时，站姿操作安装架高度调整为______cm，坐姿操作调整为______cm。","segments":["80","57"],"full":"KTC256主机安装时，站姿操作安装架高度调整为80cm，坐姿操作调整为57cm。"},{"type":"fill","q":"KTC256显示器接口中，______接口用于更新程序。","segments":["USB"],"full":"KTC256显示器接口中，USB接口用于更新程序。"},{"type":"fill","q":"控制器供电接口为两个2芯快插，分别为AC127V______和AC127V______。","segments":["输入","输出"],"full":"控制器供电接口为两个2芯快插，分别为AC127V输入和AC127V输出。"},{"type":"fill","q":"CS1沿线接口为______芯快插，用于与CS1沿线通讯。","segments":["八(8)"],"full":"CS1沿线接口为八(8)芯快插，用于与CS1沿线通讯。"},{"type":"fill","q":"CS1沿线接口线序中，1#为______、2#为音频、5#为______。","segments":["A18V+","B18V+"],"full":"CS1沿线接口线序中，1#为A18V+、2#为音频、5#为B18V+。"},{"type":"fill","q":"分布式IO沿线接口为______芯快插，用于与分布式IO通讯。","segments":["七(7)"],"full":"分布式IO沿线接口为七(7)芯快插，用于与分布式IO通讯。"},{"type":"fill","q":"AP接口为六芯快插，含四线网与电源，用于接______模块，也可以用于普通的以太网口。","segments":["WIFI"],"full":"AP接口为六芯快插，含四线网与电源，用于接WIFI模块，也可以用于普通的以太网口。"},{"type":"fill","q":"KTC256系统参数设置中，设备运行方式有集控、就地、检修、______四种。","segments":["点动"],"full":"KTC256系统参数设置中，设备运行方式有集控、就地、检修、点动四种。"},{"type":"fill","q":"皮带基本信息参数中，准备就绪输入点要求设备点______闭合才允许运行启车。","segments":["全部"],"full":"皮带基本信息参数中，准备就绪输入点要求设备点全部闭合才允许运行启车。"},{"type":"fill","q":"皮带电机电流模拟量参数中，输入频率最大值一般设置为______Hz。","segments":["2000"],"full":"皮带电机电流模拟量参数中，输入频率最大值一般设置为2000Hz。"},{"type":"fill","q":"轴承/绕组温度参数中，超温停车值应______超 ":"KTC256系统本身具备VOIP转换功能，无需增加______。","segments":["VOIP信号转换器"],"full":"KTC256系统本身具备VOIP转换功能，无需增加VOIP信号转换器。"}],"short":[{"type":"short","q":"简述KTC256系统相比KTC101系统的主要功能改进。","answer":"①全新的UI：可编程彩显按键+触摸大屏；②将脉冲查询与CAN融合，通信更稳定、接入能力提升；③双路电源，控制和语音供电分离，沿线带载能力提升；④智能中继解决长沿线及T型搭接；⑤集中IO变为分布式DIO；⑥轻量化电源、专电专用；⑦定制矿鸿操作系统。"},{"type":"short","q":"简述KTC256主机的显示器接口及功能（至少4个）。","answer":"①以太网：六芯快插，含四线网与电源，与隔爆计算机通讯；②主控：四芯快插，含双线网与电源，与主控通讯；③CAN：四芯快插，与操作台通讯；④USB：四芯快插，更新程序；⑤备用电源：六芯快插，供电预留。"},{"type":"short","q":"主界面沿线部分提示\"线路断在第X台之后\"，请列举可能原因及处理方法。","answer":"①第X台设备内部闭锁通讯模块输出侧CAN通讯故障——检测设备内部配线是否松动或掉落，正常则更换第X台设备内部闭锁通讯模块；②第X+1台设备内部闭锁通讯模块输入侧CAN通讯故障——同理更换；③第X台设备和第X+1台设备之间八芯连接器有断线或短路故障——更换八芯连接器。"},{"type":"short","q":"主界面提示\"线路断开主在第1台之后\"，请列举可能原因。","answer":"①CS模块沿线CAN通讯故障；②第一条八芯连接器有断线或短路故障；③主控后第一台设备内部闭锁通讯模块输入侧CAN通讯故障；④CS1/2的闭锁通讯（B18V/D18V）电源模块无输出故障。"},{"type":"short","q":"整条沿线无语音报警或语音报警声音断断续续但喊话正常，如何处理？","answer":"①主控模块报警电路故障——更换主控制器内部主控模块；②CS模块内部语音耦合放大板故障——更换CS模块内部语音耦合放大板。"},{"type":"short","q":"简述KTC256系统摄像头调试的关键步骤。","answer":"①浏览器输入摄像头IP及密码（默认admin/hn123456）登录；②在高级设置集成协议中勾选\"开放型网络视频接口\"；③按客户分配IP修改摄像头IP并保存；④将摄像头子码流参数按KTC256系统匹配的参数设置；⑤将摄像头与KTC256系统接入环网，IP设为同一网段；⑥在参数设置按\"K\"键进入\"系统融合\"选\"视频\"，将\"视频接入使能\"改为\"使能\"；⑦进入\"视频管理\"搜索摄像头、命名并写入，选择窗口关联画面。"},{"type":"short","q":"简述KTC256系统VOIP语音接入相对传统产品的区别及配置要点。","answer":"区别：传统产品（如KTC101）需在沿线串接一台VOIP信号转换器（VOIP终端）方可实现通话；KTC256系统本身具备转换功能，无需增加VOIP信号转换器。配置要点：将VOIP设备融入环网统一IP号段；在桌面管理系统选\"VOIP\"进入设置界面，设置主机分配的IP和用户名并应用保存；华宁自制主机端口5160、互联在线主机5060，需修改端口号时在服务器IP后加\":5060/5160\"；如需沿线电话按\"预警\"键回拨，在通讯录中增加回拨号码，姓名为\"控制台\"。"},{"type":"short","q":"简述KTC256系统程序更新的两种方式及注意事项。","answer":"①更新完整程序包（hndzz）：将程序放U盘根目录，主控用9针转USB线插在主控模块、显示器用4芯转USB线连接显示器USB接口，断电上电系统自动更新；②更新程序包（install_256Control）：将程序放U盘根目录，用4芯转USB线连接显示器USB接口，进入系统参数选择更新程序分别对主控和显示器更新。注意事项：U盘文件系统格式为FAT32；更新约4-10分钟；更新前确认更新包在U盘根目录；更新成功后需重启设备使新版本生效；更新出错会中止并恢复备份版本。"}]},"voip":{"choice":[{"type":"choice","q":"VOIP系统与KTC101系统沿线语音连接，能实现的功能不包括（　）。","options":[{"key":"A","text":"沿线自动接听"},{"key":"B","text":"快速拨号一键上拨"},{"key":"C","text":"音 CTS多媒体交换机都通过______协议进行通讯。","segments":["SIP"],"full":"FXO模拟中继模块和E1数字中继网关与CTS多媒体交换机都通过SIP协议进行通讯。"},{"type":"fill","q":"队列优先级中，priority值越______，优先级越高。","segments":["小"],"full":"队列优先级中，priority值越小，优先级越高。"},{"type":"fill","q":"一个调度台对应有______部调度分机号码，这两个号码即为调度员号码。","segments":["两(2)"],"full":"一个调度台对应有两(2)部调度分机号码，这两个号码即为调度员号码。"},{"type":"fill","q":"语音调度客户端提供______种发起\"呼叫\"的方法。","segments":["四(4)"],"full":"语音调度客户端提供四(4)种发起\"呼叫\"的方法。"},{"type":"fill","q":"强插是指调度员加入成员通话中，形成______会议。","segments":["三方"],"full":"强插是指调度员加入成员通话中，形成三方会议。"},{"type":"fill","q":"群呼会议需调度员参加，若调度员挂机则会议结束；群呼带______功能。","segments":["自动追呼"],"full":"群呼会议需调度员参加，若调度员挂机则会议结束；群呼带自动追呼功能。"},{"type":"fill","q":"会议功能调度员中途可退出，______自动追呼功能。","segments":["无"],"full":"会议功能调度员中途可退出，无自动追呼功能。"},{"type":"fill","q":"喊话是一个______通话的过程，只有调度员能说话，其他参会方只有收听权限。","segments":["单向"],"full":"喊话是一个单向通话的过程，只有调度员能说话，其他参会方只有收听权限。"},{"type":"fill","q":"置忙是开启调度员分机的______功能（DND）。","segments":["免打扰"],"full":"置忙是开启调度员分机的免打扰功能（DND）。"},{"type":"fill","q":"华宁自产VOIP服务器出厂默认IP为______。","segments":["169.254.6.250"],"full":"华宁自产VOIP服务器出厂默认IP为169.254.6.250。"},{"type":"fill","q":"华宁自产VOIP服务器登录用户名______，密码______。","segments":["admin","123"],"full":"华宁自产VOIP服务器登录用户名admin，密码123。"},{"type":"fill","q":"分机号支持3位和4位，有效分机号码范围______。","segments":["100~9999"],"full":"分机号支持3位和4位，有效分机号码范围100~9999。"},{"type":"fill","q":"分机端口使用5060端口需选择______类型，使用5160端口需选择______类型。","segments":["pjsip","sip"],"full":"分机端口使用5060端口需选择pjsip类型，使用5160端口需选择sip类型。"},{"type":"fill","q":"该系统设置的分机最大数目为______个。","segments":["128"],"full":"该系统设置的分机最大数目为128个。"},{"type":"fill","q":"桌面对讲电话默认IP为______，登录用户名______密码______。","segments":["192.168.6.179","admin","admin"],"full":"桌面对讲电话默认IP为192.168.6.179，登录用户名admin密码admin。"}],"short":[{"type":"short","q":"简述VOIP语音通讯调度系统的组成及主要设备。","answer":"系统主要由多媒体调度主机（CTS多媒体交换机）、3G-MDS多媒体指挥调度系统软件、桌面对讲电话、功放音响、KZG127矿用隔爆兼本安型信号处理器（拨号信号处理器）等组成。多媒体调度主机实现音视频编解码、协议控制和转换；3G-MDS软件对通信系统进行整体调度控制；调度台通过大屏幕触摸屏图形化显示通信状态，实现调度操作。"},{"type":"short","q":"简述VOIP系统与KTC101/KTC256系统的结合方式及差异。","answer":"传统产品（如KTC101）需在沿线串接一台VOIP信号转换器（VOIP终端）方可与VOIP系统实现通话；KTC256系统对此功能升级，井下KTC256系统无需增加VOIP信号转换器，系统本身具备转换功能。VOIP系统与KTC101/KTC256沿线语音连接，组成一个语音网络，实现沿线自动接听、单呼、群播、监听、播放预录制语音等功能。"},{"type":"short","q":"简述多媒体调度主机及调度台的主要功能。","answer":"多媒体调度主机实现音视频编解码、协议控制和转换，支持SS7、ISDN、中国一号、E&M、FXO、FXS等接口。调度台可通过大屏幕触摸屏图形化实时显示通信状态，与井下沿线电话拨号通话，实现点击呼叫、强插、强拆、代接、监听、禁话、转接、群呼、电话会议、扩声广播等调度操作；支持通信应急预案管理、组织结构管理、监控功能（未接来电、未注册、排队情况显示、故障告警及日志）。"},{"type":"short","q":"进入3G-MDS客户端后提示\"网络端口不可达\"且所有成员不在线，应如何处理？","answer":"先ping主机和各成员IP确认能否ping通。若能ping通，按以下排查：①检查主机IP是否被他人占用（拔下主机网线在其他电脑ping）；②主机IP错误（被删除或改动）；③多媒体调度主机死机（环境温度超50℃不能稳定工作）；④地面交换机不稳定（带载过多或接口不稳，断电重上电或更换）；⑤工控机网口问题（更换网卡）；⑥网线问题（检查交换机、主机、工控机之间网线）。"},{"type":"short","q":"简述自产VOIP服务器的配置步骤。","answer":"①准备工作：将电脑与服务器接入同一网络，修改电脑IP与服务器出厂默认IP（169.254.6.250）同网段，ping通；②登录：IE浏览器打开默认网址http://169.254.6.250:8080/voipserverLogin/index.jsp，输入用户名admin、密码123登录；③网络配置：在系统维护中设置服务器IP、子网掩码、默认网关、DNS，提交修改后重启服务器生效；④系统设置：在分机管理中添加/批量添加分机（分机号3-4位，范围100~9999），设置分机协议类型（5060端口选pjsip、5160选sip）及录音使能，更新配置并重启服务器生效。"},{"type":"short","q":"简述桌面对讲电话和信号转换器的配置要点。","answer":"①登录：IE浏览器输入默认IP 192.168.6.179，用户名admin、密码admin；②网络配置：设置IP类型、IP地址、子网掩码、网关、DNS，在\"高级\"中取消\"启用LLDP\"和\"启用学习功能\"两项勾选并提交；③线路配置：选择SIP，填写用户名、显示名、用户认证、验证密码、服务器地址、服务器端口、传输协议、注册有效期，提交后线路状态显示\"已注册\"；④电话设置：默认应答模式和默认拨号模式均选择\"音频\"。信号转换器如需回拨，在快捷键Softkey设置中将\"回拨\"软快捷键移入已选择区并上移至第一位置。"},{"type":"short","q":"简述广播、喊话、群呼、会议四种调度操作的区别。","answer":"①广播：调度员向选中的一个或多个分组中的所有分机播放录音，分为即时广播和定时广播；②喊话：调度员对目标成员进行事务通知，是单向通话，只有调度员能说话，其他参会方只有收听权限，操作和条件限制与群呼类似；③群呼：选中多个/一组/多组成员组建群呼会议，需调度员参加，调度员挂机则会议结束，带自动追呼功能；④会议：选中多个/一组/多组成员组建语音会议，调度员中途可退出，无自动追呼功能。"}]}};
const LSKEY='mineQuizProgress_v1';

const defState = { subj:'tongxin', type:'choice', idx:0, mode:'seq', order:{}, done:{}, right:{}, sel:{}, wrongBook:[] };
let state;
function loadState(){
  const s = JSON.parse(JSON.stringify(defState));
  try{
    const raw = localStorage.getItem(LSKEY);
    if(raw){ const p = JSON.parse(raw); for(const k in p){ s[k]=p[k]; } }
  }catch(e){}
  s.order=s.order||{}; s.done=s.done||{}; s.right=s.right||{}; s.sel=s.sel||{}; s.wrongBook=s.wrongBook||[];
  return s;
}
function saveState(){ try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){} }
state = loadState();

function pool(key,type){
  if(state.wrongBookMode){ return (state.wrongBook||[]).filter(w=>w.subj===key&&w.type===type); }
  return (DATA[key]&&DATA[key][type])||[];
}
function typeCount(key,typeKey){ return pool(key,typeKey).length; }
function subjectTotal(key){ return TYPES.reduce((s,t)=>s+typeCount(key,t.key),0); }
function subjectTotalReal(key){ return TYPES.reduce((s,t)=>s+((DATA[key]&&DATA[key][t.key])?DATA[key][t.key].length:0),0); }

let totalAll=0;
TYPES.forEach(t=>{ SUBJECTS.forEach(s=>{ totalAll += ((DATA[s.key]&&DATA[s.key][t.key])?DATA[s.key][t.key].length:0); }); });
document.getElementById('stTotal').textContent = totalAll;

function buildOrder(arr){
  const o = arr.map((_,i)=>i);
  if(state.mode==='random'){ for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } }
  return o;
}
function getOrder(key,type){
  if(state.wrongBookMode){ return pool(key,type).map(w=>w.realIdx); }
  const k=key+'|'+type;
  const arr=(DATA[key]&&DATA[key][type])||[];
  if(!state.order[k] || state.order[k].length!==arr.length){ state.order[k]=buildOrder(arr); }
  return state.order[k];
}
function curRealIdx(key,type){ const o=getOrder(key,type); let i=state.idx; if(i<0)i=0; if(i>=o.length)i=o.length-1; state.idx=i; return o[i]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inWrong(key,type,ri){ return (state.wrongBook||[]).some(w=>w.subj===key&&w.type===type&&w.realIdx===ri); }
function markAnswered(key,type,ri,ok){
  const k=key+'|'+type;
  if(!state.done[k]) state.done[k]={};
  if(!state.right[k]) state.right[k]={};
  state.done[k][ri]=true;
  if(ok) state.right[k][ri]=true; else delete state.right[k][ri];
  state.wrongBook = (state.wrongBook||[]).filter(w=>!(w.subj===key&&w.type===type&&w.realIdx===ri));
  if(!ok) state.wrongBook.push({subj:key,type,realIdx:ri});
  saveState(); renderStats();
}
function renderStats(){
  let done=0, right=0;
  SUBJECTS.forEach(s=>{ TYPES.forEach(t=>{
    const k=s.key+'|'+t.key;
    done += Object.keys(state.done[k]||{}).length;
    right += Object.keys(state.right[k]||{}).length;
  });});
  document.getElementById('stDone').textContent = done;
  document.getElementById('stRight').textContent = right;
  document.getElementById('stWrong').textContent = (state.wrongBook||[]).length;
  document.getElementById('stRate').textContent = (done? Math.round(right/done*100):0)+'%';
  document.getElementById('wrongBanner').classList.toggle('show', !!state.wrongBookMode);
  document.getElementById('btnWrong').classList.toggle('wrongon', !!state.wrongBookMode);
}

function resolveType(){
  const st = TYPES.filter(t=>typeCount(state.subj,t.key)>0);
  if(!st.length){ return false; }
  const curIdx = st.indexOf(TYPES.find(t=>t.key===state.type));
  if(curIdx<0){ state.type = st[0].key; }
  return true;
}
function renderSubjects(){
  const box=document.getElementById('subjects'); box.innerHTML='';
  SUBJECTS.forEach(s=>{
    const cnt = state.wrongBookMode ? subjectTotal(s.key) : subjectTotalReal(s.key);
    const b=document.createElement('button');
    b.className='sub'+(s.key===state.subj?' active':'')+(cnt===0?' off':'');
    b.innerHTML='<span class="n"><span class="ic">'+s.mark+'</span>'+esc(s.name)+'</span><span class="c">'+cnt+' 题</span>';
    b.disabled = cnt===0;
    b.onclick=()=>{ state.subj=s.key; state.idx=0; renderSubjects(); renderTabs(); render(); };
    box.appendChild(b);
  });
}
function renderTabs(){
  const box=document.getElementById('tabs'); box.innerHTML='';
  const st = TYPES.filter(t=>typeCount(state.subj,t.key)>0);
  document.getElementById('typeLabel').textContent = st.length ? (state.wrongBookMode?'错题 · 选择题型':'选择题型') : '本科目暂无题目';
  st.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(t.key===state.type?' active':'');
    b.innerHTML=esc(t.name)+'<small>'+typeCount(state.subj,t.key)+' 题</small>';
    b.onclick=()=>{ state.type=t.key; state.idx=0; renderTabs(); render(); };
    box.appendChild(b);
  });
}

function render(){
  const card=document.getElementById('card');
  const resolveOk = resolveType();
  if(!resolveOk){ card.innerHTML='<div class="empty">'+(state.wrongBookMode?'错题本为空，暂无错题':'该科目暂无题目')+'</div>'; updateNav(); return; }
  const key=state.subj, type=state.type;
  const order=getOrder(key,type);
  if(order.length===0){ card.innerHTML='<div class="empty">'+(state.wrongBookMode?'该科目暂无错题':'暂无题目')+'</div>'; updateNav(); return; }
  const realIdx=curRealIdx(key,type);
  const q=DATA[key][type][realIdx];
  const qk=key+'|'+type+'|'+realIdx;
  const tagName=TYPES.find(t=>t.key===type).name;

  const meta=document.createElement('div'); meta.className='q-meta';
  meta.innerHTML='<span class="tag'+(state.wrongBookMode&&inWrong(key,type,realIdx)?' wrong-tag':'')+'">'+esc(tagName)+(state.wrongBookMode&&inWrong(key,type,realIdx)?'·错题':'')+'</span><span class="q-prog">'+(state.idx+1)+' / '+order.length+'</span>';
  const qtext=document.createElement('div'); qtext.className='qtext';
  if(type==='fill'){ qtext.innerHTML=esc(q.q).replace(/______/g,'<span class="blank">____</span>'); }
  else { qtext.textContent=q.q; }
  card.innerHTML='';
  card.appendChild(meta); card.appendChild(qtext);

  const dk=key+'|'+type;
  const done = !!(state.done[dk] && state.done[dk][realIdx]);
  const feedback=document.createElement('div'); feedback.className='feedback';

  if(type==='choice'){
    if(!state.sel[qk]) state.sel[qk]={chosen:[]};
    const sel=state.sel[qk].chosen;
    const ansSet=new Set(String(q.answer).split(''));
    const opts=document.createElement('div'); opts.className='opts';
    q.options.forEach(o=>{
      const b=document.createElement('button'); b.className='opt';
      const isSel = sel.indexOf(o.key)>=0;
      if(!done && isSel) b.classList.add('sel');
      if(done){
        if(ansSet.has(o.key)) b.classList.add('correct');
        else if(isSel) b.classList.add('wrong');
        else b.classList.add('dim');
      }
      b.innerHTML='<span class="k">'+o.key+'</span><span class="txt">'+esc(o.text)+'</span>';
      b.disabled=done;
      b.onclick=()=>{
        if(done) return;
        const i=sel.indexOf(o.key);
        if(i>=0) sel.splice(i,1); else sel.push(o.key);
        saveState(); render();
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
    const act=document.createElement('div'); act.className='action';
    if(!done){
      const sub=document.createElement('button'); sub.className='primary';
      sub.textContent='提交答案'; sub.disabled=sel.length===0;
      sub.onclick=()=>{
        const chosen=[...sel].sort().join('');
        const ansA=[...ansSet].sort().join('');
        const okq = chosen.length>0 && chosen===ansA;
        markAnswered(key,type,realIdx,okq);
        toast(okq?'回答正确':'回答错误');
        render();
      };
      act.appendChild(sub);
    } else {
      const okq=!!(state.right[dk]&&state.right[dk][realIdx]);
      const again=document.createElement('button'); again.className='ghost'; again.textContent='重新作答';
      again.onclick=()=>{ delete state.done[dk][realIdx]; delete (state.right[dk]||{})[realIdx]; saveState(); render(); };
      act.appendChild(again);
      feedback.className='feedback show '+(okq?'ok':'err');
      feedback.innerHTML=(okq?'<span class="ans">回答正确</span>':'<span class="ans">回答错误</span>')+'　正确答案：<span class="ans">'+esc(q.answer)+'</span>';
    }
    card.appendChild(act);
  } else if(type==='judge'){
    const row=document.createElement('div'); row.className='judge-row';
    [['√','对'],['×','错']].forEach(([val,label])=>{
      const b=document.createElement('button'); b.className='jbtn';
      const isAns=val===q.answer;
      if(done){ if(isAns) b.classList.add('correct'); else b.classList.add('wrong'); }
      b.textContent=label; b.disabled=done;
      b.onclick=()=>{ const okq=val===q.answer; markAnswered(key,type,realIdx,okq); render(); toast(okq?'判断正确':'判断错误'); };
      row.appendChild(b);
    });
    card.appendChild(row);
    if(done){
      const okq=!!(state.right[dk]&&state.right[dk][realIdx]);
      const again=document.createElement('div'); again.className='action';
      const ab=document.createElement('button'); ab.className='ghost'; ab.textContent='重新作答';
      ab.onclick=()=>{ delete state.done[dk][realIdx]; delete (state.right[dk]||{})[realIdx]; saveState(); render(); };
      again.appendChild(ab); card.appendChild(again);
      feedback.className='feedback show '+(okq?'ok':'err');
      feedback.innerHTML=(okq?'<span class="ans">判断正确</span>':'<span class="ans">判断错误</span>')+'　正确答案：<span class="ans">'+(q.answer==='√'?'对':'错')+'</span>';
    }
  } else if(type==='fill'){
    if(!state.sel[qk]) state.sel[qk]={fill:[],per:[],checked:false};
    const sd=state.sel[qk];
    const segs=q.segments||[];
    const parts=q.q.split('______');
    const fw=document.createElement('div'); fw.className='fill-wrap';
    for(let bi=0;bi<parts.length;bi++){
      if(parts[bi]){ const sp=document.createElement('span'); sp.className='fill-text'; sp.textContent=parts[bi]; fw.appendChild(sp); }
      if(bi<parts.length-1){
        const inp=document.createElement('input'); inp.type='text'; inp.placeholder='输入第'+(bi+1)+'空';
        inp.className='fill-input';
        inp.value = sd.fill[bi]||'';
        if(sd.checked){ inp.classList.add(sd.per[bi]?'input-ok':'input-err'); inp.disabled=true; }
        inp.oninput=()=>{ sd.fill[bi]=inp.value; sd.checked=false; sd.per=[]; saveState(); };
        fw.appendChild(inp);
      }
    }
    card.appendChild(fw);
    const act=document.createElement('div'); act.className='action';
    if(!sd.checked){
      const chk=document.createElement('button'); chk.className='primary'; chk.textContent='检查答案';
      chk.onclick=()=>{
        sd.per=segs.map((s,bi)=>{
          const typed=(sd.fill[bi]||'').trim().toLowerCase().replace(/\s+/g,'');
          const exp=String(s).trim().toLowerCase().replace(/\s+/g,'');
          return typed!=='' && typed===exp;
        });
        sd.checked=true;
        const okq = sd.per.length>0 && sd.per.every(Boolean);
        markAnswered(key,type,realIdx,okq);
        toast(okq?'回答正确':'回答错误');
        render();
      };
      act.appendChild(chk);
    } else {
      const okq=!!(state.right[dk]&&state.right[dk][realIdx]);
      const again=document.createElement('button'); again.className='ghost'; again.textContent='重新填写';
      again.onclick=()=>{ sd.checked=false; sd.per=[]; delete state.done[dk][realIdx]; delete (state.right[dk]||{})[realIdx]; saveState(); render(); };
      act.appendChild(again);
      const list = segs.map((s,bi)=>(bi+1)+'空：'+esc(s)).join('<br>');
      feedback.className='feedback show '+(okq?'ok':'err');
      feedback.innerHTML=(okq?'<span class="ans">回答正确</span>':'<span class="ans">回答错误</span>')+'<span class="hint">参考答案<br>'+list+'</span>';
    }
    card.appendChild(act);
  } else if(type==='short'){
    const act=document.createElement('div'); act.className='action';
    const b=document.createElement('button'); b.className='primary';
    b.textContent = done?'收起答案':'查看参考答案';
    b.onclick=()=>{
      if(!state.done[dk]) state.done[dk]={};
      if(state.done[dk][realIdx]){ delete state.done[dk][realIdx]; }
      else { state.done[dk][realIdx]=true; }
      saveState(); render();
    };
    act.appendChild(b); card.appendChild(act);
    if(done){
      const ansText = q.answer;
      const disp = (!ansText || !ansText.trim()) ? '（画图题，请对照图纸 / 实物作答，无文字参考答案）' : ansText;
      feedback.className='feedback show ok';
      feedback.innerHTML='<span class="ans">参考答案</span><span class="hint">'+esc(disp)+'</span>';
    }
  }
  if(feedback.innerHTML) card.appendChild(feedback);
  updateNav(); saveState();
}

function updateNav(){
  const st=TYPES.filter(t=>typeCount(state.subj,t.key)>0);
  if(!st.length){ document.getElementById('btnPrev').disabled=true; document.getElementById('btnNext').disabled=true; return; }
  const order=getOrder(state.subj,state.type);
  document.getElementById('btnPrev').disabled = state.idx<=0;
  document.getElementById('btnNext').disabled = state.idx>=order.length-1;
}
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600); }
document.getElementById('btnPrev').onclick=()=>{ if(state.idx>0){state.idx--;render();} };
document.getElementById('btnNext').onclick=()=>{ const o=getOrder(state.subj,state.type); if(state.idx<o.length-1){state.idx++;render();} };
document.getElementById('btnWrong').onclick=()=>{
  state.wrongBookMode = !state.wrongBookMode;
  state.idx=0;
  if(state.wrongBookMode && (state.wrongBook||[]).length===0){ toast('错题本为空'); state.wrongBookMode=false; }
  else if(state.wrongBookMode){
    const first=(state.wrongBook||[])[0];
    if(!pool(state.subj,state.type).length && first){ state.subj=first.subj; state.type=first.type; }
  }
  renderSubjects(); renderTabs(); render(); renderStats();
};
document.getElementById('btnExitWrong').onclick=()=>{ state.wrongBookMode=false; state.idx=0; renderSubjects(); renderTabs(); render(); renderStats(); };
document.getElementById('btnClearWrong').onclick=()=>{ state.wrongBook=[]; state.idx=0; renderSubjects(); renderTabs(); render(); renderStats(); toast('已清空错题本'); };
document.getElementById('btnReset').onclick=()=>{
  state.mode='seq'; state.order={}; state.done={}; state.right={}; state.sel={}; state.idx=0; state.wrongBookMode=false;
  document.querySelectorAll('.seg[data-mode]').forEach(s=>s.classList.toggle('active',s.dataset.mode==='seq'));
  renderSubjects(); renderTabs(); render(); renderStats(); toast('已重新开始');
};
document.querySelectorAll('.seg[data-mode]').forEach(s=>{
  s.onclick=()=>{
    state.mode=s.dataset.mode;
    document.querySelectorAll('.seg[data-mode]').forEach(x=>x.classList.toggle('active',x===s));
    state.order={}; state.idx=0; render();
  };
});
renderSubjects(); renderTabs(); render(); renderStats();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
