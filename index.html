<style>
:root{
  --coal:#1b2730; --coal-2:#223641; --coal-3:#2a4350;
  --teal:#0f6b6e; --teal-d:#0a5254; --teal-bg:#e7f1f1;
  --amber:#f0a53a; --amber-d:#b45309; --amber-bg:#fdf1de;
  --bg:#eef2f4; --card:#ffffff; --ink:#16222b; --ink-2:#5b6b74;
  --line:#dfe6e9; --ok:#15803d; --ok-bg:#eaf6ee; --err:#b91c1c; --err-bg:#fdeceb;
  --chip:#eef3f4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.6;min-height:100vh;min-height:100dvh}
.band{background:linear-gradient(135deg,var(--coal) 0%,var(--coal-3) 100%);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 16px calc(52px + env(safe-area-inset-top)) ;position:relative;overflow:hidden}
@media (display-mode: standalone){ .band{padding-top:calc(14px + env(safe-area-inset-top))} .wrap{padding-bottom:calc(70px + env(safe-area-inset-bottom))} }
.band::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at center,rgba(240,165,58,.18),transparent 70%)}
.band-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--amber);color:var(--coal);display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-1px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.band h1{font-size:21px;font-weight:800;letter-spacing:.5px;line-height:1.25}
.band small{display:block;font-size:12px;font-weight:400;color:#b9c6cd;margin-top:3px}
.wrap{max-width:820px;margin:-34px auto 0;padding:0 16px 70px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 12px rgba(27,39,48,.05)}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--teal-d)}
.stat.wrong b{color:var(--err)}
.stat span{font-size:12px;color:var(--ink-2)}
.sec-label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:1px;margin:2px 2px 8px}
.subjects{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sub{flex:1 1 118px;max-width:190px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 2px 8px rgba(27,39,48,.04)}
.sub:hover:not(.off){border-color:var(--teal)}
.sub.off{opacity:.42;cursor:default}
.sub .n{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink)}
.sub .ic{flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--chip);color:var(--teal-d);display:grid;place-items:center;font-size:12px;font-weight:800}
.sub .c{display:block;font-size:11px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.sub.active{background:var(--teal);border-color:var(--teal);box-shadow:0 6px 16px rgba(15,107,110,.25)}
.sub.active .n,.sub.active .c{color:#fff}
.sub.active .ic{background:rgba(255,255,255,.2);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:74px;padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:center;transition:.15s}
.tab small{display:block;font-size:11px;font-weight:500;color:var(--ink-2);opacity:.75;margin-top:1px}
.tab.off{opacity:.42;cursor:default}
.tab.active{background:var(--coal-2);border-color:var(--coal-2);color:#fff}
.tab.active small{color:#dbe5ea}
.mode-row{display:flex;gap:8px;margin-bottom:12px}
.seg{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);text-align:center;transition:.15s}
.seg.active{background:var(--amber);border-color:var(--amber);color:#fff}
.seg.wrongon{background:var(--err);border-color:var(--err);color:#fff}
.banner{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--err-bg);border:1px solid #f3c3c0;color:var(--err);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner.show{display:flex}
.banner .grow{flex:1}
.banner button{border:1px solid var(--err);background:#fff;color:var(--err);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;min-height:280px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(27,39,48,.06)}
.q-meta{font-size:12px;color:var(--ink-2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;background:var(--teal-bg);color:var(--teal-d);border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px}
.tag.wrong-tag{background:var(--err-bg);color:var(--err)}
.q-prog{font-variant-numeric:tabular-nums;white-space:nowrap}
.qtext{font-size:16px;font-weight:600;line-height:1.75;margin-bottom:18px;overflow-wrap:break-word}
.qtext .blank{color:var(--teal-d);border-bottom:2px solid var(--teal);font-weight:700;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s;text-align:left;width:100%;background:var(--card);font-size:15px;color:var(--ink);font-family:inherit;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:var(--chip);color:var(--teal-d);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt .txt{min-width:0}
.opt.sel{border-color:var(--teal);background:var(--teal-bg)}
.opt.sel .k{background:var(--teal);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-bg)}
.opt.wrong .k{background:var(--err);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.judge-row{display:flex;gap:12px;margin-top:auto}
.jbtn{flex:1;padding:14px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);transition:.15s}
.jbtn:hover:not(:disabled){border-color:var(--teal)}
.jbtn.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.jbtn.wrong{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.jbtn:disabled{cursor:default}
.fill-wrap{margin-top:auto;font-size:15px;line-height:2.3}
.fill-text{overflow-wrap:break-word}
.fill-input{width:min(220px,62%);font-size:16px;padding:6px 10px;border:2px solid var(--line);border-radius:8px;font-family:inherit;color:var(--ink);vertical-align:middle;margin:2px 4px}
.fill-input:focus{outline:none;border-color:var(--teal)}
.fill-input.input-ok{border-color:var(--ok);background:var(--ok-bg)}
.fill-input.input-err{border-color:var(--err);background:var(--err-bg)}
.action{display:flex;gap:10px;margin-top:auto}
.primary{flex:1;padding:12px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.primary:hover:not(:disabled){background:var(--teal-d)}
.primary:disabled{opacity:.45;cursor:default}
.ghost{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.7;display:none;overflow-wrap:break-word}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #cbe8d4}
.feedback.err{background:var(--err-bg);color:var(--err);border:1px solid #f5c9c7}
.feedback .ans{font-weight:700}
.feedback .hint{display:block;margin-top:6px;color:var(--amber-d);background:var(--amber-bg);border-radius:8px;padding:8px 10px;font-weight:500;white-space:pre-wrap}
.controls{display:flex;gap:10px;margin-top:14px}
.nav{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer;color:var(--ink);transition:.15s;text-align:center}
.nav:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.nav:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--ink-2);padding:40px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--coal);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1}
@media(max-width:520px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:15px}
  .band h1{font-size:18px}
  .sub{flex:1 1 44%}
  .nav,.primary,.ghost{padding:14px}
  .seg{padding:10px}
  .opt{padding:13px 14px}
}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1b2730 0%,#2a4350 100%);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:360px;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 12px 44px rgba(0,0,0,.4);text-align:center;">
    <div style="width:54px;height:54px;border-radius:13px;background:#f0a53a;color:#1b2730;display:grid;place-items:center;font-weight:800;font-size:26px;margin:0 auto 14px;box-shadow:0 6px 16px rgba(240,165,58,.35);">矿</div>
    <h2 style="font-size:18px;font-weight:800;color:#16222b;margin-bottom:6px;line-height:1.3;">矿用产品统一刷题系统</h2>
    <p style="font-size:13px;color:#5b6b74;margin-bottom:20px;">请输入访问口令</p>
    <input id="gateInput" type="password" placeholder="请输入口令" autocomplete="off" style="width:100%;padding:12px 14px;border:2px solid #dfe6e9;border-radius:10px;font-size:16px;text-align:center;letter-spacing:3px;outline:none;box-sizing:border-box;" />
    <div id="gateErr" style="display:none;color:#b91c1c;font-size:13px;margin-top:8px;font-weight:600;">口令错误，请重试</div>
    <button id="gateBtn" style="width:100%;margin-top:16px;padding:13px;border:none;border-radius:10px;background:#0f6b6e;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">进入系统</button>
  </div>
</div>
<div class="band">
  <div class="band-in">
    <div class="logo">矿</div>
    <h1>矿用产品统一刷题系统<small>八大产品题库 · 带答案 · 顺序/随机练习 · 自动保存进度 · 错题本</small></h1>
  </div>
</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="stTotal">0</b><span>总题数</span></div>
    <div class="stat"><b id="stDone">0</b><span>已作答</span></div>
    <div class="stat"><b id="stRight">0</b><span>答对</span></div>
    <div class="stat wrong"><b id="stWrong">0</b><span>错题数</span></div>
    <div class="stat"><b id="stRate">0%</b><span>正确率</span></div>
  </div>

  <div class="banner" id="wrongBanner">
    <span>错题本模式：仅复习答错过的题目</span>
    <span class="grow"></span>
    <button id="btnClearWrong">清空错题</button>
    <button id="btnExitWrong">退出错题</button>
  </div>

  <div class="sec-label">选择科目</div>
  <div class="subjects" id="subjects"></div>

  <div class="sec-label" id="typeLabel">选择题型</div>
  <div class="tabs" id="tabs"></div>

  <div class="mode-row">
    <button class="seg active" data-mode="seq">顺序</button>
    <button class="seg" data-mode="random">随机</button>
    <button class="seg" id="btnWrong">错题本</button>
    <button class="seg" id="btnReset">重新开始</button>
  </div>

  <div class="card" id="card"></div>

  <div class="controls">
    <button class="nav" id="btnPrev">上一题</button>
    <button class="nav" id="btnNext">下一题</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const ACCESS_CODE = 'HN123456';
const GATE_KEY = 'mineQuizGate_v2';
(function(){
  const gate = document.getElementById('gate');
  if(!gate) return;
  const inp = document.getElementById('gateInput');
  const btn = document.getElementById('gateBtn');
  const err = document.getElementById('gateErr');
  let passed = false;
  try{ passed = localStorage.getItem(GATE_KEY) === 'ok'; }catch(e){}
  if(passed){ gate.remove(); return; }
  gate.style.display = 'flex';
  function tryEnter(){
    const v = (inp.value||'').trim().toUpperCase();
    if(v === ACCESS_CODE){
      try{ localStorage.setItem(GATE_KEY, 'ok'); }catch(e){}
      gate.remove();
    } else {
      err.style.display = 'block';
      inp.value = '';
      inp.focus();
    }
  }
  if(btn) btn.addEventListener('click', tryEnter);
  if(inp){ inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryEnter(); }); inp.focus(); }
})();

const SUBJECTS = [
  {key:'tongxin',  name:'通讯产品', mark:'通'},
  {key:'yekong',   name:'液控产品', mark:'液'},
  {key:'diankong', name:'电控产品', mark:'电'},
  {key:'zidonghua',name:'自动化',   mark:'自'},
  {key:'zuhekai',  name:'组合开关', mark:'组'},
  {key:'peitao',   name:'配套工程', mark:'配'},
  {key:'ktc256',   name:'KTC256',  mark:'K'},
  {key:'voip',     name:'VOIP',    mark:'V'}
];
const TYPES = [
  {key:'choice', name:'选择题'},
  {key:'judge',  name:'判断题'},
  {key:'fill',   name:'填空题'},
  {key:'short',  name:'简答题'}

},{"key":"C","text":"没有下位机，无远停功能"},{"key":"D","text":"液晶亮度可调"}],"answer":"CD"},{"type":"choice","q":"盘闸和逆止器的描述正确的是（    ）","options":[{"key":"A","text":"盘闸和逆止器安装的位置是一样的"},{"key":"B","text":"盘闸是实现停车时驱动部的点刹或急刹，帮助皮带停车。"},{"key":"C","text":"逆止器是阻止驱动部反转，当出现反转时及时抱死，一般用在上山皮带。"},{"key":"D","text":"装了盘闸就不需要装逆止器了"}],"answer":"BC"},{"type":"choice","q":"对于抱闸描述正确的是（    ）","options":[{"key":"A","text":"抱闸电机在主电机运行前要先起动"},{"key":"B","text":"松闸到位点是检测抱闸电机开关是否启动"},{"key":"C","text":"正常停车时抱闸电机延时抱死"},{"key":"D","text":"紧急停车时抱闸电机立即停止"}],"answer":"ACD"},{"type":"choice","q":"与CST配接时，下列哪些是给CST的信号（    ）","options":[{"key":"A","text":"复位信号"},{"key":"B","text":"起/停输出信号"},{"key":"C","text":"急停信号"},{"key":"D","text":"满速信号"}],"answer":"ABC"},{"type":"choice","q":"与CST配接时，下列哪些是CST给我们的信号（    ）","options":[{"key":"A","text":"备妥信号"},{"key":"B","text":"满速信号"},{"key":"C","text":"慢速选择输入信号"},{"key":"D","text":"慢速选择输出信号"}],"answer":"AB"},{"type":"choice","q":"勺杆控制方式，启动主电机前要先（    ）","options":[{"key":"A","text":"打开抱闸"},{"key":"B","text":"启动张紧"},{"key":"C","text":"判断勺杆是否在低位"},{"key":"D","text":"拉低勺杆"}],"answer":"C"},{"type":"choice","q":"对于VOITH耦合器描述正确的是（    ）","options":[{"key":"A","text":"皮带耦合器安装在减速机和驱动滚筒之间"},{"key":"B","text":"工作面VOITH采用水作为耦合介质"},{"key":"C","text":"皮带VOITH采用油作为耦合介质"},{"key":"D","text":"耦合器速度传感器转速检测的是电机的转速"}],"answer":"ABCD"},{"type":"choice","q":"对VOITH耦合器(无排液阀)系统描述正确的是（    ）","options":[{"key":"A","text":"耦合器无水位传感器。"},{"key":"B","text":"启动时程序控制先往耦合器里注一段时间的水，注水时间长短与水压有关。"},{"key":"C","text":"运行过程中如果机头机尾功率差别较大时，系统会报警停车。"},{"key":"D","text":"该系统是否检测电流可以在参数中设置。"}],"answer":"ABCD"},{"type":"choice","q":"运输机重载会出现哪些现象（    ）","options":[{"key":"A","text":"耦合器的转速会比平时高"},{"key":"B","text":"耦合器温度升的非常快"},{"key":"C","text":"电机电流比平时大"},{"key":"D","text":"耦合器阀频繁动作"}],"answer":"BCD"},{"type":"choice","q":"耦合器阀接线腔进水可能会造成（    ）","options":[{"key":"A","text":"反馈信号不一致"},{"key":"B","text":"充液超时"},{"key":"C","text":"18V保护"},{"key":"D","text":"阀无反馈"}],"answer":"ABCD"},{"type":"choice","q":"KTC101系统采用的通信协议是（ 系的设备；可以按（    ）联停有联锁关系的设。","options":[{"key":"A","text":"1键"},{"key":"B","text":"9键"},{"key":"C","text":"*键"},{"key":"D","text":"0键"}],"answer":"BD"},{"type":"choice","q":"系统沿线有闭锁时，主控制器的液晶屏画面上如何显示（    ）。","options":[{"key":"A","text":"画面最下面相应的闭锁台号会变红"},{"key":"B","text":"画面有汉字显示第几台闭锁"},{"key":"C","text":"画面闭锁汉字显示，最多显示三台"},{"key":"D","text":"画面闭锁台号，以红色显示所有闭锁"}],"answer":"ABCD"},{"type":"choice","q":"工作面想单独停前部运输机或后部运输机的操作方法是（    ）","options":[{"key":"A","text":"按工作面沿线KTC101-1(C)电话上相应的远停按钮"},{"key":"B","text":"用刮板机头KTC101-1(IC)电话上相应远停和启停旋钮"},{"key":"C","text":"主控制器上的7、8按键"},{"key":"D","text":"按沿线上的任意闭锁按钮"}],"answer":"ABC"},{"type":"choice","q":"目前我们的烟雾传感器有哪几种型号（    ）","options":[{"key":"A","text":"GQG5-Y"},{"key":"B","text":"GQG5-Y-2"},{"key":"C","text":"GQG5-Y-3"},{"key":"D","text":"GQG5-Y-4"}],"answer":"ABCD"},{"type":"choice","q":"目前我们的烟雾传感器有哪几种原理形式（    ）","options":[{"key":"A","text":"光电式"},{"key":"B","text":"气敏式"},{"key":"C","text":"离子式"},{"key":"D","text":"以上都不是"}],"answer":"AB"},{"type":"choice","q":"哪些属于光电式烟雾传感器（    ）","options":[{"key":"A","text":"GQG5-Y"},{"key":"B","text":"GQG5-Y-2"},{"key":"C","text":"GQG5-Y-3"},{"key":"D","text":"GQG5-Y-4"}],"answer":"ABC"},{"type":"choice","q":"哪些属于气敏式烟雾传感器（    ）","options":[{"key":"A","text":"GQG5-Y"},{"key":"B","text":"GQG5-Y-2"},{"key":"C","text":"GQG5-Y-4"},{"key":"D","text":"GQQ5（P）"}],"answer":"CD"},{"type":"choice","q":"哪些烟雾传感器带有试验按钮（    ）","options":[{"key":"A","text":"GQG5-Y"},{"key":"B","text":"GQG5-Y-2"},{"key":"C","text":"GQG5-Y-3"},{"key":"D","text":"GQG5-Y-4"}],"answer":"BCD"},{"type":"choice","q":"哪个烟雾传感器配有TEST测试线（    ）","options":[{"key":"A","text":"GQG5-Y"},{"key":"B","text":"GQG5-Y-2"},{"key":"C","text":"GQG5-Y-3"},{"key":"D","text":"GQG5-Y-4"}],"answer":"D"},{"type":"choice","q":"《煤矿用带式输送机保护装置技术条件》(MT872-2000)4.5.5中规定：烟雾传感器应连续（  ）S内，烟雾浓度Y(指离子型烟雾探测器)达到（  ）时，烟雾保护装置应报警，终止带式输送机的运行，同时启动洒水装置，喷水降温。（    ）","options":[{"key":"A","text":"2，1.5"},{"key":"B","text":"2，1.0"},{"key":"C","text":"5，2.0"},{"key":"D","tex {"key":"C","text":"体积小，便于携带"},{"key":"D","text":"整个系统的终结,系统信号的返回"}],"answer":"CD"},{"type":"choice","q":"测量A12V的方法错误的是","options":[{"key":"A","text":"打开电源箱测量A12电源模块输出"},{"key":"B","text":"测量电源箱带插头配线里6、7号线电压"},{"key":"C","text":"测量端子排标签上A12正负的电压"},{"key":"D","text":"测量控制器打下闭锁时，闭锁后接小灯的微动开关触点的电压"}],"answer":"D"},{"type":"choice","q":"下面不是KTC101系统液晶屏不亮的原因是","options":[{"key":"A","text":"主控内背景灯不亮"},{"key":"B","text":"B6V电源无输出"},{"key":"C","text":"A6V电源无输出"},{"key":"D","text":"主控25芯插部分触点虚焊"}],"answer":"C"},{"type":"choice","q":"不是造成KTC101系统显示第一台故障或线路断的原因是","options":[{"key":"A","text":"18V电源没有输出"},{"key":"B","text":"控制器没有连接沿线"},{"key":"C","text":"第一个闭锁板坏"},{"key":"D","text":"电源线出来的6芯屏蔽连接线没有接到控制器端子排上"}],"answer":"B"},{"type":"choice","q":"属于我们KTC101系统可以检测的信号量的是","options":[{"key":"A","text":"1-5V电压信号"},{"key":"B","text":"PT100温度电阻"},{"key":"C","text":"高低电平输入信号"},{"key":"D","text":"0-1000HZ频率信号"}],"answer":"ABC"},{"type":"choice","q":"属于IO模块的功能的是","options":[{"key":"A","text":"带有10路输出、12路输入"},{"key":"B","text":"采用继电器输出、光耦输入检测"},{"key":"C","text":"24路输入检测"},{"key":"D","text":"前6路输出带有强制闭锁"}],"answer":"A"},{"type":"choice","q":"下面音频线与哪些线短路会造成沿线有杂音","options":[{"key":"A","text":"闭锁线"},{"key":"B","text":"电源地"},{"key":"C","text":"查询线"},{"key":"D","text":"数据线"}],"answer":"ACD"},{"type":"choice","q":"当沿线18V带载能力降低或达到保护临界值，哪些情况可能导致18V保护","options":[{"key":"A","text":"延长沿线"},{"key":"B","text":"增加下位机保护检测"},{"key":"C","text":"减小语言模块充电电流"},{"key":"D","text":"按送话按钮进行送话"}],"answer":"ABD"},{"type":"choice","q":"工作面福伊特启动机头电磁阀时沿线会突然消失，立即又恢复，可能原因是","options":[{"key":"A","text":"耦合器电磁阀接线腔进水"},{"key":"B","text":"系统采用一条沿线，启车时18V电源保护"},{"key":"C","text":"沿线和动力电缆干扰"},{"key":"D","text":"耦合器速度传感器有问题"}],"answer":"ABC"},{"type":"choice","q":"KTK101-1","options":[{"key":"A","text":"带有通话和急停闭锁功能"},{"key":"B","text":"可以远停两台设备"},{"key":"C","text":"两边的闭锁按下时不切断闭锁线"},{"key":"D","text":"带有下位机板"}],"answer":"C"},{"type":"choice","q":"KJS101-OH的B音频和外接音频有何关系","options":[{"key":"A","text":"双向放大"},{"key":"B","text":"只放大不隔离"},{"key":"C","text":"只隔离不放大"},{"key":"D","text":"既隔离又放大"}],"answer":"C"},{"type":"choice","q":"以下属于终端功能的有几项","options":[{"key":"A","text":"检测沿线末端电压"},{"key":"B","text":"结束一轮脉冲查询周期"},{"key":"C","text":"参与硬件强制闭锁"},{"key":"D","text":"检测报警语音信号有无"}],"answer":"ABCD"},{"type":"choice","q":"以下哪几种说法是正确的","options":[{"key":"A","text":"某设备使用IO1前6路，只要软件设置和闭锁联锁，此设备就实现软件硬件闭锁双保险。"},{"key":"B","text":"某设备使用IO1前6路，对应短路子已短接，如果软件设置与闭锁联锁，那么将非常危险。"},{"key":"C","text":"某设备使用IO1前6路，如果软件未设置与闭锁联锁，那么对应短路子应该短接上。"},{"key":"D","text":"某设备使用IO2前6路，在软件没有设置与闭锁联锁的情况下，只要沿线打下闭锁，设备将急停。"}],"answer":"C"},{"type":"choice","q":"下面哪些不属于CS模块的描述","options":[{"key":"A","text":"沿线检测模块，检测闭锁台数和闭锁位置"},{"key":"B","text":"配置沿线参数，上报沿线信息"},{"key":"C","text":"检测断路位置"},{"key":"D","text":"作为核心，所有中位机通信"}],"answer":"D"},{"type":"choice","q":"下面描述错误的是那些","options":[{"key":"A","text":"KTK101-1（S）电话在普通电话的基础上在一侧增加了一插座，用于实现沿线分叉通话。"},{"key":"B","text":"KTK101-1（IC）电话内部有3块闭锁板，1块下位机板。两边闭锁的锁定功能是通过启动就绪点来实现的。"},{"key":"C","text":"KTK101-1（A）电话带有打点预警功能"},{"key":"D","text":"KTK101-1（Z）电话如果改成远停电话，只要将闭锁板串接2个微动开关的配线短接住就可以。"}],"answer":"ABC"},{"type":"choice","q":"对于长沿线皮带描述正确的是","options":[{"key":"A","text":"标准配置的皮带沿线过长时可以采用中继电源，但中继器位置不得超过2400米。"},{"key":"B","text":"沿线保护尽量采用远程控制箱供电。"},{"key":"C","text":"电缆全部采用LCVB-7-2的电缆"},{"key":"D","text":"电缆全部采用LCVB-7-1的电缆"}],"answer":"ABC"},{"type":"choice","q":"对于纯通话系统描述正确的是","options":[{"key":"A","text":"通话系统使用的电源箱只有一块电源模块"},{"key":"B","text":"沿线可以采用普通屏蔽电缆"},{"key":"C","text":"电话只能采用KTK101（A）电话"},{"key":"D","text":"电源箱内音频线接到电源模块的S端。"}],"answer":"ABD"},{"type":"choice","q":"电源箱中如果B12V没电，控制器现象不正确的是","options":[{"key":"A","text":"IO输入口接的模拟量信号都报故障"},{"key":"B","text":"IO输入口接的开关量传感器报故障"},{"key":"C","text":"IO输入口接的需要供电的开关量传感器报故障"},{"key":"D","text":"如果无模拟量输入，无明显现象"}],"answer":"BC"},{"type":"choice","q":"KJS101-E描述正确的是","options":[{"key":"A","text":"与其相接的程控电话响铃数声后自动接听到沿线里，响铃次数现场可调。"},{"key":"B","text":"当对方挂机后，其检测到盲音会自动挂断，检测的盲音频率范围现场可调。"},{"key":"C","text":"与其相接的程控电话接通后，无法再切换到沿线里，必须在接通前自动或手动切换到沿线。"},{"key":"D","text":"以上说法均正确。"}],"answer":"B"},{"type":"choice","q":"对中位机描述错误的是","options":[{"key":"A","text":"SP模块也称语言报警模块，并且报警音量可调。"},{"key":"B","text":"IN 模块使用时，要在控制器内部加一块IN输入端子排，端子排通过一根39芯电缆接入母板上IN插座。"},{"key":"C","text":"CS模块有时也会造成18V保护。"},{"key":"D","text":"IO模块包括10路输出，12路输入。"}],"answer":"B"},{"type":"choice","q":"对语言模块描述正确的是","options":[{"key":"A","text":"所有语言模块上都包括3个白插座，2个电位器和1个2P拨码开关。"},{"key":"B","text":"沿线音频线、电源正负占用4芯白插头的3芯连接到语言模块上。"},{"key":"C","text":"语言模块内部电池的容量是800mAh。"},{"key":"D","text":"测量8芯插座的4、7号管脚可以测电池的电压，以判断电池是否亏电。"}],"answer":"BCD"},{"type":"choice","q":"对闭锁模块、下位机描述不正确的是","options":[{"key":"A","text":"沿线所有的闭锁模块、下位机都是串到查询线和闭锁线上的。"},{"key":"B","text":"闭锁模块和下位机在每次查询周期中都应答不同宽度的脉冲信号。"},{"key":"C","text":"如果想甩掉闭锁模块和下位机还使沿线正常，只要将查询线进线和出现短接即可。"},{"key":"D","text":"以上答案均错误。"}],"answer":"ABC"},{"type":"choice","q":"以下对于电话内部微动开关描述错误的是","options":[{"key":"A","text":"电话闭锁下有3个微动开关，打闭锁时，2个开关切断闭锁线，1个开关切断查询线。"},{"key":"B","text":"连接闭锁线的2个微动开关当有一个开关断开后，即可切断闭锁线。"},{"key":"C","text":"C电话内的微动开关只有一个有作用。"},{"key":"D","text":"常开的微动开关影响闭锁板应答脉冲的宽度。"}],"answer":"AC"},{"type":"choice","q":"肯定会影响到IC电话使用的描述是","options":[{"key":"A","text":"在设置参数后IC电话前面增加了一台KTK101-1（A）电话"},{"key":"B","text":"在设置参数后IC电话前面增加了一台下位机"},{"key":"C","text":"IC电话两边闭锁按钮下的微动开关有一个坏。"},{"key":"D","text":"控制器显示终端显示为0"}],"answer":"BCD"},{"type":"choice","q":"对于KHJ15/18-1（IT）描述错误的是","options":[{"key":"A","text":"需要4芯线和下位机配接"},{"key":"B","text":"锁定点和按钮输入点有一个公共端"},{"key":"C","text":"小灯只有在使用按钮启车时才会亮"},{"key":"D","text":"IT内部内置电阻"}],"answer":"C"},{"type":"choice","q":"哪些情况属于失爆","options":[{"key":"A","text":"打开电源箱门时，不慎将隔爆面滑伤"},{"key":"B","text":"进线外皮可以从喇叭嘴拉出来"},{"key":"C","text":"没有用的喇叭嘴没有密封圈挡板等"},{"key":"D","text":"电缆进入防爆腔时，先穿喇叭嘴，然后钢圈，最后密封圈"}],"answer":"ABC"},{"type":"choice","q":"井下行走或工作时哪些情况下要进入安全区域避让","options":[{"key":"A","text":"人车从远方驶来"},{"key":"B","text":"前方不远即将发生爆破"},{"key":"C","text":"工作面移列车"},{"key":"D","text":"上坡时，绞车正在拉运送矸石的平板车"}],"answer":"ABCD"},{"type":"choice","q":"以下关于传感器描述正确的是","options":[{"key":"A","text":"一对跑偏传感器可以采用串接的方式，通过2芯线接入一个输入点检测"},{"key":"B","text":"堆煤传感器一般可以安装在皮带机头，接地铜柱加一段导线垂在转载点处"},{"key":"C","text":"温度传感器可以安装在主滚筒的附近"},{"key":"D","text":"速度传感器安装在上下皮带之间，滚筒要能接触到下皮带。"}],"answer":"ABCD"},{"type":"choice","q":"对于β测试，以下描述正确的是","options":[{"key":"A","text":"β测试是新产品开发不可缺少的环节，直接影响新产品的最终发布的品质和功能。"},{"key":"B","text":"β测试是新程序新产品公司内部测试后，拿到特定用户现场进行功能性、完善性和稳定性检测。"},{"key":"C","text":"营销工程师有责任承担β测试现场的检验和跟踪工作，把最准确和完备的现场情况反映给项目团队。"},{"key":"D","text":"营销工程师应该把β测试看成一项非常重要的工作，不能轻视、草率了事。"}],"answer":"ABCD"},{"type":"choice","q":"使用摇表描述正确的是","options":[{"key":"A","text":"当测量某芯对屏蔽绝缘时，必须将1号到7号线拧到一起再进行测量。"},{"key":"B","text":"当测量电缆芯与芯之间绝缘程度时，必须将电缆另一头悬空，测量完后记得放电。"},{"key":"C","text":"当测量电话某芯对外壳绝缘时，必须将模块全部甩掉。"},{"key":"D","text":"当测量沿线整体绝缘性时，必须将7芯拧到一起，并且将沿线模块全部甩掉。"}],"answer":"BC"},{"type":"choice","q":"KTK101-1（Z）电话改远停电话描述不正确的是","options":[{"key":"A","text":"KTK101-1（Z）改远停电话后，闭锁停车是靠软件来实现的。"},{"key":"B","text":"串接闭锁线的2个微动开关触点要全部取反"},{"key":"C","text":"电话内部的3个微动开关触点要全部取反"},{"key":"D","text":"串接闭锁线的2个微动开关不动，另外一个微动开关触点取反。"}],"answer":"BCD"},{"type":"choice","q":"对远程控制箱功能描述错误的是","options":[{"key":"A","text":"远程控制箱用于先导线非本安设备的隔离"},{"key":"B","text":"可以提供18V电源"},{"key":"C","text":"可以用于输入开关量信号的隔离"},{"key":"D","text":"可以用于输入模拟量信号的隔离"}],"answer":"D"},{"type":"choice","q":"对远程控制箱功能描述正确的是","options":[{"key":"A","text":"远程控制箱用于先导线非本安设备的隔离"},{"key":"B","text":"不可以用于中继器的供电"},{"key":"C","text":"可以用于接超温洒水电磁阀时进行控制的隔离"},{"key":"D","text":"现场有干扰时，可以用于输入模拟量信号的干扰隔离"}],"answer":"AC"},{"type":"choice","q":"对于KTC101-Z控制器做从机串口通信时描述正确的是","options":[{"key":"A","text":"可以存在多台从机，主从之间必须统一协议、波特率、数据位、停止位等。"},{"key":"B","text":"从机之间以地址区分，地址可以不连续，只要不重复即可。"},{"key":"C","text":"KTC101系统采用MODBUS RTU通信协议，使用MODSCAN测试时功能码选择06。"},{"key":"D","text":"作从机时一定要把参数中作为从机的通信中断时间设上。"}],"answer":"ABD"},{"type":"choice","q":"一套KTC101系统完成设备联锁描述不正确的是","options":[{"key":"A","text":"2台设备可以同时和1台设备联锁"},{"key":"B","text":"1台设备可以同时和2台设备联锁"},{"key":"C","text":"既可以通过参数也可以通过接线方式实现联锁"},{"key":"D","text":"通过接线方式检修时无法解除联锁"}],"answer":"D"},{"type":"choice","q":"解除硬件闭锁的方法有","options":[{"key":"A","text":"参数中是否与闭锁联锁设成不闭锁"},{"key":"B","text":"短接母板上对应输出点的短路子"},{"key":"C","text":"设备使用IO2来控制"},{"key":"D","text":"设备用后4路来控制"}],"answer":"BD"},{"type":"choice","q":"使用万用表说法错误的是","options":[{"key":"A","text":"测量18V电源模块空载输出电压时，将万用表打到直流电压档。测量端子排上18V正和负之间的电压即可。"},{"key":"B","text":"测量18V电源电流时，在端子排上将18V地线摘掉。然后将万用表打到10A档。用红表笔连接18V地线，黑表笔连接端子排上18V地，即可测量电流。"},{"key":"C","text":"用电流档去测电压时，会将表烧坏。"},{"key":"D","text":"测通断时，可以将万用表打到欧姆档。"}],"answer":"A"},{"type":"choice","q":"检测PT100温度电阻时，描述正确的是","options":[{"key":"A","text":"检测PT100温度电阻需要PT100模块转化成200-1000HZ信号"},{"key":"B","text":"当温度升高1°，温度电阻阻值上升3.85欧姆。"},{"key":"C","text":"如果电机温度电阻过来的线没有补偿线只是2芯，PT100模块S1和COM端必须短接。"},{"key":"D","text":"没有补偿线会导致实际温度显示温度低。"}],"answer":"C"},{"type":"choice","q":"对系统电缆描述正确的是","options":[{"key":"A","text":"KTC102+系统采用5芯电缆5芯专用插头"},{"key":"B","text":"KTC102+系统采用5芯电缆7芯专用插头"},{"key":"C","text":"LCVB-7-2比LCVB-7-1电缆里电源线的截面积要大，一般在3000米以上沿线使用。"},{"key":"D","text":"LCVB-7电缆里除了外层屏蔽外，1、6和7号芯线外还有一层屏蔽"}],"answer":"BC"},{"type":"choice","q":"以下对电话功能描述不正确的是","options":[{"key":"A","text":"KJS101（E）可以实现和矿井程控电话系统耦合"},{"key":"B","text":"KTK101-1（KG）电话带2个光报警指示灯，可以接收4路开关量信号，进行4种报警语音播放。"},{"key":"C","text":"KTK101-1（G）电话带光报警指示灯，当沿线有语音信号时，指示灯闪烁。"},{"key":"D","text":"KTK101-1（AD）电话只能用在井上，内部语言模块和普通语言模块一样。"}],"answer":"BD"},{"type":"choice","q":"以下不是闭锁板损坏造成的现象的是","options":[{"key":"A","text":"造成沿线故障或线路断"},{"key":"B","text":"造成18V电源保护"},{"key":"C","text":"造成沿线电话台数乱闪"},{"key":"D","text":"造成沿线终端打叉"}],"answer":"D"},{"type":"choice","q":"以下有可能是语言模块故障造成的现象的是","options":[{"key":"A","text":"某台电话送话和放音的声音小"},{"key":"B","text":"整条沿线通话声音都小"},{"key":"C","text":"通话声音有，但报警只报一半就没了。"},{"key":"D","text":"按下连接语音模块的送话按钮通话时，沿线就会闪"}],"answer":"ABCD"},{"type":"choice","q":"属于KTC102+特点的描述是","options":[{"key":"A","text":"单控制器最多控制3条皮带"},{"key":"B","text":"可以实现工作面转载、前部和后部的高低速控制"},{"key":"C","text":"操作简便，参数灵活，输入输出随意指定"},{"key":"D","text":"可以实现工作面远停功能"}],"answer":"D"},{"type":"choice","q":"KTC102+系统功能描述正确的有","options":[{"key":"A","text":"可以控制多条皮带"},{"key":"B","text":"MODBUS TCP通信功能"},{"key":"C","text":"皮带模拟量速度检测功能"},{"key":"D","text":"皮带张力检测"}],"answer":"BCD"},{"type":"choice","q":"KTC102+系统皮带连锁描述正确的是","options":[{"key":"A","text":"需要将控制器4号电机输出点串入18V电源"},{"key":"B","text":"利用音频线传输连锁信号"},{"key":"C","text":"上设备控制器安装连锁模块，既实现连锁又实现音频耦合。"},{"key":"D","text":"利用音频线传输连锁信号，不仅不会影响音频质量，还会增加音频幅值从而提高音量。"}],"answer":"ABC"},{"type":"choice","q":"KTC102+系统机尾跑偏纵撕描述不正确的是","options":[{"key":"A","text":"KTC102+系统机尾HI接跑偏是利用切断急停线的原理实现的"},{"key":"B","text":"KTC102+系统沿线可以接很多跑偏"},{"key":"C","text":"每一组跑偏的位置都可以识别"},{"key":"D","text":"跑偏是否动作靠查询线上的信号反应"}],"answer":"AC"},{"type":"choice","q":"KTC102+系统与KTC101系统比较，描述不正确的是","options":[{"key":"A","text":"电缆采用5芯线，无数据通信线"},{"key":"B","text":"端子排有明确定义，不能任意接"},{"key":"C","text":"没有下位机，无远停功能"},{"key":"D","text":"液晶亮度可调"}],"answer":"CD"},{"type":"choice","q":"盘闸和逆止器的描述正确的是","options":[{"key":"A","text":"盘闸和逆止器安装的位置是一样的"},{"key":"B","text":"盘闸是实现停车时驱动部的点刹或急刹，帮助皮带停车。"},{"key":"C","text":"逆止器是阻止驱动部反转，当出现反转时及时抱死，一般用在上山皮带。"},{"key":"D","text":"装了盘闸就不需要装逆止器了"}],"answer":"BC"},{"type":"choice","q":"对于抱闸描述正确的是","options":[{"key":"A","text":"抱闸电机在主电机运行前要先起动"},{"key":"B","text":"松闸到位点是检测抱闸电机开关是否启动"},{"key":"C","text":"正常停车时抱闸电机延时抱死"},{"key":"D","text":"紧急停车时抱闸电机立即停止"}],"answer":"ACD"},{"type":"choice","q":"对于VOITH耦合器描述正确的是","options":[{"key":"A","text":"皮带耦合器安装在减速机和驱动滚筒之间"},{"key":"B","text":"工作面VOITH采用水作为耦合介质"},{"key":"C","text":"皮带VOITH采用油作为耦合介质"},{"key":"D","text":"耦合器速度传感器转速检测的是电机的转速"}],"answer":"ABCD"},{"type":"choice","q":"对VOITH耦合器(无排液阀)系统描述正确的是","options":[{"key":"A","text":"耦合器无水位传感器。"},{"key":"B","text":"启动时程序控制先往耦合器里注一段时间的水，注水时间长短与水压有关。"},{"key":"C","text":"运行过程中如果机头机尾功率差别较大时，系统会报警停车。"},{"key":"D","text":"该系统是否检测电流可以在参数中设置。"}],"answer":"ABCD"},{"type":"choice","q":"运输机重载会出现哪些现象","options":[{"key":"A","text":"耦合器的转速会比平时高"},{"key":"B","text":"耦合器温度升的非常快"},{"key":"C","text":"电机电流比平时大"},{"key":"D","text":"耦合器阀频繁动作"}],"answer":"BCD"},{"type":"choice","q":"耦合器阀接线腔进水可能会造成","options":[{"key":"A","text":"反馈信号不一致"},{"key":"B","text":"充液超时"},{"key":"C","text":"18V保护"},{"key":"D","text":"阀无反馈"}],"answer":"ABCD"},{"type":"choice","q":"KTC101系统采用的通信协议是","options":[{"key":"A","text":"Modbus RTU"},{"key":"B","text":"Modbus ASCII"},{"key":"C","text":"Modbus TCP"},{"key":"D","text":"Modbus RS232"}],"answer":"AC"},{"type":"choice","q":"两台控制器头尾搭接COU耦合，下面描述正确的是","options":[{"key":"A","text":"两台控制器都会显示本台地址和在线控制器地址"},{"key":"B","text":"如果设置了相应的连锁设备号，2号控制器的设备会和1号控制器最后一台设备联锁。"},{"key":"C","text":"建立通信时，可以从任意一台控制器串口读取两套系统的数据。"},{"key":"D","text":"两台控制器之间采用双向CAN通信"}],"answer":"ABCD"},{"type":"choice","q":"利用井下环网通信时，以下描述正确的是","options":[{"key":"A","text":"我们控制器通信的接口和协议与环网的不同，需要增加串口服务器(网关 )。"},{"key":"B","text":"网关作为一个转换设备，要占用环网一个IP地址，通过RJ45接口接入环网。"},{"key":"C","text":"使用网关时，要通过软件设置该设备的IP地址、波特率等。"},{"key":"D","text":"如果组态王工程中建立的是串口设备，那儿还要通过虚拟串口软件将对应IP下的设备虚拟成一串口设备。"}],"answer":"ABCD"},{"type":"choice","q":"切换系统运行方式正确的是","options":[{"key":"A","text":"可以通过按键盘上的←、→切换运行方式"},{"key":"B","text":"在系统停止状态下才能切换运行方式"},{"key":"C","text":"在系统任何状态下都可以切换运行方式"},{"key":"D","text":"运行方式无法切换"}],"answer":"AB"},{"type":"choice","q":"在集控和就地运行方式下","options":[{"key":"A","text":"可以任意启动每一台设备"},{"key":"B","text":"必须按顺序依次启动所有设备"},{"key":"C","text":"下设备没有开机，上设开不起来"},{"key":"D","text":"以上说法都正确"}],"answer":"B"},{"type":"choice","q":"在点动方式下，点动某台设备时需要做到","options":[{"key":"A","text":"通过按键盘上的←、→切换到点动运行方式"},{"key":"B","text":"按↓或↑键，改变点动后面的设备名称"},{"key":"C","text":"按住相应设备的主电机号设备转，松开按键就停"},{"key":"D","text":"点动设备启动没有预警声音，须通过喊话通知现场人员"}],"answer":"ABCD"},{"type":"choice","q":"系统沿线有闭锁时，主控制器的液晶屏画面上如何显示","options":[{"key":"A","text":"画面最下面相应的闭锁台号会变红"},{"key":"B","text":"画面有汉字显示第几台闭锁"},{"key":"C","text":"画面闭锁汉字显示，最多显示三台"},{"key":"D","text":"画面闭锁台号，以红色显示所有闭锁"}],"answer":"ABCD"},{"type":"choice","q":"工作面想单独停前部运输机或后部运输机的操作方法是","options":[{"key":"A","text":"按工作面沿线KTC101-1(C)电话上相应的远停按钮"},{"key":"B","text":"用刮板机头KTC101-1(IC)电话上相应远停和启停旋钮"},{"key":"C","text":"主控制器上的7、8按键"},{"key":"D","text":"按沿线上的任意闭锁按钮"}],"answer":"ABC"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB 51145-2015)15.3.6规定：烟雾保护装置应安装在带式输送机机头驱动滚筒（    ）处输送机（    ）方，烟雾传感器应垂直吊挂,距顶板不应大于（    ），当输送机为多滚筒驱动时，应以靠近机头处滚筒为准。","options":[{"key":"A","text":"下风侧5m~15m，正上，300mm"},{"key":"B","text":"下风侧5m~15m，正下，300mm"},{"key":"C","text":"上风侧5m~15m，正上，300mm"},{"key":"D","text":"上风侧5m~15m，正下，300mm"}],"answer":"A"},{"type":"choice","q":"由于井下不具备使用烟雾传感器检测装置的试验条件，建议（  ）通过烟雾传感器上的（  ）进行功能试验，（  ）将烟雾传感器拆下升井通过烟雾传感器检测装置进行主要技术参数测试。","options":[{"key":"A","text":"每周，试验按钮，每月"},{"key":"B","text":"每天，试验按钮，每月"},{"key":"C","text":"每月，试验按钮，每月"},{"key":"D","text":"每天，试验按钮，每年"}],"answer":"B"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB 51145-2015)16.5.2规定：两部带式输送机顺直搭接时，煤位传感器应在（  ）吊挂。传感器触头水平位置应在落煤点的（  ），距下部胶带机带面最高点的距离不应（  ），且吊挂高度不应（  ）。","options":[{"key":"A","text":"卸载滚筒前方，正上方，小于500mm，高于卸载滚筒下沿。"},{"key":"B","text":"卸载滚筒前方，正上方，大于500mm，低于卸载滚筒下沿。"},{"key":"C","text":"卸载滚筒前方，正上方，大于500mm，高于卸载滚筒下沿。"},{"key":"D","text":"卸载滚筒前方，正上方，小于500mm，低于卸载滚筒下沿。"}],"answer":"C"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB 51145-2015)16.5.2规定：两部带式输送机倾斜或垂直搭接时，煤位传感器可安装在（  ），传感器触头位置不得（  ），水平位置距卸载滚筒外沿不应（  ）。","options":[{"key":"A","text":"卸载滚筒一侧，高于卸载滚筒下沿，小于200mm。"},{"key":"B","text":"卸载滚筒前方，高于卸载滚筒下沿，大于200mm。"},{"key":"C","text":"卸载滚筒一侧，高于卸载滚筒下沿，大于200mm。"},{"key":"D","text":"卸载滚筒一侧，高于卸载滚筒下沿，小于200mm。"}],"answer":"C"},{"type":"choice","q":"堆煤传感器的试验方法：在带式输送机正常空载运行状态下，人为的扳动堆煤传感器的（  ）接地，使保护动作，保护装置报警，输送机停止运行，应（  ）试验1次。","options":[{"key":"A","text":"接触棒或将电极式煤位探头，每天"},{"key":"B","text":"接触棒或将电极式煤位探头，每周"},{"key":"C","text":"接触棒或将电极式煤位探头，每月"},{"key":"D","text":"接触棒或将电极式煤位探头，每年"}],"answer":"A"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB 51145-2015)15.3.2规定：防跑偏保护装置应用支架安装在皮带易出现跑偏的地段，不得用铁丝绑，皮带跑偏且胶带推动传感器的导杆偏离中心线（  ）时，跑偏开关应动作，并应发出跑偏语音报警；当延时（  ）后仍处于跑偏状态时，保护装置主机应自动切断电源。","options":[{"key":"A","text":"10°±5°，10s士5s"},{"key":"B","text":"15°士5°，15s士5s"},{"key":"C","text":"15°士5°，10s士5s"},{"key":"D","text":"10°，15s"}],"answer":"C"},{"type":"choice","q":"跑偏传感器试验：在带式输送机正常空载运行状态下，人为的推动跑偏传感器导杆至动作角度并保持（  ），使限位开关动作，保护装置报警，输送机自动停机。松开传感器导杆，能立即自动复位。跑偏传感器导杆动作角度不得大于（  ）。","options":[{"key":"A","text":"15s士5s，70°"},{"key":"B","text":"10s士5s，70°"},{"key":"C","text":"10s士5s，50°"},{"key":"D","text":"10s士5s，100°"}],"answer":"B"},{"type":"choice","q":"目前我们常用的矿用本质安全型温度传感器有哪几种？","options":[{"key":"A","text":"GWM-45-W-3"},{"key":"B","text":"GWM-45-W-4"},{"key":"C","text":"GWH100"},{"key":"D","text":"GWH300"}],"answer":"ABC"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB51145-2015)15.3.7规定：采用红外线传感器时，传感器发射孔应正对（  ）处进行检测，传感器与主传动滚筒距离为（  ）。","options":[{"key":"A","text":"主传动滚筒，300mm-500mm"},{"key":"B","text":"从动滚筒，300mm-500mm"},{"key":"C","text":"副传动滚筒，300mm-500mm"},{"key":"D","text":"主传动滚筒，10mm-15mm"}],"answer":"A"},{"type":"choice","q":"对主滚简温度的监测将温度阚值设定，《煤矿用带式输送机保护装置技术条件》(MT872-2000) 4.5.4规定：测温点与离被监测点发热处距离为10~15mm时为（  ）；直接测量滚筒表面温度为（  ）；直接测量滚筒内壁温度为（  ）；其他部位依据现场实际情况设定。","options":[{"key":"A","text":"(45士2)℃，(70士2)℃，(60士2)℃"},{"key":"B","text":"(42士2)℃，(75士2)℃，(60士2)℃"},{"key":"C","text":"(42士2)℃，(70士2)℃，(60士2)℃"},{"key":"D","text":"(42士2)℃，(70士2)℃，(65士2)℃"}],"answer":"C"},{"type":"choice","q":"温度传感器试验：拨动温度传感器侧面试验旋钮进行试验或向传感器浇注（  ）热水，保护装置报警，同时启动自动洒水装置，（  ）试验一次。","options":[{"key":"A","text":"50℃，每天"},{"key":"B","text":"40℃，每天"},{"key":"C","text":"80℃，每天"},{"key":"D","text":"70℃，每天"}],"answer":"D"},{"type":"choice","q":"温度传感器试验：传感器本身无试验按钮时，可（  ），人为按动试验按钮试验，或向传感器浇注（  ）热水，使保护输出回路导通，保护装置报警，同时启动自动酒水装置，每天试验一次。","options":[{"key":"A","text":"外接试验按钮，40℃"},{"key":"B","text":"外接试验按钮，50℃"},{"key":"C","text":"外接试验按钮，60℃"},{"key":"D","text":"外接试验按钮，70℃"}],"answer":"D"},{"type":"choice","q":"我们的速度传感器GSC6用的速度传感器探头（  ）更换成了（  ），此速度传感器兼有（  ）速度传感器的信号输出。","options":[{"key":"A","text":"SC，SABC，SA、SC"},{"key":"B","text":"SC，SABC，SB、SC"},{"key":"C","text":"SC，SABC，SA、SB、SC"},{"key":"D","text":"SC，SA，SA、SB、SC"}],"answer":"C"},{"type":"choice","q":"《煤矿用带式输送机保护装置技术条件》(MT872-2000)4.5.1规定：输送带速度在（  ）内均在（  ）Ve(Ve为额定带速)范围内，或输送带速度小于等于（  ）Ve时，或输送带速度大于等于Ve时，打滑保护装置应报警，同时中止带式输送机的运行。对带式输送机的正常启动和停止造成的速度变化，打滑保护装置不应有保护动作。打滑保护应采用（  ）特性。","options":[{"key":"A","text":"5s，(50%-70%)，50%、110%、反时限"},{"key":"B","text":"20s，(50%-70%)，50%、110%、反时限"},{"key":"C","text":"30s，(50%-70%)，50%、110%、反时限"},{"key":"D","text":"10s，(50%-70%)，50%、110%、反时限"}],"answer":"D"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB 51145-2015)16.5.7规定：速度传感器应安装在带式输送机（  ）。固定式带式输送机应装在（  ）之间。当两驱动滚筒较远时，可安装在（ ）之间。","options":[{"key":"A","text":"两驱动滚筒，回程带上面，机头卸载滚筒和驱动滚筒"},{"key":"B","text":"机头卸载滚筒和驱动滚筒，两驱动滚筒，回程带上面"},{"key":"C","text":"回程带上面，机头卸载滚筒和驱动滚筒，两驱动滚筒"},{"key":"D","text":"回程带上面，两驱动滚筒，机头卸载滚筒和驱动滚筒"}],"answer":"C"},{"type":"choice","q":"速度保护装置安装时，传感器应采用标准托架固定在（  ），严禁用（  ）和其它物品捆扎固定。","options":[{"key":"A","text":"带式输送机大架上，铁丝"},{"key":"B","text":"带式输送机托辊，铁丝"},{"key":"C","text":"带式输送机滚筒上，铁丝"},{"key":"D","text":"带式输送机皮带，铁丝"}],"answer":"A"},{"type":"choice","q":"速度传感器试验：在带式输送机正常空载运行状态下,用（  ）将滚轮提起使其脱离皮带表面（  ）秒，保护装置报警，输送机停止运行，（  ）试验1次。","options":[{"key":"A","text":"制作的专用工具，3~5，每天"},{"key":"B","text":"制作的专用工具，3~5，每周"},{"key":"C","text":"制作的专用工具，3~5，每月"},{"key":"D","text":"制作的专用工具，5~10，每天"}],"answer":"A"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB51145-2015)15.3.5规定：主运带式输送机应在（  ）下方，向 （  ）方向，（  ）以内应安装防撕裂保护。","options":[{"key":"A","text":"落煤点 ，机尾，10m~15m"},{"key":"B","text":"落煤点 ，机头，10m~15m"},{"key":"C","text":"落煤点 ，机头，5m~10m"},{"key":"D","text":"落煤点 ，机尾，5m~10m"}],"answer":"B"},{"type":"choice","q":"《煤矿电气设备安装工程施工与验收规范》(GB51145-2015)15.3.5规定：压电式和牵引钢丝绳式的防撕裂保护应安装在（  ），安装时应（  ），并应将防撕裂保护安装在带式输送机的纵梁上，应（  ）。","options":[{"key":"A","text":"输送机上下层胶带之间，随便固定，靠上层胶带方向"},{"key":"B","text":"输送机上下层胶带之间，加工标准托架，靠下层胶带方向"},{"key":"C","text":"输送机上下层胶带之间，加工标准托架，靠上层胶带方向"},{"key":"D","text":"输送机上下层胶带之间，随便固定，靠下层胶带方向"}],"answer":"C"},{"type":"choice","q":"翻板式撕裂传感器试验:按压翻板式撕裂传感器L板的上臂(或推动L板的下臂)，使（  ）和（  ）偏离，主控制器出现报警并显示对应撕裂传感器保护，皮带无法起动，视为保护正常，（  ）试验1次。","options":[{"key":"A","text":"磁头 ，检测探头，每月"},{"key":"B","text":"磁头 ，皮带架，每天"},{"key":"C","text":"磁头 ，皮带，每天"},{"key":"D","text":"磁头 ，检测探头，每天"}],"answer":"D"},{"type":"choice","q":"牵引钢丝绳式撕裂 q":"采用红外传感器时，传感器发射孔正对主传动滚筒轴承端盖，传感器与主传动滚筒距离应为______。","segments":["300-500mm"],"full":"采用红外传感器时，传感器发射孔正对主传动滚筒轴承端盖，传感器与主传动滚筒距离应为 300-500mm 。"},{"type":"fill","q":"双向急停开关在任何一边的拉线上施加______的力时，双向急停开关能终止带式输送机的运行，并能自锁和复位。","segments":["40-200N"],"full":"双向急停开关在任何一边的拉线上施加 40-200N 的力时，双向急停开关能终止带式输送机的运行，并能自锁和复位。"}],"short":[{"type":"short","q":"按“5”键起破碎机时，控制器可以报警、起车，但接触器不动作，且接触器是正常的，这是什么原因，如何解决？","answer":"可能是控制破碎机的控制口坏了，通过参数调整将控制破碎机的口换一个，或者换一个 I/O模块将控制线拆除再起车，测量控制输出口是否真的闭合，如果闭合检查连接线是否有问题，如果未闭合则更换输出口或I/O模块。"},{"type":"short","q":"如何调节语言处理模块充电电流？描述拨码位置与充电电流的对应关系。","answer":"语音处理模块内部的充电电流可以通过K1K2调节，充电电流在15、20、25和30mA四档可调，通常出厂时设定为20mA。 什么情况下会出现过流保护，什么情况下会出现过压保护？ 答：a. 如外部负载变大，造成电源的输出电流超过了系统能提供的最大电流，系统会过流保护（当负载变小后，电源可自动恢复供电） b. 当给电源的交流电，电压过高，电源会切断自身输出，系统会过压保护（此时必须停电一分钟后电源才能恢复）"},{"type":"short","q":"现场在无配件情况下如何临时甩掉闭锁板？如果在工作面甩掉闭锁板还要注意什么？","answer":"将闭锁板6芯插头拔下来，将查询线、闭锁线分别短接过去。工作面甩掉闭锁板要注意远停的位置，如果在远停之前就需要调整远停的位置。"},{"type":"short","q":"描述一下示波器测沿线查询线上的波形时如何连接？如果沿线有2台电话，终端正常，画出波形示意图。如果2台电话其中1台是AI ，画出波形示意图。","answer":"示波器两支表笔分别接4号查询线、5号18V电源地。"},{"type":"short","q":"KTC101系统画面提示“第5台故障或线路断”，能够启停车，实际沿线共10台电话，分析故障原因，并说出相应的解决办法。","answer":"可能第5台电话闭锁板坏或第4、5两台电话之间电缆查询线断。 处理办法：把终端插第4台电话后面，如果显示正常，那么用两通和终端测下4、5之间的电缆是否正常，如果正常，将终端插第5台电话后如果故障，更换内部闭锁板试试。"},{"type":"short","q":"若现场反映语音质量不好，请问你如何处理。从使用上和维护上叙述。","answer":"使用上可以通过调节送话和放音音量；维护上注意扩音电话不要受潮、进煤尘，安装位置避开潮湿滴水的环境、最好添加干燥剂定期更换。"},{"type":"short","q":"KTC101-Z的组成及各组成部分功能。","answer":"由主控模块、中位机模块、母板、接线端子排、语音处理模块、闭锁模块、扬声器、送话组件、键盘等组成。"},{"type":"short","q":"简要描述用摇表检测沿线故障的操作方法及操作步骤","answer":"首先，确定摇表工作正常，匀速摇动摇表，检察开路和短路表针位置。然后，将电缆或电话两端拔下，将工端插到电缆或电话一端。然后，将工端的所有7芯线短接（将小开关拨到通上），测量7芯对外屏蔽的绝缘值。如果绝缘值大于30M则电缆是好的。如果绝缘小于30M则电缆或电话需要干燥。另外如果绝缘够还是需要用手检测一下电缆是不有外伤"},{"type":"short","q":"KTC101系统画面提示“急停线断在0，1台”，无法启车，请分析可能的原因及检查处理方法。","answer":"原因：1.18V电源模块故障或保护。2.沿线有干扰或有短路。3.CS模块故障。4.主机通讯板故障。\n处理方法：先排查18V电源问题，如果正常则把分站插到主机后面，查看是否恢复正常，如果正常就把分站顺着沿线向后插，排查到不正常位置后更换电话、闭锁或电缆；如果插到主机故障未解决则更换主机CS模块或者闭锁模块。检查主机是否独立接地，沿线电缆是否和动力电缆平行敷设或交缠在一起，检查电缆、电话、闭锁的七芯对地绝缘和相间绝缘。"},{"type":"short","q":"KTC101系统沿线电话有杂声，终端电压显示“0.00”，请分析可能的原因，并说出相应的解决方法。","answer":"可能沿线音频线与数据线虚接或短路，用两通和终端分段检查沿线电缆或下位机6、7号数据线、音频线是否正常。"},{"type":"short","q":"从产品设计上，电源箱采取哪些措施来避免电压波动对我们设备供电的影响？在现场我们为了避免电压波动我们应注意什么？","answer":"增加保险管、滤波器来清除杂波避免电压波动影响系统工作。 给系统供电的综保要输出稳定、单独供电，输入不要过高或偏低。"},{"type":"short","q":"电源模块出现过流保护是什么现象？出现过压保护是什么现象？如何区分过流保护和欠压保护？","answer":"过流保护出现时电源模块关断输出，等负载降下来后输出自动恢复正常。 过压保护出现时电源模块无输出，需要重新断电等5分钟后上电才能恢复。 区分二者看去掉负载以后看能否恢复正常输出"},{"type":"short","q":"我们现在的堆煤传感器有两种，分别指出这两种的传感器的区别和安装注意事项","answer":"电集式堆煤传感器需要供电，安装时可以安在落煤点附近任何位置，通过电极引出的探测线与大地构成回路来实现堆煤保护。 节点式堆煤传感器不需要供电，安装时必须安装在落煤点，通过接触到煤，倾斜一定角度来实现。"},{"type":"short","q":"一套KTC101系统，控制器显示急停线断在4、5而且终端无电压显示，只要系统送电所有电话均发出“哒、哒”的震荡声，停电时正常。判断下故障原因，如何处理？","answer":"第4、5两台电话之间的电缆中，音频线与闭锁线短路，另外沿线6、7号数据线有问题，存在断路或虚断。 用两通、终端、万用表等工具检查电缆。"},{"type":"short","q":"画图说明硬件闭锁中，CS1、CS2沿线与母板拨码小开关的关系","answer":""},{"type":"short","q":"只要用某一电话送话，控制器CS1就显示配置一下，如果设备运行中就会显示急停，如何处理？","answer":"可能是 语音模块故障，可能是沿线负载太多，一喊话语音模块一充电，导致18V过流保护了一下，过流保护自动恢复，那么CS配置一下。"},{"type":"short","q":"沿线喊话正常，但报警声听不全，如何处理？","answer":"SP模块放音旋钮调节不合适，或者是语音模块亏电。"},{"type":"short","q":"一套KTC101系统一条沿线控制两条皮带，如何实现2条皮带沿线分别闭锁？","answer":"将下皮带的急停闭锁改成远停（将急停线短接），然后控制器设置下皮带远停号。既可实现打远停只停下皮带。"},{"type":"short","q":"画图说明KTC256通讯系统配合智能中继使用可实现哪种搭接方式。","answer":"智能中继分段管理，实现长距离、T型分叉控制。"},{"type":"short","q":"KTC256通讯控制系统主机联络图（含127V电源示意图）。","answer":""},{"type":"short","q":"画图并说明如何通过KTC256控制器母板上拨码开关设置操作台上闭锁按钮与沿线闭锁关系。","answer":""},{"type":"short","q":"画图说明如何选择设置DIO与CS沿线闭锁连锁关系。","answer":"①通过LS模块拨码开关选择DIO与哪条CS沿线闭锁连锁；②通过参数控制输出点详情设置是否硬连锁使能。"},{"type":"short","q":"简述皮带保护系统敷设沿线线缆及电话的标准并画出示意图。","answer":"扩音电话（闭锁开关）安装标准：将第3台扩音电话固定好，连接上8芯线缆后，向后敷设沿线；沿线敷设到第4台扩音电话处将其拉直，然后顺着红色箭头方向松20CM，将第4台电话再进行安装固定。"},{"type":"short","q":"2500米皮带（沿线按100米一个闭锁，200米一个电话，皮带机头第一个以急停闭锁开始配置），主控放置位置离皮带机头约20米，机头有23路输入量、12路输出量需要接入，皮带中部每隔600米有一对跑偏（第一对在离机头500米处），皮带机尾有9路输入量、4路输出量需要接入。请问除了主控制器外，DIO沿线需要什么设备及数量（请写出电缆长度），CS1沿线需要什么设备及数量。 有如下设备可供选择：DIO、5米及20米七芯电缆、DIO终端、下位机、普通电话、IO电话、中继电话、急停闭锁、下位机、沿线终端、25米及100米八芯电缆。","answer":"DIO沿线所需设备：2个DIO，1根5米七芯电缆，1根20米七芯电缆、DIO终端。 CS1沿线所需设备：2根25米八芯电缆、25根100米八芯电缆、13个急停闭锁、9个普通电话、4个IO电话、1个下位机、1个沿线终端。"},{"type":"short","q":"我们的KTC101系统，沿线中除电源线外还有4种信号线，而我们的KTC256系统对沿线信号进行了融合升级，请简述如下问题：KTC256系统沿线对什么信号进行了融合？这样做有什么好处？","answer":"A、CAN线和脉冲查询线融合。B、融合后解决了和由于环境（比如闭锁板受潮）或者其他因素引起的闭锁板错误应答，导致的沿线闭锁模块数量显示忽多忽少、故障判断不准确的问题。"},{"type":"short","q":"请写出下图中终端上的三组电压值和表格里的六组电压值对应的是系统哪个电源。","answer":""},{"type":"short","q":"请说明KTC101系统沿线电话甩掉闭锁模块的操作方法。","answer":"1、拔掉6芯插头；2、短接查询（3、4号线）、短接闭锁（1、2号线）；3、在工作面甩闭锁板一定注意，被甩的闭锁板后有无远停，如果有，远停台号将改变，需要在参数里重新设置远停台号"},{"type":"short","q":"请说明KTC101系统甩掉沿线下位机模块的方法。","answer":"将接入下位机的7芯插头中的（4、5）两颗线短接即可，参数上把沿线下位机的数量减少1，并作相应的参数调整。"},{"type":"short","q":"若现场某设备沿线按下闭锁时停机，解除闭锁后立刻启动且无预警，请分析原因。","answer":"可能是该设备有硬件闭锁，未设置软件与沿线闭锁连锁。按下闭锁时，硬件闭锁起作用，控制点断开，设备停机，但软件未停机，解除闭锁时，控制点闭合，设备无预警启动。"},{"type":"short","q":"请画出KTC150系统原理框图","answer":""},{"type":"short","q":"请说出KTC150系统各电源模块的用途","answer":"① A6V 为主控制模块供电； ② A12V 为 2 个接口隔离转换板和视频转换板的控制隔离电路供电； ③ B12V 为工控机、视频转换板及交换机供电； ④ C12V 为中位机模块包括键盘部分供电，D12V 为外部传感器及输入检测供电； ⑤ A18V 为 CS1 沿线供电； ⑥ B18V 为 CS2 沿线供电； ⑦ 550mA 为液晶屏背光供电。"},{"type":"short","q":"简述下KTC102系统皮带控制如何实现连锁和音频耦合。","answer":"1号控制器不需要设置任何参数，在2号控制器中设置联锁有效（上皮带没起车时本条皮带不能起车）。接线：将HA/HAI电话出线嘴音频线接到TK210YGL音频耦合联锁模块S1端，地线接COM端，模块插针插在控制台端子排5、6、7上，控制器端子排音频接到模块S2端。1号控制器端子排中18V电源串上三号电机输出点，再接2.2K电阻到音频线。当1号皮带运行后，三号电机继电器吸合给音频线供18V，使联锁模块工作实现音频耦合和联锁。"},{"type":"short","q":"KTC102工作面系统起车预警后显示屏在设备后显示故障同时停车是什么原因？显示有错同时停车是什么原因？","answer":"故障：控制器启动设备前检测沿线是否真正有报警信号，如报警未传到终端被提前中断，则显示故障并不起车。有错：如参数设置了检测开关反馈，启动设备后检测不到反馈信号则停车并显示有错。"},{"type":"short","q":"KTC102系统中JJ控制器是做什么用的？","answer":"型号KTC102.1-JJ，用于绞车过卷逻辑，采用老主板，改了程序和报警语音。"},{"type":"short","q":"KTC102系统中KA电话是干什么用的？","answer":"型号KTC102.3-1-KA，可接入四路输入信号，根据输入信号组合的不同发出不同报警声音。没有光报警（KG型有声光报警）。"},{"type":"short","q":"如果远停号与实际C电话位置设置错误，会出现什么情况？","answer":"举例：C电话为4,5,6，若远方停车台号设成2，打下2号闭锁相当于打了沿线闭锁，所有设备全停，屏幕报五号线路断。正常应将远方停车台号设成4，默认4远停前溜，6远停后溜。"},{"type":"short","q":"KTC102主板有几种芯片可以更换？在什么情况下更换？","answer":"1.2817芯片：报2817故障可先断电按住任意键重新上电，不行则更换。2.程序芯片：需要不同预警次数（如神东要求至少30S/6次预警）时更换。3.语音报警板（贴片）：若起车预警次数被写死（如只有2次）即使设置30S也无效，需更换语音报警板。"},{"type":"short","q":"如果KTC102液晶不亮，简述一步一步处理的过程。","answer":"先测12V电源是否正常；如正常调节液晶灰度电位器看能否恢复；如不行检查排线是否损坏；如一切正常则可能是液晶本身损坏需更换。"},{"type":"short","q":"KTC102系统画面提示五号线路断，请分析可能的原因及检查处理方法。","answer":"可能是电缆中闭锁线在某处断路。处理：将终端直接插控制器上测试，如正常则分段检查电缆或电话确定故障位置并更换；如不正常则更换终端或检查控制器内部线路。"},{"type":"short","q":"KTC102控制器门子上的闭锁按钮和沿线电话闭锁原理是否一样？按下后显示什么？为什么？","answer":"不一样。控制器门子上的闭锁是切断18V电源，按下后显示第01台故障或线路断。因为沿线设备由该18V供电，切断后沿线无电。"},{"type":"short","q":"KTC102系统工作面电源箱里有几块电源模块？分别给什么供电？和皮带系统电源箱是否通用？","answer":"工作面电源箱有2块电源模块：18V给沿线供电，12V给主板和液晶屏供电。绿灯为18V指示灯，红灯为12V指示灯。电源箱与皮带系统通用，只是皮带系统多一块12V电源模块。"},{"type":"short","q":"KTC102系统沿线能否接跑偏？能接多少？如何实现的？","answer":"能接多台。每台智能电话里的保护检测模块可在查询线上返回脉宽固定的跑偏和纵撕信号，主板检测识别该脉冲判定跑偏动作。机尾HAI电话接跑偏是利用切断急停线原理。"},{"type":"short","q":"新版KTC102系统增加了哪些功能？","answer":"1.模拟量信号检测（速度、张力）；2.头跑偏尾跑偏、头烟雾尾烟雾；3.通讯功能（标准串口通讯，可调度远控）；4.可切换皮带方式和工作面方式。"},{"type":"short","q":"KTC102中控制器显示第01台故障或线路断，但把终端接在控制器上仍显示第01台故障或线路断，是什么原因？","answer":"先看门子上的闭锁按钮是否拔起；如拔起了再测量18V是否有电；如都正常，检查控制器另一个插座是否连有电缆，是否该侧沿线短路造成。"},{"type":"short","q":"简答超温洒水电磁阀的常见故障及分析方法？","answer":"温度报警时电磁阀不洒水：1.检查电磁阀AC127V电源是否接好；2.检查超温洒水输出点是否闭合；3.用AC127V直接给电磁阀供电看能否打开，如水不从出口流出则阀芯损坏需更换；4.检查过滤网是否被水垢堵塞，堵塞则清理。"},{"type":"short","q":"KTC102新老电源模块有什么区别？新模块有什么好处？两种模块能否通用？","answer":"老模块：9V/12V模块输入为变压器降压后的20V交流电，18V模块输入为28V交流电。新模块：输入交流70V至260V均可，配套变压器为升压变压器（127V升为150V）。好处：避免大型设备启动时电压突降导致模块掉电。新模块可用于老电源箱（127V不经变压器直接接模块），但老模块不能用于新电源箱。"},{"type":"short","q":"KTC102系统控制器端子排上输入口的检测电压是多少伏？由哪个模块供电？","answer":"输入口检测电压为12V，由18V模块通过7812稳压芯片转换得到。"},{"type":"short","q":"GSC6-SA/B速度传感器的KA和KB接点有什么区别？","answer":"KB接点：速度保护时常闭，速度正常或停机时常开。KA接点：速度保护时常开，速度正常时常闭。若接SB型速度传感器需将返回备用2用短路线短接，因为SA和SB信号类型不同，主控需检测端口通断来判断型号。"},{"type":"short","q":"如何将两个电源模块并在一起使用？","answer":"将负极直接连接，正极各串一个IN4007二极管后再连接，防止倒流。"},{"type":"short","q":"KDG-127/3-4远程控制箱的工作原理是什么？","answer":"控制器本安端子排输出点给远程控制箱输入点一个闭合信号（输入点两端为18V直流电压），将18V引到隔离继电器，继电器得电后发出闭合信号给远程控制箱输出点，从而带动设备开关动作。实现本安侧与非本安侧的电气隔离。"},{"type":"short","q":"光耦和电子继电器有什么区别？","answer":"光耦用于信号耦合和隔离，两个供电系统互不干涉，可耦合开关量、频率量、模拟量信号。电子继电器（继电器）只能耦合开关量信号。"},{"type":"short","q":"KTC102系统中通讯电缆有几种？线序定义及作用？","answer":"两种电缆：1.七芯电缆（实际用五芯）：1#音频、2#查询、3#18V正、4#空、5#18V负、6#闭锁、7#空。2.五芯电缆：1#18V正、2#18V负、3#音频、4#查询、5#闭锁。作用：18V正负给沿线设备供电；音频线传输声音和报警；查询线实现闭锁/远停/智能电话/保护/终端信号位置查询；闭锁线实现沿线急停闭锁。"},{"type":"short","q":"KTC102系统组成都有哪些部分，分别的作用是什么？","answer":"1.主控制器：控制、监测、显示中心。2.隔爆兼本安电源箱：装置供电，127V正负50%范围可靠工作。3.组合扩音电话：沿线闭锁、通话、预警（打点）、拉线急停。4.机尾带输入组合扩音电话：除基本功能外还带跑偏、纵撕输入。5.五芯拉力阻燃电缆：双层护套、双层屏蔽、快速插头。6.远程控制箱：非本安设备电气隔离转换。7.传感器产品：皮带机保护。8.多功能终端：沿线最末端。"},{"type":"short","q":"KTC101系统控制一条皮带，皮带启车后，频繁出现CS1“在线”和“在配置”交替闪烁，下位机查询无应答，下位机上接入保护的输入点报故障，皮带停车，请分析可能的故障原因并给出对应的处理方案。","answer":"原因：1.沿线有干扰。2.沿线有电话或电缆有短路。3.中位机模块故障。\n处理方法：检查主机是否独立接地，检查沿线电话、闭锁是否和动力电缆或设备平行敷设或交缠，检查沿线电缆、电话、闭锁七芯对地绝缘和相间绝缘，也可用终端插到沿线中分段排查沿线问题，插到哪个位置正常，则继续往机尾继续排查，如果不正常则往机头继续排查，直到故障点则更换，更换中位机模块，看是否是其它模块影响CS1模块复位。"},{"type":"short","q":"KTC101系统控制一条皮带，系统监测四台电机的绕组和轴承温度，皮带启动后出现温度频繁报故障，皮带停机后显示正常，且存在温度值波动大、显示数值偏小的问题，请分析可能的故障原因并给出对应的处理方案。","answer":"原因：1.干扰引起。2.保护故障。\n处理方法：检查保护电缆屏蔽层是否接地，或者更换带屏蔽的T/F转换模块并给模块单独供电，温度量程应在各手转器上调试量程设置，常用（0~200℃）。"},{"type":"short","q":"某KTC101系统沿线电话存在人员喊话声音小的问题，请给出指导现场工人如何排查处理的方案。","answer":"1.喊话时距离驻极体10-15cm。2.摘掉口罩。3.查看驻极体是否有煤泥堵住，滤网是否生锈，防水膜是否破损。4.更换驻极体。"},{"type":"short","q":"KTC101系统白屏，整个系统停止工作，请分析可能的故障原因并给出对应的处理方案。","answer":"原因：1.电源模块保护或故障（A6V）。2.主控模块故障。\n处理方法：先排查电源模块是否有6V电压输出，如果没有，停电3分钟再上电，电源模块不能恢复则更换；如果有输出，测量6芯插头里线、地线是否有电到主控针插头1、2是否有电，没有则更换排线；如果都正常则更换主控模块。"},{"type":"short","q":"KTC101系统界面显示中位机模块都不在线，请分析可能的故障原因并给出对应的处理方案。","answer":"原因：1.A12V电源模块保护或故障。2.中位机模块故障。3.母板故障。4.主控故障或和中位机通讯故障。\n处理方法：先排查12V电源模块是否有输出，没有则停电3分钟再上电，电源模块不能恢复则更换；如果有则测量6芯插头里6、7号线是否有电，没有则更换线缆；把中位机模块都拔下来一个一个的插上，看是否有模块损坏；如果都不在线，更换母板再排查；最后更换主控再排查。"},{"type":"short","q":"画简图并说明KTC101系统沿线查询过程。","answer":"CS模块沿查询线发送一个脉冲信号，第一个闭锁接收到以后，检查自身微动小开关是否闭合，没有闭合就是没有闭锁，闭合就是有闭锁，然后回复一个脉冲信号给CS模块，同时关闭自身电源小开关；CS模块收到第一个闭锁回复后，再发出一个脉冲信号，第一个闭锁在这一查询周期内不再回复，继续到第二个闭锁，重复之前步骤，以此类推，一直到终端回复后，一个查询周期完成，间隔500ms左右后，再次重复之前步骤。"},{"type":"short","q":"画简图说明两套KTC101系统如何实现尾尾搭接，实现音频耦合及数据交换，并说明有哪些要求。","answer":"通过闭锁线终端实现两套KTC101系统尾尾搭接，耦合两套系统之间的音频和数据。\n要求：1.两台主控必须是一个皮带一个工作面。2.必须是CS1沿线。3.系统参数里CS1是否与其它控制器联系改成联系。"},{"type":"short","q":"KTC101系统沿线闭锁线断开（断链）时，如何定位断点位置？CS模块如何响应闭锁反馈？","answer":"终端沿线闭锁线发送一个直流电流信号，如果闭锁线断开，断点前是一个低电平信号，断点后是一个高电平信号。\nCS模块根据闭锁反馈的情况进行响应：闭锁断开是8ms，闭锁接通是13ms，之后是5ms。"},{"type":"short","q":"KTC101系统沿线按下闭锁但设备不停车，可能的原因及处理方法？","answer":"①检查软件闭锁、硬件闭锁是否都设置正确；②检查沿线是否有较强干扰，如有变频器，尤其注意沿线铺设远离变频器及动力线；③检查控制器IO及下位机输入是否有干扰引入，加继电器或远程控制箱隔离；④检查现场CS模块版本，如是V3.9及更老版本，建议更换成V3.9D及以上版本。"},{"type":"short","q":"KTC101系统与变频器配接时，如何避免变频干扰？","answer":"①系统供电（AC127V）不要与变频器共用一台变压器，需单独提供AC127V给系统供电；②系统电源需独立接地，不与变频设备共地；③与变频器配接的所有控制线和反馈线都需要用远程控制箱隔离（注意：控制和反馈不要用同一台远程控制箱隔离，否则隔离失效）；④沿线远离变频器或变频器动力线及与变频器使用同一台移变的设备动力线。"},{"type":"short","q":"KTC101系统沿线设备安装不规范容易引发哪些故障？安装时应注意什么？","answer":"①沿线设备连接未用专用U型销紧固；②沿线设备未加装防尘罩；③喇叭嘴未拧紧；④沿线设备在有滴水的环境中未加防护；⑤沿线与动力线或变频设备线平行铺设或缠绕。以上都会引起沿线故障，安装时应避免。"},{"type":"short","q":"长沿线（2000米以上）KTC101系统如何解决本安电源带载能力不足问题？","answer":"①增加中继电源供电；②电源箱及中继所带负载控制在2000米（10个闭锁+10个扩音电话，100米电缆）或1200米（12个闭锁+12个扩音电话，50米电缆）以内；③检查供电电源输出电流不大于650mA；④检查到下台中继之前的沿线电压不低于DC13.5V。"},{"type":"short","q":"沿线传感器受潮或进水、绝缘下降会引入干扰，常见传感器应如何处理？","answer":"①堆煤传感器：接地极要单独引出来接到落煤点附近并固定在挡煤板上，或发生堆煤时接地极能可靠接触到煤的地方，不可将接地极接到设备接地极或仅引到堆煤传感器上盖，否则传感器不灵敏；②跑偏传感器：接线腔受潮或进水会造成故障，应检查接线腔；③撕裂传感器（压电式）：易受潮进水造成信号线接地，应检查。"},{"type":"short","q":"用摇表检测沿线绝缘时，合格标准是多少？","answer":"①检测整条沿线七芯线对外屏蔽（整体）绝缘：大于20MΩ说明绝缘良好，小于20MΩ说明绝缘不好，有可能影响正常使用；②检测单条电缆7芯之间绝缘：大于30MΩ说明各芯线绝缘良好，小于30MΩ说明绝缘不好，有可能影响正常使用。"},{"type":"short","q":"CAN总线数据诊断仪的信号线定义是什么？主控母板25芯左插头上CS1、CS2沿线CAN信号在哪几个端子？","answer":"信号线定义：红=电源正，黑=电源负，黄=CAN1H，绿=CAN1L，黄=CAN2H，绿=CAN2L。主控母板25芯左插头：14#=CS1沿线CANH，1#=CS1沿线CANL，5#=CS2沿线CANH，18#=CS2沿线CANL。"},{"type":"short","q":"用示波器观察KTC101系统沿线各应答脉冲的时间宽度各是多少？","answer":"主控查询脉冲：5ms；闭锁板应答脉冲：正常脉冲2-7ms（5ms）、闭锁脉冲7-11ms（8ms）、智能闭锁板输入1闭合18-23ms（20ms）、智能闭锁板输入2闭合二级跑偏23-27ms（25ms）；下位机脉冲：第一脉冲27-32.5ms（30ms），等待1-5ms，接收第二脉冲4-8ms（6ms）；终端：无语音33-42ms（36ms）、有语音42-52ms（45ms）。"},{"type":"short","q":"什么是忽略脉冲？什么情况下会出现？","answer":"如果在参数中没有设置下位机数量，那么下位机的应答在双脉冲之后还会多一个脉冲，称之为忽略脉冲。"},{"type":"short","q":"用万用表测量电路通断时，如何判断断路与导通？","answer":"两个表笔探针并联到被测电路两侧，如果电阻值＞70Ω，认为电路断路，蜂鸣器不报警；电阻＜10Ω，认为电路良好导通，蜂鸣器发出连续声响。测量时被测电路两端不能带电，否则读数不准。常用于测量开关量传感器的通断状态和控制输出端口的通断状态。"},{"type":"short","q":"KTC101系统IO模块硬件强制闭锁如何设置？强制闭锁选择开关K1、K2出厂默认位置是什么？","answer":"强制闭锁选择开关用来选择设定IO1前六路和IO2前六路输出端口与沿线的硬件闭锁连锁关系。出厂默认K1为OFF，K2为ON，IO1和IO2前六路都与CS1沿线有硬件闭锁连锁关系（目前仅支持K1为OFF，K2为ON，现场请勿改动拨码位置）。IO1和IO2强制闭锁设定组均有三排插针，里面两排针设定硬件闭锁连锁，外面一排为悬空针。出厂默认IO1前六路硬件闭锁设定组均没有插短路子，IO2前六路都插了短路子，即IO1前六路与CS1沿线有硬件闭锁连锁关系，IO2前六路与CS1沿线无连锁关系。如需IO2前六路控制的设备闭锁停车，需将对应控制回路强制闭锁设定短路子拔掉或插在外面两排针上。"},{"type":"short","q":"下位机四路控制输出端口如何设置硬件强制闭锁？短路子与输出端口如何对应？","answer":"每一台下位机上的四路控制输出端口可通过下位机模块上的短路子设定与所在CS沿线的硬件闭锁连锁关系。强制闭锁设定跳线组有三排插针，上面两排插针设定强制闭锁，下面一排悬空。出厂默认四路控制输出端强制闭锁短路子是插上的，即默认不与CS沿线强制闭锁连锁。若控制设备要求闭锁停机，需将对应跳线短路子拔掉或将短路子插在第二排和第三排插针上。跳线短路子与控制端口的对应关系：从左向右分别对应输出2、输出4、输出3、输出1。"},{"type":"short","q":"KTC101系统软件闭锁如何设置？","answer":"在“设备设置”→“基本参数”中，将“与急停闭锁关系”通过左右箭头选择闭锁时需要停机的CS沿线号。如：CS1沿线闭锁时需要停1#皮带，则“1#皮带基本参数”中“与急停闭锁关系”设置为“CS1”。"},{"type":"short","q":"KTC101MAX系统硬件强制闭锁拨码开关如何设置？","answer":"若只有一条CS1沿线，且沿线按下闭锁时需要设备停机，需将拨码开关1#拨码拨到上面ON位置，2#拨码拨到下面位置；若CS1+CS2沿线，哪条沿线上的闭锁按下需要设备停机，将对应拨码开关拨到上面ON位置。注意：如果现场为单CS1沿线，且CS2沿线无设备也无终端，只能将1#拨码拨到ON位置，2#拨码不能拨到ON的位置，否则LS会判定CS2沿线断路，DIO控制输出点无法闭合。"},{"type":"short","q":"KTC102+系统闭锁连锁如何设置？","answer":"出厂默认12路控制输出短路子都是短接上的，即都没有硬件强制闭锁。需要第几路上设备打闭锁停机，要求将对应插针上的短路子拔掉即可。控制皮带时，软件默认与沿线闭锁联锁；控制工作面时，破碎机可以选择设置是否与闭锁联锁，转载机和前后溜必须与沿线闭锁联锁，程序无法设置。推荐方式：如果按下闭锁需要设备停机，需要将硬件闭锁和软件闭锁都要设置上；如果按下闭锁不需要停机，硬件闭锁和软件闭锁都不要设置。"},{"type":"short","q":"皮带张力下降保护功能如何设置？张力过低或过高时系统如何处理？","answer":"在“自动张紧参数”界面进行设置，即使现场张紧系统不是由华宁控制，此界面参数也需要设置，张紧完成输入点短接即可。张力传感器参数需设置：自动张紧参数不设置，会造成“皮带启动前的预紧力下限”保护不起作用。保护动作：张力过低启动失败、运行中张力过低停车、运行中张力过高停车、启动前张力过高允许启动。"},{"type":"short","q":"KDW101电源箱过压保护的动作机理是什么？","answer":"当输入的交流127V过高时（一般达到180V时），电源各模块会自动关断输出（即输出直流电压为0），并且只有停电并维持3分钟以上后再送电才能恢复输出，这就是过压保护。记住，停电才能恢复的情况，就是发生了过压保护。"},{"type":"short","q":"电源箱A6V和B6V模块故障分别有什么现象？如何排查？","answer":"A6V：给主控模块程序部分供电。故障后屏幕白屏：没有显示，但有背景光，整个系统停止工作。排查：把A6V和B6V输出调换，看系统是否可以工作，即可判断是否是A6V的问题。B6V：给主控模块背景灯部分供电。故障后屏幕黑屏：没有显示，也没有背景光，但整个系统能正常工作。排查：把A6V和B6V输出调换，看背景灯是否亮，即可判断是否是B6V的故障。"},{"type":"short","q":"电源箱六芯电缆（带不锈钢插头）各组线与七芯电缆插头端子如何对应？","answer":"第一组：红色—七芯电缆插头1号端子—接电源A6V模块正；黑色—2号端子—接A6V模块负。第二组：红色—3号端子—接电源B6V模块正；白色—5号端子—接B6V模块负。第三组：紫色—6号端子—接电源A12V模块正；黑色—7号端子—接A12V模块负。接地线固定在电源壳内接地螺栓上。"},{"type":"short","q":"KTC101系统沿线七芯电缆各芯断路分别有什么故障现象？","answer":"1#（音频）断：断点前后不能通话，语音报警只能从控制器传输到音频线断点处；如参数“语音信号检测”设为“检测”，设备将不能起车。2#（闭锁）断：只有软件闭锁时报警停车，运行状态显示急停，故障显示急停线断在第X、X台电话之间；只有硬件闭锁时，恢复闭锁以后之前闭合的有硬件闭锁的前六路控制输出点会立刻闭合，设备起车且无预警。3#（18V+）断：显示第X台故障或线路断，沿线状态只显示断路以前的电话，设备报急停停车。4#（查询）断：沿线下位机设为不复位时断线不影响起停车；设为复位时断在下位机之前不能起车；有远停时断在远停之前此远停不能起作用。5#（18V-）断：显示第X台故障或线路断，沿线断点后无显示电话。6#、7#（CAN）断：不复位时沿线无下位机不影响启停车，有下位机且接有保护和控制线时断在下位机前设备停车，断在下位机后不停车，终端电压显示“×××”；复位时数据线断在下位机前后都显示在配置，终端电压显示“×××”，设备无法正常运行。"},{"type":"short","q":"KTC101系统沿线2#闭锁线与18V+短路、2#闭锁线与查询线短路分别有什么现象？","answer":"2#闭锁线与3#（18V+）短路：设备急停，显示“急停线断在0，1台”；前方有闭锁时不能显示故障现象；虚短时将连续不断地进行闭锁报警。2#闭锁线与4#（查询线）短路：显示“第1台故障或线路断”，沿线无电话显示，不影响设备启停；有闭锁时显示正常闭锁位置。"},{"type":"short","q":"KTC101控制器内各中位机模块的型号是什么？安装时有哪些注意事项？","answer":"沿线检测模块KTC101-Z.02（CS模块）：CS模块目前只能插在CS1或CS2的插槽位置，是通用模块，具体是CS1还是CS2和插到哪个插槽有关，一个控制器最多装2个。IO模块KTC101-Z.03：10路开关量输出、12路开关量/频率量输入，最多2个，具体是IO1还是IO2和插槽有关，决不要插到IN模块的位置。语言报警模块KTC101-Z.06（SP模块）：只能插在固定位置，参数设为“无效”将没有语言报警，带调节电位器。纯输入模块KTC101-Z.04（IN模块）：24路纯输入，非标准配置，需配专用带插头多芯电缆和专用接线盒。耦合器模块KTC101-Z.05（COU模块）：必须插在CS2插槽位置，不是由该控制器供电，而是由另一个控制器CS沿线18V供电。键盘模块KTC101-Z.08（KEY模块）：检测按键值上传主控。通信模块KTC101-Z.10-1（COM模块）：提供一路调制解调器接口，不要从配置参数中配置。母板KTC101-Z.07：8个白色96芯插座。"},{"type":"short","q":"KTC101系统IO模块、CS模块、IN模块、COU模块、KEY模块常见故障如何排查？","answer":"IO模块：某几路输出不闭合可能是继电器坏（更换其他输出点或更换模块）或前6路带有强制闭锁且沿线急停线断（甩掉强制闭锁或使沿线正常）；输入故障可能是输入点损坏（换输入点或换模块）、B12V没电（检查B12V）或有干扰（加隔离）。CS模块：故障线路断是模块无法查询（换模块）；不停在配置是下位机没有找到（参数里设成不复位）；不在线是模块CAN线故障（换模块）。SP模块：无报警是模块坏（换模块）；报警声音小是音量电位器调小（调整电位器）。IN模块：所有输入故障可能是25芯线没插或松动（排查25芯连接线）或B12V没电（检测B12V电源）。COU模块：不在线可能是模块坏（排查25芯连接线）或上一台控制器的18V没有输出（检测18V电源）。KEY模块：键盘按键不好用是键盘触点簧片没有弹性（更换键盘）；不在线是键盘模块坏（更换键盘模块）。"},{"type":"short","q":"主控模块白屏、不亮分别可能是什么原因？如何排查？","answer":"主控模块白屏：①A6.5V电源模块故障（检查A6.5V电源模块有没有输出）；②主控模块内部故障（更换主控模块）；③25芯线没有插紧或虚焊、开焊（检测排线）。主控模块不亮：①设备未上电（测量127V电源）；②B6.5V电源模块故障（检查B6.5V电源模块有没有输出）；③主控模块内部短路故障（更换主控模块）；④25芯线没有插紧或虚焊、开焊（检测排线）。"},{"type":"short","q":"某台组合扩音电话不能放音且不能送音，如何排查？","answer":"①语言处理模块坏了，语言处理模块是进行音频处理用的；②语言处理模块亏电造成不能正常工作。判断模块是否亏电：测量电话内部模块X2之8芯插座的4、7脚之间的电压，小于7.2V说明电池没电（正常时为8.2V左右，测量时一定要先拔下8芯插头）；③送话按钮和扬声器同时坏了（讲话时按下送话按钮，送话时正对驻极体话筒，距离10-20CM最佳）。"},{"type":"short","q":"沿线全部扩音电话均不能送音放音，如何排查？","answer":"①如果在有电的情况下不能送音放音，而在断电后就能正常送音放音，说明是音频线和电源正短路造成的，用终端分段法排查是电缆还是电话故障；②如果长时间断电而且一直在用通话，突然间都不能送音放音，那是语言处理模块亏电造成的，恢复沿线供电18V，看是否过段时间正常，若不正常将亏电的语言处理模块更换掉。"},{"type":"short","q":"沿线闭锁台数闪烁（乱闪）的原因是什么？如何处理？","answer":"正常情况下1个闭锁板只应答1个脉冲，如果有某1个或几个闭锁板应答出现故障，使CS模块误以为有多个应答信号，就会出现电话台数乱闪的情况。这种情况应该用终端分段排查闭锁板故障。"},{"type":"short","q":"KTC101系统控制输出点在下位机上时，主控显示“无反馈”但参数上并没有设置反馈输入点，是什么原因？","answer":"上位机通过6、7号线通知下位机上的输出点闭合，下位机会通过6、7号线返回应答信号。由于沿线受潮或破损CAN通讯质量不好，上位机收不到下位机的应答信号，控制器会显示“无反馈”，其实它真正的含义是“无应答”。"},{"type":"short","q":"KTC101系统沿线无显示（沿线电话无显示），如何排查？","answer":"①判断CS模块是否正常；②测量供电的18V是否有输出；③沿线电缆内电源线短路造成电源模块保护，没有输出；④IO端子接线排上18V电源接线是否接的正确；⑤控制器里的闭锁板是否正常。"}]},"yekong":{"choice":[],"judge":[],"fill":[{"type":"fill","q":"工作面供液液压力为______MPa.","segments":["31.5"],"full":"工作面供液液压力为 31.5 MPa."},{"type":"fill","q":"乳化液中的杂质会损坏片阀驱动装置阀芯密封，一旦进回液之间的密封损害，会造成阀芯______，使支架动作缓慢甚至不动作。","segments":["窜液"],"full":"乳化液中的杂质会损坏片阀驱动装置阀芯密封，一旦进回液之间的密封损害，会造成阀芯 窜液 ，使支架动作缓慢甚至不动作。"},{"type":"fill","q":"整机调试时，泵站应设置高压过滤站，其过滤精度为______。","segments":["25μm"],"full":"整机调试时，泵站应设置高压过滤站，其过滤精度为 25μm 。"},{"type":"fill","q":"回液入口前安装带背压保护装置的回液过滤器，其过滤精度为______。","segments":["25μm"],"full":"回液入口前安装带背压保护装置的回液过滤器，其过滤精度为 25μm 。"},{"type":"fill","q":"乳化液箱內安装磁性过滤器，定期清洗乳化液箱的目的是______。","segments":["保证乳化液的洁净度"],"full":"乳化液箱內安装磁性过滤器，定期清洗乳化液箱的目的是 保证乳化液的洁净度 。"},{"type":"fill","q":"泵站到工作面的主回液及支架间主回液管路直径应______主进液管路。","segments":["大于"],"full":"泵站到工作面的主回液及支架间主回液管路直径应 大于 主进液管路。"},{"type":"fill","q":"安全阀的主要作用为防止系统回液压力过高造成______损坏。","segments":["先导阀"],"full":"安全阀的主要作用为防止系统回液压力过高造成 先导阀 损坏。"},{"type":"fill","q":"阀体主进液口用字母______表示，主回液口用字母______表示。","segments":["P","R"],"full":"阀体主进液口用字母 P 表示，主回液口用字母 R 表示。"},{"type":"fill","q":"阀组按照先导类型分为：______、______。","segments":["软密封阀组","硬密封阀组"],"full":"阀组按照先导类型分为： 软密封阀组 、 硬密封阀组 。"},{"type":"fill","q":"过滤配液块组件，简称：配液块。其中粗滤芯的过滤精度是______，精滤芯的过滤精度是______。主进液口用字母______表示，主回液口用字母______表示。","segments":["40um","25um","P","R"],"full":"过滤配液块组件，简称：配液块。其中粗滤芯的过滤精度是 40um ，精滤芯的过滤精度是 25um 。主进液口用字母 P 表示，主回液口用字母 R 表示。"},{"type":"fill","q":"标准阀组与手自一体阀组最主要的区别在于______。","segments":["标准阀组不可以控制流量大小，手自一体阀可以控制流量"],"full":"标准阀组与手自一体阀组最主要的区别在于 标准阀组不可以控制流量大小，手自一体阀可以控制流量 。"},{"type":"fill","q":"阀组分为：______、______、______。","segments":["手自一体阀组","硬密封一体阀组","软密封一体阀组"],"full":"阀组分为： 手自一体阀组 、 硬密封一体阀组 、 软密封一体阀组 。"},{"type":"fill","q":"阀芯窜液的主要原因为______。","segments":["液路中有杂质将阀芯内部的阀垫打坏造成窜液"],"full":"阀芯窜液的主要原因为 液路中有杂质将阀芯内部的阀垫打坏造成窜液 。"},{"type":"fill","q":"手自一体阀组先导供液有______级过滤，过滤精度分别为______。","segments":["2","25μ和40μ"],"full":"手自一体阀组先导供液有 2 级过滤，过滤精度分别为 25μ和40μ 。"},{"type":"fill","q":"过滤器用于给______进行过滤，过滤精度为______。","segments":["先导阀","25μm"],"full":"过滤器用于给 先导阀 进行过滤，过滤精度为 25μm 。"},{"type":"fill","q":"自动反冲洗具有______的作用，能够实现______的功能。","segments":["过滤","不拆卸而清洗滤芯"],"full":"自动反冲洗具有 过滤 的作用，能够实现 不拆卸而清洗滤芯 的功能。"},{"type":"fill","q":"当某一支架动作缓慢在排除控制原因外可以考虑______堵塞严重后流量变小因素，此时可以对此支架进行______。","segments":["过滤器","反冲清洗"],"full":"当某一支架动作缓慢在排除控制原因外可以考虑 过滤器 堵塞严重后流量变小因素，此时可以对此支架进行 反冲清洗 。"},{"type":"fill","q":"反冲洗排污口漏液的原因为______。","segments":["反冲洗阀芯阀垫被打坏"],"full":"反冲洗排污口漏液的原因为 反冲洗阀芯阀垫被打坏 。"},{"type":"fill","q":"乳化液配比一般为：______。","segments":["3%-5%"],"full":"乳化液配比一般为： 3%-5% 。"},{"type":"fill","q":"提高液压支架初撑力的最好方式是______。","segments":["提高乳化泵站压力"],"full":"提高液压支架初撑力的最好方式是 提高乳化泵站压力 。"},{"type":"fill","q":"支架井下安装期间为保证液路洁净度如何进行维护______。","segments":["对液路管口进行防护并在接入液路前进行冲洗，敞开回液管进行放流"],"full":"支架井下安装期间为保证液路洁净度如何进行维护 对液路管口进行防护并在接入液路前进行冲洗，敞开回液管进行放流 。"},{"type":"fill","q":"供液系统中供液带背压保护装置的回液过滤器建议过滤精度______。","segments":["25μm"],"full":"供液系统中供液带背压保护装置的回液过滤器建议过滤精度 25μm 。"},{"type":"fill","q":"供液系统中工作面前过滤装置建议过滤精度应不小于______。","segments":["60μm"],"full":"供液系统中工作面前过滤装置建议过滤精度应不小于 60μm 。"},{"type":"fill","q":"手自一体阀组手柄换向机构不回位，一般是由于______或者腔体内的______引起的。","segments":["手柄","弹簧"],"full":"手自一体阀组手柄换向机构不回位，一般是由于 手柄 或者腔体内的 弹簧 引起的。"},{"type":"fill","q":"动作停止后仍有液流声的原因有______。","segments":["先导阀损坏、阀芯进液密封损坏、阀芯内部有杂质，产生卡死无法回位、阀芯弹簧折断或弯曲不能回位"],"full":"动作停止后仍有液流声的原因有 先导阀损坏、阀芯进液密封损坏、阀芯内部有杂质，产生卡死无法回位、阀芯弹簧折断或弯曲不能回位 。"},{"type":"fill","q":"接头处漏液的原因是______。","segments":["接头O型圈损坏"],"full":"接头处漏液的原因是 接头O型圈损坏 。"},{"type":"fill","q":"阀组各功能均无动作，手放在阀组上可以感受到整体阀组震动，造成此问题的原因为______。","segments":["进液阀芯弹簧失效或被异物卡死不回弹，造成进回液畅通"],"full":"阀组各功能均无动作，手放在阀组上可以感受到整体阀组震动，造成此问题的原因为 进液阀芯弹簧失效或被异物卡死不回弹，造成进回液畅通 。"},{"type":"fill","q":"先导阀后面漏液，可以更换______更换后恢复正常","segments":["先导阀之间的密封圈和后堵头","。"],"full":"先导阀后面漏液，可以更换 先导阀之间的密封圈和后堵头 更换后恢复正常 。"},{"type":"fill","q":"反冲洗装置过滤器滤出的杂质聚积在______，聚积过多时会影响______，此时需要滤芯进行反冲，去除表面附着杂质。","segments":["两个滤芯外表面","管道内液体流速"],"full":"反冲洗装置过滤器滤出的杂质聚积在 两个滤芯外表面 ，聚积过多时会影响 管道内液体流速 ，此时需要滤芯进行反冲，去除表面附着杂质。"},{"type":"fill","q":"反冲洗两个动作同时触发会造成乳化液流______无法实现反冲。","segments":["完全关闭"],"full":"反冲洗两个动作同时触发会造成乳化液流 完全关闭 无法实现反冲。"},{"type":"fill","q":"用户配置乳化液所使用的乳化油最低应符合______标准。","segments":["MT76-2011"],"full":"用户配置乳化液所使用的乳化油最低应符合 MT76-2011 标准。"},{"type":"fill","q":"手自一体片阀每一片由四部分组成，包括______。","segments":["主阀体、转换板、驱动装置、手柄"],"full":"手自一体片阀每一片由四部分组成，包括 主阀体、转换板、驱动装置、手柄 。"},{"type":"fill","q":"手自一体阀片主要由______组成。","segments":["电磁先导阀、主阀、手柄、接头"],"full":"手自一体阀片主要由 电磁先导阀、主阀、手柄、接头 组成。"},{"type":"fill","q":"标准阀组配置______个单向阀，______个安全阀。","segments":["2","1"],"full":"标准阀组配置 2 个单向阀， 1 个安全阀。"},{"type":"fill","q":"标准阀组给液压缸供液流量的大小是通过______控制。","segments":["先导阀阀芯"],"full":"标准阀组给液压缸供液流量的大小是通过 先导阀阀芯 控制。"},{"type":"fill","q":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa______450L/min、900L/min______25um","segments":["，单个滤芯的额定流量为：","，过滤精度为：","。"],"full":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa ，单个滤芯的额定流量为： 450L/min、900L/min ，过滤精度为： 25um 。"},{"type":"fill","q":"将手动反冲洗的两个手柄同时置于反冲位置，______实现反冲。","segments":["无法"],"full":"将手动反冲洗的两个手柄同时置于反冲位置， 无法 实现反冲。"},{"type":"fill","q":"先导阀后面漏液，可以更换______更换后恢复正常。","segments":["先导阀之间的密封圈和后堵头"],"full":"先导阀后面漏液，可以更换  先导阀之间的密封圈和后堵头  更换后恢复正常  。"},{"type":"fill","q":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa______450L/min、900L/min______25um。","segments":["，单个滤芯的额定流量为：","，过滤精度为："],"full":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa  ，单个滤芯的额定流量为：  450L/min、900L/min  ，过滤精度为：  25um  。"}],"short":[{"type":"short","q":"单向阀的作用是什么？","answer":"保持先导阀内部液体正向流动。"},{"type":"short","q":"安全阀的作用是什么？","answer":"防止系统回液压力过高导致先导阀损坏，当回液压力超过6MPA时安全阀打开。"},{"type":"short","q":"使用现场支架时出现动作缓慢，怎么办？","answer":"支架动作缓慢分为两种情况。1.一开始有力，逐渐缓慢。这是一般出现在先导滤芯出现故障，更换后查看。2.一直缓慢。这是一般出现在反冲洗滤芯中，进行支架反冲洗实验，如果无法反冲，可以商讨更换滤芯。如果可以反冲，支架的缓慢动作可以缓解。"},{"type":"short","q":"供液系统包含的设备有哪些？","answer":"清水过滤器、自动配比装置、供液主管路高压过滤站（精度为25μ）、带背压保护装置的回液过滤器（精度建议为25μ）、封闭式油箱、反冲洗过滤器（精度为25μ）及进入工作面前过滤装置（精度至少为60μ）。"},{"type":"short","q":"手自一体阀组出现“呲呲”响声，是什么问题？","answer":"手自一体阀芯串液或者手自一体先导阀串液。手自一体阀组中间位置有两个先导滤芯，使用先导滤芯堵头堵住其中，判断是否有声音如果声音还在则为阀芯窜液，如无声音则为先导阀窜液。"},{"type":"short","q":"标准阀组出现“呲呲”响声，是什么问题？","answer":"阀芯串液或者先导阀串液，使用阀组琴键按键，轻轻地按动，如果出现声音变小，或者消失，故障点就在此功能上。用手抚摸标准阀组侧面温度，如果出现某一功能附近温度有所异常，偏高。故障点在温度较高地带附近。如果是阀芯串液，更换阀芯。如果是先导阀串液，只能更换先导阀。"},{"type":"short","q":"安全阀处流液为什么原因？","answer":"回液压力大于6Mpa，安全阀自动泄压，处理方法，检查背压过高原因。"},{"type":"short","q":"使用现场支架时阀组各功能均无动作，手放在阀组上可以感受到整体阀组震动，分析什么原因引起？","answer":"1、进回液形成回路畅通。2、弹簧失效进液阀芯不回弹3、阀芯出液口异物卡死造成不回弹（支架厂焊点）。"},{"type":"short","q":"过滤器的作用是什么？","answer":"由于先导阀中液流通径很小，所以对工作介质的清洁度要求非常高，滤芯可以更好地保证液体清洁。滤芯采用整体插装结构，拆换更方便"},{"type":"short","q":"反冲洗排污口漏液，这是什么问题？","answer":"1.反冲顶部有两个阀芯，无法回复到0位。更换阀芯。2.先导阀下底部有滤芯损坏。更滑反冲洗先导阀。"},{"type":"short","q":"反冲洗不动作是什么原因？","answer":"驱动器坏、接口设置错误、电磁驱动器坏、 废液回收造成背压过大，损坏阀芯。"},{"type":"short","q":"图 1 为自动反冲洗中位状态，请简述自动反冲洗在工作位时的乳化液走向，并用铅笔在图 1 中画出。 图1","answer":"按动电控控制先导阀关闭对应主阀阀芯的进液通道，回液通道打开，此时排废液口与滤芯腔连通，高压液由滤芯内部向外流动，达到冲洗滤芯表面的目的，杂质随液流排出，放开按钮冲洗动作结束。两个按钮轮换动作，将两路滤芯冲洗干净。图 2 为示意图。 图2"},{"type":"short","q":"此产品名称叫什么？是哪种阀组中的产品？此状态为什么状态？简述此状态液流原理。","answer":"阀芯组件DN20大阀芯、标准阀、工作位状态、先导工作液推动滑套，回液密封，进液打开，乳化液从进液位置进入阀芯，流向油缸触发油缸动作。"},{"type":"short","q":"此产品名称叫什么？是哪种阀组中的产品？此状态为什么状态？简述此状态液流原理。","answer":"手自一体阀阀芯、手自一体阀组、工作位状态、摆动手柄推动滑套，回液密封，进液打开，乳化液从进液位置进入阀芯，流向油缸触发油缸动作。"},{"type":"short","q":"使用现场支架时出现动作一直缓慢，怎么办？","answer":"这是一般出现在反冲洗滤芯中，进行支架反冲洗实验，如果无法反冲，可以商讨更换滤芯。如果可以反冲，支架的缓慢动作可以缓解。"},{"type":"short","q":"图 1 为自动反冲洗中位状态，请简述自动反冲洗在工作位时的乳化液走向，并用铅笔在图 1 中画出。","answer":"图1 答：按动电控控制先导阀关闭对应主阀阀芯的进液通道，回液通道打开，此时排废液口与滤芯腔连通，高压液由滤芯内部向外流动，达到冲洗滤芯表面的目的，杂质随液流排出，放开按钮冲洗动作结束。两个按钮轮换动作，将两路滤芯冲洗干净。图 2 为示意图。 图2"}]},"diankong":{"choice":[],"judge":[],"fill":[{"type":"fill","q":"支架服务器的编号固定为：______。","segments":["510"],"full":"支架服务器的编号固定为： 510 。"},{"type":"fill","q":"V2版控制器共有______个按键，V4控制器面板有______个功能按键。","segments":["26","20"],"full":"V2版控制器共有 26 个按键，V4控制器面板有 20 个功能按键。"},{"type":"fill","q":"V2支架控制器操作界面上有______个按键，其中______个支架动作按键。","segments":["26","12"],"full":"V2支架控制器操作界面上有 26 个按键，其中 12 个支架动作按键。"},{"type":"fill","q":"V2控制器采用______方式进行通讯。","segments":["CAN通讯"],"full":"V2控制器采用 CAN通讯 方式进行通讯。"},{"type":"fill","q":"V2控制器背部共计9个接口，分别为______。","segments":["右邻架、电磁阀、压力、声光、左邻架、HUB、红外、行程、备用"],"full":"V2控制器背部共计9个接口，分别为 右邻架、电磁阀、压力、声光、左邻架、HUB、红外、行程、备用 。"},{"type":"fill","q":"V2控制器六芯插口各芯意义：______。","segments":["1：A12V，2：A﹣，3:B12V，4:空，5:CANH，6:B-，7：CAN"],"full":"V2控制器六芯插口各芯意义： 1：A12V，2：A﹣，3:B12V，4:空，5:CANH，6:B-，7：CAN 。"},{"type":"fill","q":"V2控制器设置______后才会显示键盘配置。","segments":["初始配置"],"full":"V2控制器设置 初始配置 后才会显示键盘配置。"},{"type":"fill","q":"V2版支架控制器跟机密码为______。","segments":["1688"],"full":"V2版支架控制器跟机密码为 1688 。"},{"type":"fill","q":"V2版支架控制器超级密码为______。","segments":["6222"],"full":"V2版支架控制器超级密码为 6222 。"},{"type":"fill","q":"V2版支架控制器修改参数密码为______。","segments":["6516"],"full":"V2版支架控制器修改参数密码为 6516 。"},{"type":"fill","q":"V4控制器操作界面上有______个按键，其中______个支架动作按键。","segments":["20","6"],"full":"V4控制器操作界面上有 20 个按键，其中 6 个支架动作按键。"},{"type":"fill","q":"V4控制器采用______方式进行通讯。","segments":["以太网通讯"],"full":"V4控制器采用 以太网通讯 方式进行通讯。"},{"type":"fill","q":"网络版控制器用______按键进行翻页。","segments":["辅助"],"full":"网络版控制器用 辅助 按键进行翻页。"},{"type":"fill","q":"V4控制器背部共计9个接口，分别为______。","segments":["右邻架、电磁阀、压力、声光、左邻架、网口、红外、行程、备用"],"full":"V4控制器背部共计9个接口，分别为 右邻架、电磁阀、压力、声光、左邻架、网口、红外、行程、备用 。"},{"type":"fill","q":"控制器防护等级为______。","segments":["IP68"],"full":"控制器防护等级为 IP68 。"},{"type":"fill","q":"控制器的2个模拟量接口分别时是______。","segments":["压力、行程"],"full":"控制器的2个模拟量接口分别时是 压力、行程 。"},{"type":"fill","q":"控制器四芯CAN接口各芯定义为______。","segments":["1#为 A12V，2#为 AGND，3#为 CANL，4#为 CANH"],"full":"控制器四芯CAN接口各芯定义为 1#为 A12V，2#为 AGND，3#为 CANL，4#为 CANH 。"},{"type":"fill","q":"控制器四芯接口定义：______。","segments":["1#12V+,2#GND,3#和4#模拟量或CAN"],"full":"控制器四芯接口定义： 1#12V+,2#GND,3#和4#模拟量或CAN 。"},{"type":"fill","q":"控制器接口与电磁驱动器配接公式为______。","segments":["2n、2n-1"],"full":"控制器接口与电磁驱动器配接公式为 2n、2n-1 。"},{"type":"fill","q":"自动反冲洗具有______的作用，能够实现不拆卸而清洗滤芯的功能。","segments":["过滤"],"full":"自动反冲洗具有 过滤 的作用，能够实现不拆卸而清洗滤芯的功能。"},{"type":"fill","q":"电控操作支架时，被选中支架未动作时，支架上的声光报警器______，当选中支架动作时，______。","segments":["红灯常亮，发出蜂鸣","声光报警器红蓝灯交替闪烁，发出蜂鸣"],"full":"电控操作支架时，被选中支架未动作时，支架上的声光报警器 红灯常亮，发出蜂鸣 ，当选中支架动作时， 声光报警器红蓝灯交替闪烁，发出蜂鸣 。"},{"type":"fill","q":"监控主机的接口配置为1路______，2路______，3路______和1路______。","segments":["CAN","RS485","USB","以太网"],"full":"监控主机的接口配置为1路 CAN ，2路 RS485 ，3路 USB 和1路 以太网 。"},{"type":"fill","q":"液压支架在自动移架过程中执行的动作顺序是______。","segments":["降—移—升"],"full":"液压支架在自动移架过程中执行的动作顺序是 降—移—升 。"},{"type":"fill","q":"在执行邻架升柱时操作步骤：先按______键，然后长按______键。","segments":["< 或 ＞","升柱"],"full":"在执行邻架升柱时操作步骤：先按 < 或 ＞ 键，然后长按 升柱 键。"},{"type":"fill","q":"在执行成组推溜时操作步骤：先按______键、然后按______键、最后按______键。","segments":["《 或 》","推溜","启动"],"full":"在执行成组推溜时操作步骤：先按 《 或 》 键、然后按 推溜 键、最后按 启动 键。"},{"type":"fill","q":"在进行工作面设备维修调试时，维修人员所在的支架和左右邻架不允许实施任何动作，为此系统设置了闭锁功能。此操作本架及邻架控制器硬件驱动电路的电源被切断，禁止所有电磁阀动作。用程序帮传输程序时，一般用的接口为______口或______口。","segments":["声光","备用"],"full":"在进行工作面设备维修调试时，维修人员所在的支架和左右邻架不允许实施任何动作，为此系统设置了闭锁功能。此操作本架及邻架控制器硬件驱动电路的电源被切断，禁止所有电磁阀动作。用程序帮传输程序时，一般用的接口为 声光 口或 备用 口。"},{"type":"fill","q":"自动跟机一般有______和______两种方式。","segments":["中部跟机","全面跟机"],"full":"自动跟机一般有 中部跟机 和 全面跟机 两种方式。"},{"type":"fill","q":"控制器的控制方式有______。","segments":["本架控制、邻架控制、成组控制"],"full":"控制器的控制方式有 本架控制、邻架控制、成组控制 。"},{"type":"fill","q":"矿用本质安全型电源箱的额定输入是______，额定输出电压为______，输出电流______。","segments":["AC127V","DC12V","1.75A"],"full":"矿用本质安全型电源箱的额定输入是 AC127V ，额定输出电压为 DC12V ，输出电流 1.75A 。"},{"type":"fill","q":"一个电源箱在保证稳定工作的前提下，最多可以给______个控制器供电。","segments":["3-8"],"full":"一个电源箱在保证稳定工作的前提下，最多可以给 3-8 个控制器供电。"},{"type":"fill","q":"汇接器HUB接口扩展功能，连接6芯线缆，提供______。","segments":["3路模拟量、2路CAN通讯接口"],"full":"汇接器HUB接口扩展功能，连接6芯线缆，提供 3路模拟量、2路CAN通讯接口 。"},{"type":"fill","q":"汇接器可以接入______3种传感器。","segments":["位移传感器 压力传感器 倾角传感器"],"full":"汇接器可以接入 位移传感器 压力传感器 倾角传感器 3种传感器。"},{"type":"fill","q":"D版遥控器共有______个按键。","segments":["22"],"full":"D版遥控器共有 22 个按键。"},{"type":"fill","q":"遥控器在按下自保按键时最多可同时执行______个动作。","segments":["六"],"full":"遥控器在按下自保按键时最多可同时执行 六 个动作。"},{"type":"fill","q":"遥控器按下______键用来关机和开机。","segments":["停止"],"full":"遥控器按下 停止 键用来关机和开机。"},{"type":"fill","q":"遥控器和控制器对码成功后，对码指示灯变为______。","segments":["绿色"],"full":"遥控器和控制器对码成功后，对码指示灯变为 绿色 。"},{"type":"fill","q":"D版遥控器开机后按动______键执行菜单参数翻页动作。","segments":["启动"],"full":"D版遥控器开机后按动 启动 键执行菜单参数翻页动作。"},{"type":"fill","q":"用遥控器控制支架控制器的过程分为三部分：______。","segments":["对码、进行支架动作或设置参数、解除对码"],"full":"用遥控器控制支架控制器的过程分为三部分： 对码、进行支架动作或设置参数、解除对码 。"},{"type":"fill","q":"遥控器操作支架动作时，控制器动作又可划分为：______三种类型。","segments":["本架动作、自保动作、成组动作"],"full":"遥控器操作支架动作时，控制器动作又可划分为： 本架动作、自保动作、成组动作 三种类型。"},{"type":"fill","q":"支架遥控器具有______和______功能用于实现与控制器对码。","segments":["红外","无线"],"full":"支架遥控器具有 红外 和 无线 功能用于实现与控制器对码。"},{"type":"fill","q":"无线遥控器在与支架控制器对码成功之后，状态可分为两种：______。","segments":["非动作状态以及动作状态"],"full":"无线遥控器在与支架控制器对码成功之后，状态可分为两种： 非动作状态以及动作状态 。"},{"type":"fill","q":"电磁驱动器可以提供______路输出和一路______接口。","segments":["30","can"],"full":"电磁驱动器可以提供 30 路输出和一路 can 接口。"},{"type":"fill","q":"行程传感器检测量程为______，输出电压为______。","segments":["0~最大行程","DC0.5～4.5V"],"full":"行程传感器检测量程为 0~最大行程 ，输出电压为 DC0.5～4.5V 。"},{"type":"fill","q":"行程传感器的精度为______。","segments":["毫米"],"full":"行程传感器的精度为 毫米 。"},{"type":"fill","q":"为配合油缸使用，除了需要配备行程传感器外，还需配备______行程转接插座","segments":["磁环、","。"],"fu 全生产的紧急情况时，需要立即停止或禁止所有支架的自动动作，他应该使用 急停 功能。"},{"type":"fill","q":"支架遥控器的充电座最多同时支持______台支架遥控器同时充电。","segments":["5"],"full":"支架遥控器的充电座最多同时支持 5 台支架遥控器同时充电。"},{"type":"fill","q":"自动反冲洗具有______的作用，能够实现______。","segments":["过滤","不拆卸而清洗滤芯的功能"],"full":"自动反冲洗具有 过滤 的作用，能够实现 不拆卸而清洗滤芯的功能 。"},{"type":"fill","q":"在自动跟机时，不通过修改参数停止跟机应______跟机自动停止。","segments":["拍下急停按钮并打上闭锁"],"full":"在自动跟机时，不通过修改参数停止跟机应 拍下急停按钮并打上闭锁 跟机自动停止。"},{"type":"fill","q":"在使用自动跟机移架时，一般分为两种，分别是______。","segments":["后滚筒移架、机身移架"],"full":"在使用自动跟机移架时，一般分为两种，分别是 后滚筒移架、机身移架 。"},{"type":"fill","q":"数据转换器有______个电源模块。","segments":["4"],"full":"数据转换器有 4 个电源模块。"},{"type":"fill","q":"华宁电液控系统电源采用双侧四路供电，每侧两路电源分别给______和______供电。","segments":["控制器","阀及传感器"],"full":"华宁电液控系统电源采用双侧四路供电，每侧两路电源分别给 控制器 和 阀及传感器 供电。"},{"type":"fill","q":"V2支架控制器提供9路接口，其中2路______、7路______通讯。","segments":["模拟量","CAN"],"full":"V2支架控制器提供9路接口，其中2路 模拟量 、7路 CAN 通讯。"},{"type":"fill","q":"自动补压参数中补压下限、补压上限、初撑压力参数设置是的大小关系：______。","segments":["补压下限＜补压上限＜初撑压力"],"full":"自动补压参数中补压下限、补压上限、初撑压力参数设置是的大小关系： 补压下限＜补压上限＜初撑压力 。"},{"type":"fill","q":"工作面液压支架电液控系统乳化液配比浓度应达到______。","segments":["3%~5%"],"full":"工作面液压支架电液控系统乳化液配比浓度应达到 3%~5% 。"},{"type":"fill","q":"自动跟机允许与否密码为______，煤机身长为10，收护帮的距离应______，移架的距离应______，推溜距离为应______。","segments":["1688","> 5","> 5","> 5+移架范围"],"full":"自动跟机允许与否密码为 1688 ，煤机身长为10，收护帮的距离应 > 5 ，移架的距离应 > 5 ，推溜距离为应 > 5+移架范围 。"},{"type":"fill","q":"电液控获取采煤机位置的两种方式为______和______。","segments":["红外","编码器方式"],"full":"电液控获取采煤机位置的两种方式为 红外 和 编码器方式 。"},{"type":"fill","q":"电控操作支架时，支架未动，可通过观察______来判断先导阀是否工作。","segments":["先导阀上信号灯是否亮"],"full":"电控操作支架时，支架未动，可通过观察 先导阀上信号灯是否亮 来判断先导阀是否工作。"},{"type":"fill","q":"控制器急停按钮拍下是闭锁______控制器。","segments":["全工作面"],"full":"控制器急停按钮拍下是闭锁 全工作面 控制器。"},{"type":"fill","q":"控制器闭锁按钮拍下是闭锁______控制器。","segments":["3台"],"full":"控制器闭锁按钮拍下是闭锁 3台 控制器。"},{"type":"fill","q":"V4版控制器用汇接器接入______接口进行扩展。","segments":["声光/红外"],"full":"V4版控制器用汇接器接入 声光/红外 接口进行扩展。"},{"type":"fill","q":"汇接器（大/小型）最多可扩展接入______路模拟量。","segments":["4"],"full":"汇接器（大/小型）最多可扩展 "fill","q":"用户配置乳化液所使用的乳化油最低应符合______标准。","segments":["MT76-2011"],"full":"用户配置乳化液所使用的乳化油最低应符合 MT76-2011 标准。"},{"type":"fill","q":"六转四两通共两种规格型号，LBK4-L-6的CAN线序号为______和______，主要用于______；LBK4-L-6-01的CAN线序号为______和______，主要用于______。","segments":["6","7","服务器CAN数据传输","5","7","控制器CAN数据传输"],"full":"六转四两通共两种规格型号，LBK4-L-6的CAN线序号为 6 和 7 ，主要用于 服务器CAN数据传输 ；LBK4-L-6-01的CAN线序号为 5 和 7 ，主要用于 控制器CAN数据传输 。"},{"type":"fill","q":"光电复合线缆引脚定义______、______、______、______、______、______、______。","segments":["A#A相电","B#B相电","C#相电","1#数据光纤","2#音频光纤","3#闭锁光纤","G#接地"],"full":"光电复合线缆引脚定义 A#A相电 、 B#B相电 、 C#相电 、 1#数据光纤 、 2#音频光纤 、 3#闭锁光纤 、 G#接地 。"},{"type":"fill","q":"高配版信号转换器的４个接口定义为：______。","segments":["光电复合插座、隔爆８芯快插接口、隔爆四芯光纤快插口、A４喇叭嘴接口"],"full":"高配版信号转换器的４个接口定义为： 光电复合插座、隔爆８芯快插接口、隔爆四芯光纤快插口、A４喇叭嘴接口 。"},{"type":"fill","q":"信号转换器的指示灯E表示______红灯常亮、指示灯DA表示______、指示灯G2表示______。","segments":["千兆转换模块","与数据转换器连接状态","与集控中心连接状态"],"full":"信号转换器的指示灯E表示 千兆转换模块 红灯常亮、指示灯DA表示 与数据转换器连接状态 、指示灯G2表示 与集控中心连接状态 。"},{"type":"fill","q":"数据转换器配置有6个接口，分别为3个8芯插口为______使用，1个6芯插口为______，2个光电复合缆接口为______使用。","segments":["左、右连接控制器及扩展通讯","选配无线信号接收器（无线AP）使用","接上台数据转换器X6口/末端接光电终端、接下台数据转换器X5口/接信号转换器"],"full":"数据转换器配置有6个接口，分别为3个8芯插口为 左、右连接控制器及扩展通讯 使用，1个6芯插口为 选配无线信号接收器（无线AP）使用 ，2个光电复合缆接口为 接上台数据转换器X6口/末端接光电终端、接下台数据转换器X5口/接信号转换器 使用。"},{"type":"fill","q":"控制器接入新版红外传感器后控制器报“红外接收通讯错误”，此时需要修改参数中______进行处理。","segments":["HUB120允许/禁止"],"full":"控制器接入新版红外传感器后控制器报“红外接收通讯错误”，此时需要修改参数中 HUB120允许/禁止 进行处理。"},{"type":"fill","q":"为配合油缸使用，除了需要配备行程传感器外，还需配备______行程转接插座。","segments":["磁环、"],"full":"为配合油缸使用，除了需要配备行程传感器外，还需配备  磁环、  行程转接插座  。"},{"type":"fill","q":"支架控制器______","segments":["将采煤机位置信息报送给支架服务器，由支架服务器来判断采煤机的位置，并最终发送至所有支架控制器进行显示。"],"full":"支架控制器  将采煤机位置信息报送给支架服务器，由支架服务器来判断采煤机的位置，并最终发送至所有支架控制器进行显示。"},{"type":"fill","q":"倾角传感器采用______原理，测量支架姿态。","segments":["三轴陀螺仪"],"full":"倾角传感器采用  三轴陀螺仪  原理，测量支架姿态  。"},{"type":"fill","q":"采高传感器采用______原理，测量支架高度。","segments":["帕斯卡"],"full":"采高传感器采用  帕斯卡  原理，测量支架高度  。"},{"type":"fill","q":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa______450L/min______25um。","segments":["，单个滤芯的额定流量为：","，过滤精度为："],"full":"反冲洗过滤装置用于支架主进油管路上，起到对乳化液的过滤，它的额定工作压力：31.5Mpa  ，单个滤芯的额定流量为：  450L/min  ，过滤精度为：  25um  。"}],"short":[{"type":"short","q":"V2版控制器遇到“全局参数不一致”故障如何进行处理","answer":"1、选择一架参数设置正确控制器 使用如下命令传送参数表：本架服务>传送参数表->全面->确认。 2、可使用如下命令清除：本架服务-> 清除运行信。"},{"type":"short","q":"遇到煤机位置跳架故障，从硬件、参数两个方面描述下处理过程","answer":"1、查看红外接收器、红外发射器是否有煤泥遮挡。2、查看红外接收器线缆以及红外接收器是否受损。3、查看红外发射器供电线缆是否虚接。4、查看本架参数红外是能是否打开。"},{"type":"short","q":"采煤机位置不能显示，分析其原因。","answer":"1、红外发射器三个指示灯都不亮，需检查发射器供电电源及线路。2、绿灯亮而其他灯不亮，应为发射器自身故障3、发射器上有大量煤泥，遮挡信号发出。"},{"type":"short","q":"简述网络版控制器停止跟机的５种方式。","answer":"1、急停＋闭锁。2、急停+跟机动作。3、工况＋辅助，点击跟机，点击确定。4、操作台拍急停。5、Web软件关闭跟机。"},{"type":"short","q":"高配版本控制器与遥控器对码不成功，描述排查方法。","answer":"1、查看遥控器版本是否正确。2、查看声光报警器是否正常工作。3、确认遥控器与声光报警器程序是否匹配。4、查看声光线缆是否受损。"},{"type":"short","q":"液压支架执行电控动作时声光报警器没有声音和灯光提示，请简述排查方法。","answer":"1、使用万用表测量声光报警器与控制器之间的连接器各芯的通断是否正常。2、测量供电电压，若低于DC9V则无法保障声光报警器的正常工作。3、检查支架控制器中“声光接口”等参数设置。"},{"type":"short","q":"简述D版遥控器的两种对码方式？","answer":"将遥控器对准支架控制器，然后长按遥控器上的对码键2秒以上，遥控器即可与支架控制器对码成功；或按压数字键输入架号，按确认键，可实现快速与对应控制器对码。"},{"type":"short","q":"电液控软件的立柱压力、推移行程等数据无显示怎么排查处理？","answer":"1、查看工作面电液控是否上电。2、查看电液控主机到工作面支架服务器数据是否正常。3、查看电液控主机到工作面支架服务器之间的线缆是否有问题。4、重启或重装电液控软件。"},{"type":"short","q":"电液控软件的立柱压力、行程等数据无显示怎么排查处理？","answer":"1、查看工作面电液控是否上电。2、查看电液控主机到工作面支架服务器数据通讯是否正常。（可查看右下角支架服务器指示灯，绿色正常，红色中断）3、查看电液控主机到工作面支架服务器之间的线缆是否有问题。（CAN线、4转6接头）4、重启或者重装电液控软件。"},{"type":"short","q":"当显示屏出现此故障信息，造成此故障信息的原因有哪些？怎么排查？怎么处理？","answer":"1、参数服务器位置设置值不一致；2、架间连接不正确；3、架号范围设置不正确；4、线缆损坏；5、线缆接头松动、进水等可使用如下命令清除：本架服务->清除运行信息。同时可以使用命令：本架服务->邻架通信检测，确定故障支架位置。下达该命令后，可以在“运行信息”得到检测信息，通信范围”指示通信正确的架号范围；“左右架数”显示以本架为中心，左右各通信正确的架数。"},{"type":"short","q":"请简述遥控器上“自保键”、“+键”和“—键”、“对码键”的作用？","answer":"自保键”，当需要多个动作同时执行时，可先按一下“自保键”进入自保模式，此时所有动作不需要一直长按，只需要按一下即可，需要停止时再按一下。“+键”和“—键”用于切换控制的架号。“对码键”在使用遥控器时需要通过对码键对码，对码成功后才可以使用遥控器。“对码键”有时还可以用于切换主次功能。"},{"type":"short","q":"简述D版遥控器参数设置方法","answer":"1、按启动键，进入菜单。2、按左成组或右成组键，选择参数页面。3、按+或-键，选择菜单项。4、按确认键进入输入密码状态界面。5、按数字键输入密码值后按确认键，又进入菜单显示界面。6、再次按确认键，输入参数的新值(或C键进行增加，D键进行减少)，按确认键进入确认界面，按C键完成参数修改，按D键取消参数修改。7、参数修改完成，菜单显示修改后的参数。8、输入过程中如要中止退出，可按停止键退出，原值不变。"},{"type":"short","q":"简述D版遥控器自动移架及自动补压操作步骤？","answer":"1、对码成功后按下确认键确认是自动模式。2、自动移架:自动模式下按下移架键提示自动移架是否启动，按下启动键自动移架启动。3、自动补压:自动模式下按下升柱键提示自动补压是否启动，按下启动键自动补压启动。"},{"type":"short","q":"人员定位标签权限分为几级，简述说明各级别权限功能。","answer":"3级；1级：只要靠近正在进行自动移架的支架立即闭锁不恢复；2级：靠近后闭锁，在闭锁时间内离开恢复动作，超过闭锁时间不恢复动作； 3级：只具备定位功能，不闭锁支架。"},{"type":"short","q":"简单描述A7版网络版电液控系统中数据转换器的功能？","answer":"1、电源转换功能，能够将输入AC127V电源转换成8路DC12V电源，用于给支架控制器(左3路，右3路)、通讯电话、视频监控设备等供电；2、网络数据交换功能：①能够实现相邻数据转换器间、监控设备、无线AP等标准网络数据交换；②能够实现V4版支架控制器双线网络数据交换功能;③能够实现与通讯电话间数字音频数据交换功能；3、音频采集编码功能；4、光电闭锁转换功能。"},{"type":"short","q":"简单描述A7版网络版电液控系统中信号转换器的功能？","answer":"主要功能：1、千兆光口数据交换。2、网络控制。3、具有5G/WIFI等无线通信扩展功能。4、系统提供沿线设备供电功能。5、接入三相127V以及光纤信号\"。"},{"type":"short","q":"文字说明工作面机头3个折返点和中部首架计算条件，说明机头6个工序名称。","answer":"1、三角煤小号端时，折返点2>折返点1，否则参数报错，无法正常启动三角煤工艺。2、三角煤小号端时，折返点3≥折返点1+推溜距离+（煤机身长+1）÷2，否者参数报错，无法正常启动三角煤工艺。3、三角煤小号端时，折返点3≥中部首架＋6。4、三角煤大号端时，折返点6>折返点5，否者参数报错，无法正常启动三角煤工艺。5、三角煤大号端时，折返点4≤折返点6-推溜距离-（煤机身长+1）÷2。6、三角煤小号端时，折返点6≥中部首架＋6。 1）机头第一刀 “正常”，2）割底煤 “割底” ，3）斜切进刀 “斜切” 4）第二刀上刀煤 “进刀” ，5）清浮煤 “扫煤”，6）正常割煤 “正常”。"},{"type":"short","q":"已知：综采工作面150架，有1级护帮无伸缩梁（含端头）；顶底板情况良好；煤机机身长度10个支架。矿方要求提高采煤效率，缩短单刀采煤时长。请按以下要求作答。 （1）请结合工艺时序图（画出工序图），描述你设置的折返点对应的架号，设置合理的中部首架、中部末架，制定自动跟机相关的距离和范围参数。（2）提高采煤效率，缩短单刀采煤时长的关键因素是什么？","answer":"关键指标：煤机速度、泵站流量、机身移架、隔架移架、减少三角煤范围。"},{"type":"short","q":"已知：综采工作面150架，有1级护帮无伸缩梁（含端头）；顶底板情况良好；煤机机身长度10个支架。矿方要求提高采煤效率，缩短单刀采煤时长。请按以下要求作答。","answer":"（1）请结合工艺时序图（画出工序图），描述你设置的折返点对应的架号，设置合理的中部首架、中部末架，制定自动跟机相关的距离和范围参数。（2）提高采煤效率，缩短单刀采煤时长的关键因素是什么？ 答：关键指标：煤机速度、泵站流量、机身移架、隔架移架、减少三角煤范围。"}]},"zidonghua":{"choice":[],"judge":[],"fill":[{"type":"fill","q":"无线基站默认IP地址是：______。","segments":["192.168.1.254"],"full":"无线基站默认IP地址是： 192.168.1.254 。"},{"type":"fill","q":"无线基站默认账号是：______，密码是：______。","segments":["admin","admin"],"full":"无线基站默认账号是： admin ，密码是： admin 。"},{"type":"fill","q":"无线基站有______个外接端口，分别是：______。","seg
